<style>
:root{--bg:#f1f6f2;--bg2:#e6f0e9;--card:#fff;--tx:#0e2a1a;--mu:#587063;--bd:#dce8df;--g1:#14702f;--g2:#2fa24f;--g3:#7ac142;--rd:#d6453d;--bl:#2563eb;--am:#e8920a;--pu:#6d3df0;--sh:0 8px 28px rgba(14,60,30,.08);--sh2:0 14px 40px rgba(14,60,30,.14);--r:22px;--chip:#eef5f0;--glass:rgba(255,255,255,.72)}
:root[data-theme=dark]{--bg:#0a1511;--bg2:#0e1d17;--card:#10211a;--tx:#e8f3ec;--mu:#8ea99a;--bd:#1d3829;--rd:#ff7a6e;--bl:#6aa0ff;--am:#ffb23d;--pu:#a98bff;--sh:0 8px 28px rgba(0,0,0,.35);--sh2:0 14px 40px rgba(0,0,0,.5);--chip:#15291f;--glass:rgba(16,33,26,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#splash,#login{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#e9f6e4 0,transparent 60%),linear-gradient(180deg,#f7fbf6,#e8f2ea)}
:root[data-theme=dark] #splash,:root[data-theme=dark] #login{background:radial-gradient(1000px 600px at 50% -10%,#143323 0,transparent 60%),linear-gradient(180deg,#0b1712,#08110d)}
#splash{z-index:120;transition:opacity .5s}#splash.hide{opacity:0;pointer-events:none}
.logoBig{width:min(78vw,460px);height:auto;display:block}
.lgCard{background:#fff;border-radius:28px;padding:22px 26px;box-shadow:var(--sh2)}
.sp-bar{width:140px;height:4px;border-radius:4px;background:#14702f22;margin-top:22px;overflow:hidden;position:relative}
.sp-bar::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,var(--g2),var(--g3));border-radius:4px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
.crt{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);opacity:.9}
.crt b{color:var(--g1);font-weight:800;letter-spacing:.2em}
:root[data-theme=dark] .crt b{color:var(--g3)}
#splash .crt{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.lbox{width:100%;max-width:410px;background:var(--card);border-radius:30px;padding:26px 24px 22px;box-shadow:var(--sh2);text-align:center}
.lbox .lgw{background:#fff;border-radius:22px;padding:14px 16px;margin:-6px 0 14px;box-shadow:inset 0 0 0 1px var(--bd)}
.lbox .logoBig{width:100%;max-width:330px;margin:0 auto}
.lbox h1{margin:6px 0 2px;font-size:22px;letter-spacing:-.3px}
.lbox p{margin:0 0 16px;color:var(--mu);font-size:14px}
.lbox input{margin-bottom:10px;text-align:left}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;width:100%;min-height:50px}
input:focus,select:focus{outline:2px solid var(--g2);outline-offset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;border:0;font-weight:700;background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;box-shadow:0 8px 20px rgba(20,112,47,.3);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.6}
.btn.sec{background:var(--chip);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.btn.sm{min-height:38px;padding:0 14px;border-radius:12px;font-size:13px}
.btn.dng{background:rgba(214,69,61,.12);color:var(--rd);box-shadow:none}
.lerr{color:var(--rd);min-height:20px;margin-top:10px;font-size:14px}
#app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top .mini{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--bd);flex:none}
.top .mini img{width:30px;height:auto}
.top .tt{flex:1;min-width:0;line-height:1.15}.top .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .tt span{font-size:12px;color:var(--mu)}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:none}
.ib svg{width:21px;height:21px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.live i{width:8px;height:8px;border-radius:50%;background:#2fb457;box-shadow:0 0 0 3px #2fb45733;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #2fb45700}}
.mo{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:3px}
.mo button{width:34px;height:34px;border:0;border-radius:10px;background:none;font-size:18px;line-height:1}
.mo button:hover{background:var(--chip)}.mo button:disabled{opacity:.3;cursor:default}
.mo span{min-width:112px;text-align:center;font-weight:700;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:29;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:9px 15px;font-weight:700;font-size:14px;color:var(--mu);white-space:nowrap}
.tabs button svg{width:18px;height:18px}
.tabs button.on{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(20,112,47,.3)}
.main{padding:6px 14px 40px;max-width:1500px;margin:0 auto}
.foot{text-align:center;padding:26px 0 8px}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 18px 18px;margin:6px 0 16px;color:#fff;background:linear-gradient(130deg,#0d5a26 0%,#14702f 38%,#2fa24f 78%,#7ac142 130%);box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;right:-90px;top:-110px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#ffffff26,transparent 68%)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#ffffff1c,transparent 70%)}
.hero .wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:80px;opacity:.5;pointer-events:none}
.hero .in{position:relative;z-index:2;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.hero .lgCard{padding:16px 22px;border-radius:26px;box-shadow:0 14px 36px rgba(0,0,0,.22)}
.hero .lgCard img{width:min(74vw,380px);max-width:100%;height:auto;display:block}
.hero h1{margin:0;font-size:25px;letter-spacing:-.4px;line-height:1.15}
.hero p{margin:4px 0 0;opacity:.85;font-size:14px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.hero .pill{background:#ffffff26;border:1px solid #ffffff33;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.hero .crt{color:#ffffffcc;margin-top:12px}.hero .crt b{color:#fff}
.h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.h2 h2{margin:0;font-size:19px;letter-spacing:-.2px}.h2 span{color:var(--mu);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{position:relative;background:var(--card);border-radius:var(--r);padding:14px 14px 13px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden;text-align:left;display:block;width:100%;transition:transform .15s,box-shadow .15s}
button.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.kpi .ill{width:46px;height:46px;margin-bottom:6px}.kpi .ill svg{width:100%;height:100%;display:block}
.kpi .lb{font-size:12.5px;color:var(--mu);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi .v small{font-size:13px;font-weight:700;color:var(--mu);letter-spacing:0}
.kpi .sb{font-size:12.5px;color:var(--mu);margin-top:3px}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:var(--ac,#2fa24f);opacity:.08}
.dl{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.dl.up{background:#2fb45722;color:#1b8a3f}.dl.dn{background:#d6453d1f;color:var(--rd)}.dl.eq{background:var(--chip);color:var(--mu)}
:root[data-theme=dark] .dl.up{color:#5fe08a}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--bd);min-width:0}
.card h3{margin:0 0 2px;font-size:16.5px;letter-spacing:-.2px}.card .sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.cols{display:grid;gap:14px}
.cols.c2,.cols.c3{grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.seg{display:inline-flex;gap:4px;background:var(--chip);padding:4px;border-radius:14px;border:1px solid var(--bd);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch .gl{stroke:var(--bd);stroke-width:1}.ch .ax{fill:var(--mu);font-size:11px}
.ch .ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0;font-size:12.5px;color:var(--mu)}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutw{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.donutw svg{width:178px;height:178px;flex:none}
.dlist{flex:1;min-width:210px;display:grid;gap:8px}
.dlist .it{display:flex;align-items:center;gap:9px;font-size:13.5px}.dlist .it i{width:11px;height:11px;border-radius:4px;flex:none}
.dlist .it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dlist .it b{white-space:nowrap}.dlist .it em{font-style:normal;color:var(--mu);font-size:12px;width:38px;text-align:right}
.rk{display:grid;gap:9px}
.rk .it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.rk .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--chip);color:var(--mu)}
.rk .it:nth-child(1) .no{background:linear-gradient(135deg,#ffe08a,#f2a900);color:#4a3000}
.rk .it:nth-child(2) .no{background:linear-gradient(135deg,#f4f7fa,#c3ceda);color:#2b3748}
.rk .it:nth-child(3) .no{background:linear-gradient(135deg,#f8dcc0,#d7995a);color:#4d2b09}
.rk .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

// ===================== расчёт зарплаты (точная копия логики бухгалтерии) =====================
function hrSunStatuses(mo,marks,staffId){
 const nd=daysIn(mo),y=+mo.slice(0,4),m=+mo.slice(5,7)-1,R={};
 for(let d=1;d<=nd;d++){
  const sun=new Date(y,m,d);if(sun.getDay()!==0)continue;
  const dd=pad(d),manual=hrN(marks[dd]);if(manual)continue;
  let total=0,lost=0;
  for(let back=6;back>=1;back--){const date=ymd(new Date(y,m,d-back)),month=date.slice(0,7),dayKey=date.slice(8,10),value=hrN((((hrAtt[month]||{}).marks||{})[staffId]||{})[dayKey]);if(value==='Б')total+=1;else if(value==='ПД'){total+=0.5;lost+=0.5}else if(value==='НБ')lost+=1;}
  if(total>=4.5)R[dd]='Б';else if(lost>=2||ymd(new Date())>=ymd(new Date(y,m,d-1)))R[dd]='НБ';
 }
 return R;
}
function hrSunDays(mo,marks,staffId){const st=hrSunStatuses(mo,marks,staffId);return Object.keys(st).filter(d=>st[d]==='НБ')}
// автоаванс 14 числа (как в бухгалтерии): швеи/цех — settings.advWh, офис — settings.advOffice
function hrPreAdvDays(e,att,mo){const marks=((att.marks||{})[e.id])||{},sund=(e.type==='day'||e.grp==='office')?{}:hrSunStatuses(mo,marks,e.id);let n=0;for(let d=1;d<=13;d++){const dd=pad(d),c=hrN(marks[dd])||sund[dd]||'';if(c==='Б')n+=1;else if(c==='ПД')n+=0.5}return n}
const hrAdvDefault=e=>Math.round((e.grp||'wh')==='office'?(+S.settings.advOffice||1000000):(+S.settings.advWh||500000));
function hrAdvAuto(e,att,mo){const manual=+(((att.adj||{})[e.id]||{}).adv)||0,now=new Date();if(mo!==ymd(now).slice(0,7)||now.getDate()<14)return manual;if(hrPreAdvDays(e,att,mo)<8)return manual;return Math.max(manual,hrAdvDefault(e))}
function hrCalc(e,att,mo){
 const marks=((att.marks||{})[e.id])||{};let P=0,H=0,A=0;
 const sd=(e.type==='day'||e.grp==='office')?[]:hrSunDays(mo,marks,e.id),ssu=(e.type==='day'||e.grp==='office')?{}:hrSunStatuses(mo,marks,e.id),SB=Object.keys(ssu).filter(k=>ssu[k]==='Б').length;
 for(const d in marks){if(sd.includes(d))continue;const c=hrN(marks[d]);if(c==='Б')P++;else if(c==='ПД')H++;else if(c==='НБ')A++}
 P+=SB;const adj=((att.adj||{})[e.id])||{},pay=+adj.pay||+e.pay||0,rate=+adj.ded||+e.ded||+att.ded||66000,S0=sd.length;
 let gross,ded=0;
 if(e.type==='day'){gross=pay*(P+H*0.5)}else{ded=rate*(A+H*0.5+S0);gross=Math.max(0,pay-ded)}
 const bonus=+adj.bonus||0,fine=+adj.fine||0,adv=hrAdvAuto(e,att,mo);
 return {pay,P,H,A,S:S0,gross:Math.round(gross),bonus,fine,adv,net:Math.round(gross+bonus-fine-adv)};
}

const sum=(a,f)=>a.reduce((n,x)=>n+(+(f?f(x):x)||0),0);
function attM(mo){const a=S.att[mo]||{},marks={...(a.marks||{})};(S.sd||[]).forEach(x=>{if(x.month!==mo||!x.staffId||!x.marks)return;marks[x.staffId]={...(marks[x.staffId]||{}),...x.marks}});return {...a,marks}}

function sheetOf(mo){
 const att=attM(mo),n=daysIn(mo),y=+mo.slice(0,4),m=+mo.slice(5,7)-1,WD=['вс','пн','вт','ср','чт','пт','сб'];
 const days=Array.from({length:n},(_,i)=>({d:i+1,w:WD[new Date(y,m,i+1).getDay()],sun:new Date(y,m,i+1).getDay()===0}));
 const rows=sewStaff().map(e=>{
  const marks=((att.marks||{})[e.id])||{},auto=e.type==='day'?{}:hrSunStatuses(mo,marks,e.id);let P=0,H=0,A=0;
  const cells=days.map(({d})=>{const dd=pad(d),v=hrN(marks[dd]);
   if(v){if(v==='Б')P++;else if(v==='ПД')H++;else if(v==='НБ')A++;return {v,auto:false}}
   const a=auto[dd];if(a){if(a==='Б')P++;else A++;return {v:a,auto:true}}return {v:'',auto:false}});
  return {e,cells,P,H,A}});
 return {days,rows};
}
function cashOf(mo){
 const att=S.att[mo]||{},list=Object.entries(att.cash||{}).filter(([,v])=>v&&v.a).map(([id,v])=>({...v,id}));
 const ins=list.filter(x=>x.t==='in'),outs=list.filter(x=>x.t==='out');
 const income=sum(ins,x=>x.a),expense=sum(outs,x=>x.a),open=+((att.finMeta||{}).openingBalance)||0;
 const grp=a=>{const m={};a.forEach(x=>{const c=x.c||'Без категории';m[c]=(m[c]||0)+(+x.a||0)});return Object.entries(m).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v)};
 const isAdv=x=>/аванс/i.test(x.c||''),isSal=x=>/зарплат|расч[её]т/i.test(x.c||'')&&!isAdv(x);
 const adv=sum(outs.filter(isAdv),x=>x.a),sal=sum(outs.filter(isSal),x=>x.a);
 return {list,ins,outs,income,expense,open,close:open+income-expense,outCats:grp(outs),inCats:grp(ins),adv,sal,paid:adv+sal,has:hasAtt(mo)};
}
function prodOf(mo){

    const ao=al(String(r.a||'—').trim()),so=String(r.s||'—').trim().toUpperCase(),ak=canon(ao),g=A.get(ak)||{a:ao,q:0,rev:0,sz:new Map()};
    g.q+=q;const sk=canon(so),gs=g.sz.get(sk)||{s:so,q:0};gs.q+=q;g.sz.set(sk,gs);A.set(ak,g)}
   const fs=fin&&fin.st&&fin.st[i];
   if(fs)for(const it of fs.arts||[]){const g=A.get(canon(al(it.a)));if(g)g.rev=mpCut(it.r,P).reduce((p,v)=>p+(+v||0),0)}
   const arts=[...A.values()].sort((x,y)=>y.q-x.q||String(x.a).localeCompare(String(y.a),'ru',{numeric:true})),total=sum(arts,x=>x.q),Z=new Map();
   arts.forEach(g=>g.sz.forEach((v,sk)=>{const o=Z.get(sk)||{k:v.s,q:0};o.q+=v.q;Z.set(sk,o)}));
   out.push({k,nm,sn,i,id:k+'.'+i,label:nm+(names.length>1?' · '+sn:''),total,arts,sizes:[...Z.values()].sort((x,y)=>y.q-x.q||szr(x.k)-szr(y.k)),updated:d.updated||d.checked||0,err:d.err||'',rev:!!fs&&!!fs.fin})})}

}

 if(t.dataset.more){const k=t.dataset.more;S.ui.more[k]=!S.ui.more[k];render();return}
 if(t.dataset.act==='dcreate'){createDirector();return}
 if(t.dataset.dassign){const u=S.usersAll[t.dataset.dassign];if(!u)return;try{await setDoc(doc(db,'dir_profiles',u.id),{uid:u.id,login:String(u.email).toLowerCase(),email:String(u.email).toLowerCase(),name:(u.fullName||u.name||String(u.email).split('@')[0]).trim(),only:false,active:true,lang:'ru',theme:'light',createdAt:Date.now(),createdBy:S.user.email});toast('Назначен директором: '+(u.fullName||u.name||u.email))}catch(x){toast('Нет прав: опубликуйте обновлённые правила Firestore')}return}
 if(t.dataset.ddel){try{await deleteDoc(doc(db,'dir_profiles',t.dataset.ddel));toast('Назначение снято')}catch(x){toast('Не удалось снять')}return}
 if(t.dataset.dtog){const [uid,on]=t.dataset.dtog.split('|');try{await updateDoc(doc(db,'dir_profiles',uid),{active:on==='1'});toast(on==='1'?'Директор включён':'Директор отключён')}catch(x){toast('Не удалось изменить')}}
});
document.addEventListener('change',e=>{const v=e.target.dataset&&e.target.dataset.dsel!==undefined?e.target.value:'';if(v&&v<=todayStr()){S.ui.day=v;if(v.slice(0,7)!==S.month){S.month=v.slice(0,7);S.ev=[];watchMonths();watchProd();watchEv();chrome()}render()}});
document.addEventListener('input',e=>{const q=e.target.dataset&&e.target.dataset.q;if(q){S.ui.q[q]=e.target.value;soft()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp'))doLogin()});
onAuthStateChanged(auth,async u=>{
 hideSplash();
 if(!u){S.user=null;stopData();showLogin();return}
 const email=(u.email||'').toLowerCase();
 try{
  if(email===OWNER){S.role='owner';S.prof={name:'Владелец'}}
  else{
   const p=await getDoc(doc(db,'dir_profiles',u.uid));
   if(!p.exists()||p.data().active===false){loginMsg=p.exists()?'Доступ отключён. Обратитесь к владельцу.':'Этот аккаунт не добавлен как директор.';S.user=null;stopData();showLogin();return}
   S.role='dir';S.prof=p.data();
  }
 }catch(e){loginMsg='Нет доступа к данным. Обратитесь к владельцу (правила Firestore).';S.user=null;stopData();showLogin();return}
 S.user=u;startApp();
});
try{S.theme=localStorage.getItem('dir_th')||'light'}catch(e){}
document.documentElement.dataset.theme=S.theme;

document.getElementById('defs').innerHTML=DEFS;
['spLogo','lgLogo','sideLogo','miniLogo'].forEach(i=>{const el=document.getElementById(i);if(el)el.src=LOGO});
document.getElementById('lob').innerHTML=NAVI.out;
</script>
