<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад халатов</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6f5c"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#76746d;--ac:#1f6f5c;--acx:#fff;--bd:#e3e0d8;--rd:#b3372c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232322;--tx:#f0efea;--mu:#9a988f;--ac:#4fb59c;--acx:#0d1f1a;--bd:#363532;--rd:#ef7b70}}
:root[data-theme="dark"]{--bg:#171716;--card:#232322;--tx:#f0efea;--mu:#9a988f;--ac:#4fb59c;--acx:#0d1f1a;--bd:#363532;--rd:#ef7b70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 14px}
.card{overflow-wrap:anywhere;background:var(--card);border:0;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.mu{color:var(--mu);font-size:14px}.big{font-size:32px;font-weight:700}
button{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 20px;min-height:52px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);box-shadow:0 4px 14px rgba(31,111,92,.35)}
button.d{color:var(--rd);background:rgba(179,55,44,.1);border-color:transparent}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-height:52px;width:100%;min-width:0}
select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-height:52px;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1 0 auto;min-width:72px;border:0;border-radius:0;background:none;padding:12px 10px;min-height:60px;font-size:13px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:14px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px;display:none}
#sheet.show{display:block}
.qr{width:150px;height:150px;background:#fff;padding:6px;border-radius:10px}
.qr svg{width:100%;height:100%;display:block}
video{width:100%;border-radius:14px;background:#000;max-height:55vh;object-fit:cover}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:20px;z-index:60;display:none;max-width:90%}
#camov{position:fixed;inset:0;background:#000;z-index:25;display:none;flex-direction:column}#camov.show{display:flex}
#camov .stage{flex:1;position:relative;overflow:hidden;min-height:0}
#camov video{position:absolute;inset:0;width:100%;height:100%;max-height:none;border-radius:0;object-fit:cover}
#camov .top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 14px;color:#fff;font-weight:700;font-size:19px;background:linear-gradient(#000a,transparent)}
#camov .top button{min-height:44px;min-width:44px;padding:0;border-radius:50%;background:#0008;color:#fff;border:0;font-size:20px}
.frame{position:absolute;left:50%;top:44%;width:min(74vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);z-index:2}
.frame .c{position:absolute;width:46px;height:46px;border:5px solid #fff;transition:border-color .2s}
.c.tl{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:24px}
.c.tr{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:24px}
.c.bl{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:24px}
.c.br{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:24px}
.frame.ok .c{border-color:#3be28f}.frame.bad .c{border-color:#ff5a4d}
.frame .line{position:absolute;left:7%;right:7%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#3be28f,transparent);box-shadow:0 0 16px 5px rgba(59,226,143,.55);animation:scl 2s ease-in-out infinite alternate}
@keyframes scl{from{top:5%}to{top:95%}}
#camov .hint{position:absolute;left:0;right:0;top:calc(44% + min(37vw,160px) + 20px);text-align:center;color:#fff;font-size:17px;padding:0 24px;z-index:2;text-shadow:0 1px 6px #000}
#camov .tb{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;width:60px;height:60px;min-height:60px;padding:0;border-radius:50%;background:#0009;color:#fff;border:0;font-size:26px}
#camov .tb.on{background:#fff;color:#000}
#camov .bar{padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);color:var(--tx);border-radius:22px 22px 0 0;position:relative;z-index:4}
#print{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px}
#print.show{display:block}
#print .pbar{display:flex;gap:8px;margin-bottom:12px}
#print .labs{text-align:center}
.lab .bc svg{width:100%;height:auto;display:block;margin:4px 0}
.lab{border:1px dashed #000;padding:8px;width:48mm;display:inline-block;margin:2mm;text-align:center;color:#000;background:#fff;font:700 16px sans-serif}
.lab svg{width:40mm;height:40mm}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;position:static;padding:0;background:#fff;overflow:visible}#print .pbar{display:none}body{background:#fff;padding:0}body::before{display:none}.lab{break-inside:avoid}}
.tw{overflow-x:auto}
</style></head><body>
<div id="app"><main id="main"></main>
<nav><button data-t="stock">Склад</button><button data-t="total">Итого</button><button data-t="bags">Мешки</button><button data-t="scan">Скан</button><button data-t="prods">Коды</button><button data-t="log">История</button><button data-t="wb">WB</button><button data-t="ozon">Ozon</button></nav></div>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="width:100%;max-width:380px"><h1>Склад халатов</h1><input id="le" type="email" placeholder="Логин (почта)" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Пароль" style="margin-top:8px" autocomplete="current-password"><button class="p" id="lb" style="width:100%;margin-top:10px">Войти</button><div id="lm" style="margin-top:8px;color:var(--rd)"></div></div></div><div id="sheet"></div><div id="camov"></div><div id="toast"></div><div id="print"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let prods={},bags={},logs=[],db=null,tab='stock',openId=null,q='',expand=null,delArm=false,stream=null,scanning=false,det=null,mode=null,zx=null,cvs=null,last='',lastT=0;
const normS=s=>s.trim().toUpperCase().replace(/Х/g,'X').replace(/Л/g,'L').replace(/М/g,'M').replace(/С/g,'S');
const SIZES=['S','M','L','XL','2XL','3XL','4XL','5XL'];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
let FB=null;
async function saveBag(b){bags[b.id]=b;render();try{await FB.set('bags',b.id,b)}catch(e){toast('Нет связи или прав')}}
async function delBag(id){delete bags[id];render();try{await FB.del('bags',id)}catch(e){toast('Нет связи или прав')}}
async function saveProd(p){prods[p.code]=p;render();try{await FB.set('prods',p.code,p)}catch(e){toast('Нет связи или прав')}}
async function delProd(c){delete prods[c];render();try{await FB.del('prods',c)}catch(e){toast('Нет связи или прав')}}
async function addLog(e){e.ts=Date.now();e.u=FB.email();logs.unshift(e);try{await FB.add('log',e)}catch(x){}}
function nextId(k){k=k||'MIX';let m=0;const re=new RegExp('^'+k+'-(\\d+)$');for(const x in bags){const r=re.exec(x);if(r)m=Math.max(m,+r[1])}return k+'-'+String(m+1).padStart(3,'0')}
function newBag(k){const id=nextId(k);saveBag({id,items:[],created:Date.now()});addLog({bag:id,type:'new',a:'',s:'',d:0});openBag(id)}
async function change(id,a,s,d){try{const r=await FB.change(id,a,s,d);if(r==='low'){toast('В мешке столько нет');return}if(r==='none'){toast('Мешок не найден');return}
addLog({bag:id,type:d>0?'in':'out',a,s,d:Math.abs(d)});toast((d>0?'Добавлено ':'Списано ')+Math.abs(d)+' шт.')}catch(e){toast('Ошибка: нет связи или прав')}}
const bagTotal=b=>b.items.reduce((n,i)=>n+i.q,0);
function totals(){const m={};for(const k in bags)for(const i of bags[k].items){(m[i.a]=m[i.a]||{s:{},t:0,w:[]});m[i.a].s[i.s]=(m[i.a].s[i.s]||0)+i.q;m[i.a].t+=i.q;m[i.a].w.push({id:k,s:i.s,q:i.q})}return m}
function qrSvg(t){const c=qrcode(0,'M');c.addData(t);c.make();const n=c.getModuleCount();let p='';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(c.isDark(r,k))p+=`M${k+2},${r+2}h1v1h-1z`;
return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges"><path d="${p}" fill="#000"/></svg>`}
function barSvg(t){const mk=f=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');JsBarcode(s,t,{format:f,displayValue:false,height:46,margin:0,width:2});return s.outerHTML};try{if(/^\d{13}$/.test(t)){try{return mk('EAN13')}catch(e){}}return mk('CODE128')}catch(e){return ''}}
function showLabels(items){const p=$('#print');p.innerHTML=`<div class="pbar"><button data-act="pclose">← Назад</button><button class="p sp" data-act="pgo">🖨 Печать</button></div><div class="labs">`+items.map(i=>`<div class="lab">${i.qr?qrSvg(i.t):''}<div class="bc">${barSvg(i.t)}</div><div>${esc(i.cap)}</div></div>`).join('')+`</div>`;p.classList.add('show')}
function printLabels(ids){showLabels(ids.map(i=>({t:i,qr:true,cap:i})))}
function openBag(id){openId=id;delArm=false;render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
const m=$('#main');
if(tab==='stock')m.innerHTML=vStock();else if(tab==='total')m.innerHTML=vTotal();else if(tab==='wb')m.innerHTML=vMp('wb','Wildberries');else if(tab==='ozon')m.innerHTML=vMp('ozon','Ozon');else if(tab==='bags')m.innerHTML=vBags();else if(tab==='scan')vScan();else if(tab==='prods')m.innerHTML=vProds();else m.innerHTML=vLog();
const sh=$('#sheet');if(openId&&bags[openId]){sh.classList.add('show');sh.innerHTML=vSheet(bags[openId])}else{openId=null;sh.classList.remove('show');sh.innerHTML=''}}
function vStock(){const t=totals(),all=Object.values(t).reduce((n,x)=>n+x.t,0),nb=Object.keys(bags).length;
const arts=Object.keys(t).sort().filter(a=>a.includes(q.toUpperCase()));
return `<div class="row"><h1 class="sp">Склад</h1><button data-act="logout">Выйти</button></div><div class="card row"><div><div class="big">${all}</div><div class="mu">халатов всего</div></div><div class="sp"></div><div style="text-align:right"><div class="big">${nb}</div><div class="mu">мешков</div></div></div>
<input id="q" placeholder="Поиск по артикулу, например ХМ11" value="${esc(q)}" style="margin-bottom:10px">`+
(arts.length?arts.map(a=>`<div class="card" data-art="${esc(a)}"><div class="row"><b>${esc(a)}</b><div class="sp"></div><b>${t[a].t} шт.</b></div><div class="sizes">${Object.keys(t[a].s).sort((x,y)=>SIZES.indexOf(x)-SIZES.indexOf(y)).map(s=>`<span class="chip">${esc(s)}: ${t[a].s[s]}</span>`).join('')}</div>
${expand===a?`<div style="margin-top:8px" class="mu">Где лежит:</div>`+t[a].w.map(w=>`<div class="row" style="padding:6px 0"><button data-open="${esc(w.id)}">${esc(w.id)}</button><span>${esc(w.s)} — ${w.q} шт.</span></div>`).join(''):`<div class="mu" style="margin-top:6px">нажмите, чтобы увидеть мешки</div>`}</div>`).join(''):`<div class="card mu">${nb?'Ничего не найдено':'Склад пуст. Откройте «Мешки» → «Новый мешок» и добавьте товар.'}</div>`)}
function vTotal(){const t=totals(),rows=[],cmp=(x,y)=>x.localeCompare(y,'ru',{numeric:true});
for(const a of Object.keys(t).sort(cmp))for(const s of Object.keys(t[a].s).sort((x,y)=>SIZES.indexOf(x)-SIZES.indexOf(y)))rows.push({a,s,n:t[a].s[s],w:t[a].w.filter(w=>w.s===s)});
const ranked=[...rows].sort((x,y)=>y.n-x.n||cmp(x.a,y.a)).map((r,i)=>({...r,rank:i+1}));
const base=totSort==='top'?ranked:[...ranked].sort((x,y)=>cmp(x.a,y.a)||SIZES.indexOf(x.s)-SIZES.indexOf(y.s));
const k=q.trim().toUpperCase(),f=base.filter(r=>(r.a+' '+r.s).toUpperCase().includes(k)),all=rows.reduce((n,r)=>n+r.n,0),max=ranked.length?ranked[0].n:1,medal=['🥇','🥈','🥉'];
return `<h1>Итого</h1><div class="card row"><div><div class="big">${all}</div><div class="mu">халатов всего</div></div><div class="sp"></div><div style="text-align:right"><div class="big">${rows.length}</div><div class="mu">позиций (артикул + размер)</div></div></div>
<div class="row" style="gap:6px;margin-bottom:10px"><button class="${totSort==='top'?'p':''}" data-ts="top" style="min-height:44px;padding:8px 14px">🏆 Рейтинг</button><button class="${totSort==='az'?'p':''}" data-ts="az" style="min-height:44px;padding:8px 14px">А–Я</button></div>
<input id="q" placeholder="Поиск, например ХМ8" value="${esc(q)}" style="margin-bottom:10px">`+
(f.length?f.map(r=>`<div class="card"><div class="row"><b style="min-width:36px">${r.rank<=3?medal[r.rank-1]:'#'+r.rank}</b><b>${esc(r.a)}</b><span class="chip">${esc(r.s)}</span><div class="sp"></div><span class="big">${r.n}</span><span class="mu">шт.</span></div><div style="height:6px;border-radius:6px;background:var(--bd);margin:10px 0 8px"><div style="height:100%;width:${Math.max(3,Math.round(r.n/max*100))}%;border-radius:6px;background:var(--ac)"></div></div><div class="sizes">${r.w.map(w=>`<button data-open="${esc(w.id)}" style="min-height:40px;padding:6px 14px">${esc(w.id)}: ${w.q}</button>`).join('')}</div></div>`).join(''):'<div class="card mu">Ничего не найдено</div>')}
let mp={},mpSt=0,bagF='',totSort='top';
const LK={'Х':'X','М':'M','А':'A','С':'C','Е':'E','О':'O','Р':'P','Т':'T','В':'B','Н':'H','К':'K','Л':'L'};
const nk=t=>String(t).trim().toUpperCase().replace(/[ХМАСЕОРТВНКЛ]/g,c=>LK[c]);
function vMp(k,t){const d=mp[k];
if(!d||!d.rows)return `<h1>${t}</h1>`+(d&&d.err?`<div class="card" style="color:var(--rd)">Ошибка синхронизации${d.checked?' (проверено '+new Date(d.checked).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')':''}: ${esc(d.err)}</div>`:'<div class="card mu">Данных пока нет. Они появятся после первой синхронизации с '+t+'.</div>');
const names=d.names||[],own={},tt=totals();for(const a in tt)for(const z in tt[a].s)own[nk(a)+'|'+nk(z)]=tt[a].s[z];
const pick=r=>{const x=mpSt?(r.st&&r.st[mpSt-1]):{fbo:r.fbo,fbs:r.fbs};return x?{fbo:x.fbo,fbs:x.fbs,n:x.fbo+x.fbs}:{fbo:0,fbs:0,n:0}};
const f=q.trim().toUpperCase(),all=d.rows.reduce((n,r)=>n+pick(r).n,0),cnt=d.rows.filter(r=>pick(r).n>0).length;
const list=d.rows.map(r=>({r,x:pick(r)})).filter(o=>o.x.n>0&&(o.r.a+' '+o.r.s).toUpperCase().includes(f));
const up=d.updated?new Date(d.updated).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const sb=names.length>1?`<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">`+['Все'].concat(names).map((nm,i)=>`<button class="${mpSt===i?'p':''}" data-mpst="${i}" style="min-height:44px;padding:8px 14px">${esc(nm)}</button>`).join('')+`</div>`:'';
return `<h1>${t}</h1>${sb}<div class="card row"><div><div class="big">${all}</div><div class="mu">шт. ${mpSt?esc(names[mpSt-1]||''):'на '+t}</div></div><div class="sp"></div><div style="text-align:right"><div class="big">${cnt}</div><div class="mu">позиций</div></div></div><div class="mu" style="margin:0 4px 10px">Обновлено: ${up} (само, раз в 30 минут)</div>`+(d.err?`<div class="card" style="color:var(--rd)">Последняя синхронизация не удалась${d.checked?' ('+new Date(d.checked).toLocaleString('ru',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+')':''}: ${esc(d.err)}</div>`:'')+
`<input id="q" placeholder="Поиск, например ХМ8" value="${esc(q)}" style="margin-bottom:10px">`+
(list.map(({r,x})=>{const o=own[nk(r.a)+'|'+nk(r.s)];return `<div class="card"><div class="row"><b>${esc(r.a)}</b><span class="chip">${esc(r.s)}</span><div class="sp"></div><span class="big">${x.n}</span><span class="mu">шт.</span></div><div class="sizes"><span class="chip">FBO: ${x.fbo}</span><span class="chip">FBS: ${x.fbs}</span>${!mpSt&&names.length>1&&r.st?names.map((nm,n)=>`<span class="chip">${esc(nm)}: ${r.st[n].fbo+r.st[n].fbs}</span>`).join(''):''}${o!==undefined?`<span class="chip">наш склад: ${o}</span>`:''}</div></div>`}).join('')||'<div class="card mu">Ничего не найдено</div>')}
function vBags(){const K=['MIX','MONO','UZUM'],cmp=(x,y)=>x.localeCompare(y,'ru',{numeric:true});
const ids=Object.keys(bags).filter(id=>!bagF||id.startsWith(bagF+'-')).sort(cmp);
return `<h1>Мешки</h1><div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">`+['','MIX','MONO','UZUM'].map(k=>`<button class="${bagF===k?'p':''}" data-bf="${k}" style="min-height:44px;padding:8px 14px">${k||'Все'}</button>`).join('')+`</div>
<div class="row" style="gap:6px;margin-bottom:10px">`+K.map(k=>`<button class="p sp" data-act="new" data-k="${k}" style="padding:12px 6px">+ ${k}</button>`).join('')+`</div>
<div class="card"><b>Печать этикеток</b><div class="mu" style="margin:4px 0 8px">QR и штрихкод, например MONO-001 … MONO-020</div>
<div class="row" style="gap:6px"><select id="ptype">${K.map(k=>`<option>${k}</option>`).join('')}</select><input id="pf" type="number" inputmode="numeric" min="1" value="1" style="width:80px"><span class="mu">—</span><input id="pt" type="number" inputmode="numeric" min="1" value="20" style="width:80px"></div>

function lookup(t){const raw=String(t).trim(),id=raw.toUpperCase();if(bags[id])return{bag:id};

o.classList.add('show');startCam()}
async function startCam(){const v=$('#v');scanning=true;last='';
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=stream;await v.play()}
catch(e){setCam('Камера недоступна. Разрешите доступ к камере в настройках браузера или введите код вручную.');scanning=false;return}
try{det=('BarcodeDetector' in window)?new BarcodeDetector():null}catch(e){det=null}
if(!det&&window.ZXing){try{zx=new ZXing.MultiFormatReader();const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);zx.setHints(h)}catch(e){zx=null}}
loop()}
function stopCam(){scanning=false;mode=null;torchOn=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const o=$('#camov');o.classList.remove('show');o.innerHTML=''}
async function loop(){if(!scanning)return;const v=$('#v');let txt=null;
try{if(det){const r=await det.detect(v);if(r[0])txt=r[0].rawValue}
else if(v&&v.videoWidth){const cv=cvs||(cvs=document.createElement('canvas'));const w=Math.min(960,v.videoWidth);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);const x=cv.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,cv.width,cv.height);
if(zx){try{txt=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){}}
if(!txt&&window.jsQR){const im=x.getImageData(0,0,cv.width,cv.height);const r=jsQR(im.data,im.width,im.height);if(r)txt=r.data}}}catch(e){}
if(txt){const n=Date.now();if(!(txt===last&&n-lastT<1800)){last=txt;lastT=n;scanFb(txt);foundCode(txt)}}
if(scanning)setTimeout(loop,150)}

`<div class="card"><b>Положить новый товар</b><div class="row" style="margin-top:8px"><input id="na" placeholder="Артикул (ХМ11)" list="al" autocapitalize="characters"><input id="ns" placeholder="Размер" list="sl" style="width:110px"></div>

<button class="d" data-act="delbag" style="margin-top:8px">${delArm?'Точно удалить мешок?':'Удалить мешок'}</button>`}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-open],[data-art]');if(!t)return;const d=t.dataset;

else if(d.ts){totSort=d.ts;render()}
else if(d.act==='printrange'){const k=$('#ptype').value,a=parseInt($('#pf').value),b=parseInt($('#pt').value);if(!(a>0&&b>=a)||b-a>199){toast('Укажите номера: от 1, не больше 200 штук');return}const ids=[];for(let n=a;n<=b;n++)ids.push(k+'-'+String(n).padStart(3,'0'));printLabels(ids)}
else if(d.pdel)delProd(d.pdel);
else if(d.act==='go'){const v=$('#man').value;if(v)foundCode(v)}
else if(d.act==='addnew'){const a=$('#na').value.trim().toUpperCase(),s=$('#ns').value.trim().toUpperCase().replace(/Х/g,'X').replace(/Л/g,'L').replace(/М/g,'M').replace(/С/g,'S'),n=parseInt($('#nq').value);if(!a||!s||!(n>0)){toast('Заполните артикул, размер и количество');return}change(openId,a,s,n)}
else if(d.act==='delbag'){if(!delArm){delArm=true;render();return}const id=openId;openId=null;delBag(id)}
else if(d.art){expand=expand===d.art?null:d.art;render()}});

<script>
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
document.addEventListener('click',ac);document.addEventListener('touchstart',ac);
let torchOn=false;
async function torch(){try{const t=stream&&stream.getVideoTracks()[0];const c=t&&t.getCapabilities?t.getCapabilities():{};if(!c.torch){toast('Фонарик не поддерживается');return}torchOn=!torchOn;await t.applyConstraints({advanced:[{torch:torchOn}]});const b=document.querySelector('.tb');if(b)b.classList.toggle('on',torchOn)}catch(e){torchOn=false;toast('Фонарик недоступен')}}
function tone(f,t,d){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.setValueAtTime(.5,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d)}
function scanFb(txt){const r=lookup(txt);const ok=mode==='reg'||!(r.none||((mode==='in'||mode==='out')&&r.bag));
const fr=document.querySelector('.frame');if(fr){fr.classList.add(ok?'ok':'bad');setTimeout(()=>fr.classList.remove('ok','bad'),700)}
if(ok){tone(1000,0,.12);if(navigator.vibrate)navigator.vibrate(250)}
else{tone(300,0,.15);tone(300,.2,.15);if(navigator.vibrate)navigator.vibrate([300,120,300,120,300])}}
</script>
