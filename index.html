d1;--acx:#fff;--bd:#dde4f0;--rd:#d23f31;--hd1:#0a1836;--hd2:#14397f;--sh:0 4px 18px rgba(16,40,90,.08);box-sizing:border-box}
:root[data-theme="dark"]{--bg:#070f22;--card:#101e3c;--tx:#eaf1ff;--mu:#93a4c6;--ac:#4d8dff;--acx:#051029;--bd:#1c2f57;--rd:#ff7a6e;--hd1:#08142d;--hd2:#10295c;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:124px}
.lg{background:var(--logo) center/contain no-repeat}
#hd{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:0 0 26px 26px;box-shadow:0 6px 22px rgba(10,24,54,.35)}
#hd .lg{width:46px;height:46px;flex:none}
#hd .hn{display:flex;flex-direction:column;line-height:1.15}#hd .hn b{font-size:19px;letter-spacing:.6px}#hd .hn span{font-size:13px;opacity:.75}
#hd button{min-height:40px;padding:6px 14px;border-radius:999px;background:#ffffff1f;border:0;color:#fff;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px 14px}
h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:6px 2px 14px}
.card{overflow-wrap:anywhere;background:var(--card);border:0;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
#main.a .card,#main.a .hero{animation:up .45s ease both}
#main.a>:nth-child(2){animation-delay:.05s}#main.a>:nth-child(3){animation-delay:.1s}#main.a>:nth-child(4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
