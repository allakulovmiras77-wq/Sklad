async function applyOp(o){

 try{return await runTransaction(db,async tx=>{
  const [ss,os]=await Promise.all([tx.get(sref),tx.get(oref)]);
  if(os.exists())return {dup:true};
  const before=ss.exists()?ss.data().q:0,q=before+o.d;
  if(q<0)throw {low:true,have:before};
  const op={type:o.type,k,a:o.a,s:o.s,d:o.d,q,uid:S.user.uid,name:meName(),ts:serverTimestamp(),day:mskDay()};
  for(const f of ['reason','cmt','ship','ln','n','exp','bad','uc'])if(o[f]!==undefined&&o[f]!=='')op[f]=o[f];
  tx.set(oref,op);tx.set(sref,{a:o.a,s:o.s,q,lo:id,lt:serverTimestamp()});return {ok:true,q,id}})}
 catch(e){if(e&&e.low)throw e;if(e&&e.code==='permission-denied')throw {perm:true};throw {net:true}}}

const REASONS={add:['rsn_buy','rsn_ret','rsn_prod','rsn_other'],out:['rsn_sale','rsn_defect','rsn_lost','rsn_mp','rsn_other']};

let lastScan={c:'',t:0};
async function onScan(raw){const c=String(raw||'').trim();if(!c)return;const now=Date.now();if(c===lastScan.c&&now-lastScan.t<700)return;lastScan={c,t:now};
 await ensureCodes();const se=S.sess,hit=resolveCode(c);
 if(S.tab==='recv'){return recvScan(c)}
 if(se.mode==='unit'){if(hit){se.cur={a:hit.a,s:hit.s||''};ok(hit.a+' '+(hit.s||''));render();return}
   if(!se.cur){bad(t('unitFirst'));return}
   const uc=sanitCode(c);let it=se.items.find(i=>nk(i.a)===nk(se.cur.a)&&nk(i.s)===nk(se.cur.s)&&i.units);if(!it){it={a:se.cur.a,s:se.cur.s,units:[]};se.items.push(it)}
   if(se.items.some(i=>i.units&&i.units.includes(uc))){bad(t('dupScan'));return}
   it.units.push(uc);ok(it.a+' '+it.s+' ×'+it.units.length);render();return}
 if(!hit){bad(t('notFound')+': '+c);return}
 const n=Math.max(1,num0(($('#qty')||{}).value)||1);addItem(hit.a,hit.s||'',n);ok(hit.a+' '+(hit.s||'')+' ×'+n);render()}
function addItem(a,s,q){const se=S.sess;let it=se.items.find(i=>!i.units&&nk(i.a)===nk(a)&&nk(i.s)===nk(s));if(!it){it={a,s,q:0};se.items.push(it)}it.q+=q}
async function commit(){const se=S.sess;if(S.busy||!se.items.length)return;S.busy=true;toast(t('processing'));const sign=se.kind==='add'?1:-1,fails=[];
 for(const it of [...se.items]){try{
   if(it.units){for(const uc of [...it.units]){await applyOp({type:se.kind,a:it.a,s:it.s,d:sign,uc,reason:se.reason?t(se.reason):'',cmt:se.cmt,id:`u_${uc}_${sign>0?'in':'out'}`});it.units=it.units.filter(x=>x!==uc)}}
   else{it.opId=it.opId||'o'+rand();await applyOp({type:se.kind,a:it.a,s:it.s,d:sign*it.q,reason:se.reason?t(se.reason):'',cmt:se.cmt,id:it.opId})}
   se.items=se.items.filter(x=>x!==it)}catch(e){fails.push(it.a+' '+it.s+': '+errMsg(e))}}
 S.busy=false;if(fails.length){bad(fails[0]);}else{play('done');toast(t('okOp'),'ok')}render()}

function vRecv(){ensureCodes();const ships=shipsArr();
 if(S.recv){const sh=S.ships[S.recv.id];if(!sh){S.recv=null;return vRecv()}const P=shipProgress(sh,S.rcvOps),bagsL=sh.bags;
  return `<div class="row"><button data-act="recvback">←</button><h1 style="margin:0">${esc(sh.no)}</h1><div class="sp"></div><span class="chip">${t('st_'+P.state)}</span></div>
  <div class="card"><label class="mu s">${t('scanBag')}</label><div class="row"><input id="scan" class="scan" placeholder="MONO-001" autocomplete="off" inputmode="none"><button data-act="camscan">📷</button></div><div class="mu s">${t('shipExp')}: ${P.tot} · ${t('shipGot')}: ${P.done}</div></div>
  ${bagsL.map(b=>{const rows=P.rows.filter(r=>r.bag===b);const sc=S.recv.scanned&&S.recv.scanned[b];return `<div class="card ${S.recv.hl===b?'hl':''}"><div class="row"><b>📦 ${esc(b)}</b>${sc?`<span class="chip lvg">✓ ${t('scanned')}</span>`:''}<div class="sp"></div>${sh.status==='open'?`<button data-recvbag="${esc(b)}">${t('recvBag')}</button>`:''}</div>
   ${rows.map(r=>`<div class="rl"><div class="row"><b>${esc(r.a)}</b><span>${esc(r.s)}</span><div class="sp"></div><span class="mu s">${t('shipExp')} <b>${r.q}</b> · ${t('shipGot')} <b>${r.got}</b>${r.bad?` · ${t('damaged')} <b>${r.bad}</b>`:''} · ${t('shipRem')} <b>${r.rem}</b>${r.surplus?` · <span class="pos">${t('surplus')} ${r.surplus}</span>`:''}${r.short?` · <span class="neg">${t('shortage')} ${r.short}</span>`:''}</span></div>
   ${sh.status==='open'?`<div class="row"><input type="number" min="0" id="g_${r.i}" value="${r.rem}" class="qty" title="${t('got')}"><input type="number" min="0" id="b_${r.i}" value="0" class="qty" title="${t('bad')}" placeholder="${t('bad')}"><input id="c_${r.i}" placeholder="${t('comment')}"><label class="ph">📷<input type="file" accept="image/*" capture="environment" id="p_${r.i}" hidden></label><button class="p" data-recvline="${r.i}">${t('recvLine')}</button></div>`:''}</div>`).join('')}</div>`}).join('')}
  ${sh.status==='open'?`<button class="d big" data-act="recvclose">${t('recvClose')}</button>`:''}`}
 return `<h1>${t('nav_recv')}</h1>`+(ships.filter(s=>s.status==='open').length?ships.filter(s=>s.status==='open').map(s=>shipCard(s,true)).join(''):`<div class="card mu">${t('noShips')}</div>`)}
function shipCard(s,openBtn){const P=shipProgress(s,S.rcvOps);return `<div class="card"><div class="row"><b>${esc(s.no)}</b><span class="chip">${t('st_'+P.state)}</span><div class="sp"></div><span class="mu s">${fmtDT(s.tms)}</span></div><div class="mu s">${t('shipBy')}: ${esc(s.byName)} · ${t('shipExp')}: ${P.tot} · ${t('shipGot')}: ${P.done} · ${s.bags.length} ${t('bag').toLowerCase()}</div><div class="bar"><i style="width:${P.tot?Math.min(100,P.done/P.tot*100):0}%"></i></div>${openBtn&&can('rcv')?`<button class="p" data-recvopen="${esc(s.id)}">${t('recvOpen')}</button>`:''}</div>`}
function recvScan(c){if(!S.recv)return;const sh=S.ships[S.recv.id],b=bagNorm(c);if(!sh.bags.includes(b)){bad(t('wrongBag')+': '+b);return}S.recv.scanned=S.recv.scanned||{};S.recv.scanned[b]=1;S.recv.hl=b;ok(t('scanned')+': '+b);render();setTimeout(()=>{const e=document.querySelector('.card.hl');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},50)}
async function compress(file){return new Promise((res,rej)=>{const img=new Image(),fr=new FileReader();fr.onload=()=>{img.onload=()=>{const sc=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.6,d=c.toDataURL('image/jpeg',q);while(d.length>280000&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function recvLine(i){if(S.busy)return;const sh=S.ships[S.recv.id],P=shipProgress(sh,S.rcvOps),r=P.rows[i],got=num0($('#g_'+i).value),bd=num0($('#b_'+i).value),cmt=($('#c_'+i).value||'').trim();
 if(got<0||bd<0||got+bd<=0){bad(t('qty'));return}
 if(got+bd>r.rem&&!confirm(t('surplus')+': '+(got+bd-r.rem)+'. '+t('confirm')+'?'))return;
 S.busy=true;try{const n=S.rcvOps.filter(o=>o.ship===sh.id&&o.ln===i).length+1,id=`rcv_${sh.id}_${i}_${n}`;
  const res=await applyOp({type:'receive',a:r.a,s:r.s,d:got,ship:sh.id,ln:i,n,exp:r.q,bad:bd,cmt,id,reason:(got+bd<r.rem?t('shortage'):got+bd>r.rem?t('surplus'):'')});
  if(res.dup){toast(t('dupOp'))}else{ok(t('received')+': '+r.a+' '+r.s+' ×'+got);
   const f=$('#p_'+i);if(f&&f.files[0]){try{await setDoc(doc(db,'msk_photos',id),{op:id,ship:sh.id,uid:S.user.uid,ts:serverTimestamp(),data:await compress(f.files[0])})}catch(e){}}

async function createShip(){const ns=S.newShip;if(S.busy||!ns.sel.size)return;if(ns.sel.size>40){bad(t('bagsLimit'));return}S.busy=true;toast(t('processing'));

  const seen=new Set();for(const it of items){if(it.q<=0)continue;const k=keyOf(it.a,it.s);if(seen.has(k)){skip++;continue}seen.add(k);

 if((el=g('[data-detail]'))){showDetail(el.dataset.detail);return}
 if((el=g('[data-recvopen]'))){S.recv={id:el.dataset.recvopen,scanned:{}};S.tab='recv';render();return}
 if((el=g('[data-recvline]'))){recvLine(+el.dataset.recvline);return}
 if((el=g('[data-recvbag]'))){recvBag(el.dataset.recvbag);return}
 if((el=g('[data-ad]'))){S.af={days:+el.dataset.ad,ops:null,loading:false};render();return}
 if((el=g('[data-play]'))){play(el.dataset.play,true);return}
 if((el=g('[data-saveperm]'))){const id=el.dataset.saveperm,p={};document.querySelectorAll(`[data-pp^="${CSS.escape(id)}|"]`).forEach(c=>p[c.dataset.pp.split('|')[1]]=c.checked);try{await updateDoc(doc(db,'msk_profiles',id),{p});ok(t('saved'))}catch(x){bad(t('errPerm'))}return}
 if((el=g('[data-toggle]'))){const id=el.dataset.toggle,p=S.profiles[id];try{await updateDoc(doc(db,'msk_profiles',id),{active:p.active===false})}catch(x){bad(t('errPerm'))}return}
 const a=(g('[data-act]')||{dataset:{}}).dataset.act;if(!a)return;
 if(a==='login')doLogin();else if(a==='logout')signOut(auth);else if(a==='savename')saveName();
 else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';applyPrefs();savePrefs();shell()}
 else if(a==='langtog'){S.lang=S.lang==='ru'?'uz':'ru';applyPrefs();savePrefs();shell()}
 else if(a==='commit')commit();else if(a==='clearlist'){S.sess.items=[];render()}
 else if(a==='manadd'){await ensureCodes();const A=($('#ma').value||'').trim(),Z=($('#ms').value||'').trim(),n=Math.max(1,num0(($('#qty')||{}).value)||1);if(!A){bad(t('article'));return}if(S.sess.mode==='unit'){S.sess.cur={a:A,s:Z};render()}else{addItem(A,Z,n);render()}}
 else if(a==='recvback'){S.recv=null;render()}else if(a==='recvclose')recvClose();
 else if(a==='camscan')camScan(c=>onScan(c));
 else if(a==='newship'){S.newShip={sel:new Set(),q:'',note:''};render()}else if(a==='shipback'){S.newShip=null;render()}else if(a==='shipgo')createShip();
 else if(a==='invgo')invApply();else if(a==='histload')histLoad();
 else if(a==='histcsv')dl('msk_history.csv',[[t('hDate'),t('hStaff'),t('hOp'),t('hArt'),t('hSize'),t('hQty'),t('reason'),t('comment')],...hist().map(o=>[fmtDT(o.tms),o.name,opName(o),o.a,o.s,o.d,o.reason||'',o.cmt||''])]);
 else if(a==='anacsv'){const A=analytics(S.af.ops||[],S.stock,S.af.days);dl('msk_analytics.csv',[[t('article'),t('aOut')],...Object.entries(A.top)]);}
 else if(a==='mkstaff')mkStaff();else if(a==='thrsave')thrSave();else if(a==='impgo')impGo();else if(a==='mclose'){$('#modal').className=''}});
document.addEventListener('keydown',e=>{if(e.target.id==='scan'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';if(S.newShip){addBagCode(v)}else onScan(v)}});
function addBagCode(v){const id=bagNorm(v);if(!S.bags){return}if(!S.bags[id]){bad(t('noBags')+': '+id);return}S.newShip.sel.add(id);ok(id);render()}
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.in==='reason'){S.sess.reason=el.value}
 if(el.dataset.bagsel){el.checked?S.newShip.sel.add(el.dataset.bagsel):S.newShip.sel.delete(el.dataset.bagsel);render()}
 if(el.dataset.snd){const k=el.dataset.snd;S.snd[k]=el.type==='checkbox'?el.checked:k==='vol'?+el.value:el.value;savePrefs();if(k==='ok')play('ok');if(k==='er')play('er')}
 if(el.dataset.thrp){S.thrP=el.value;render()}
 if(el.dataset.imap){S.imp.map[el.dataset.imap]=+el.value}
 if(el.id==='impf'&&el.files[0])impFile(el.files[0]).catch(()=>bad(t('errNet')));
 if(el.dataset.hf){S.hf[el.dataset.hf]=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.in==='q'){S.q=el.value;clearTimeout(input.t);input.t=setTimeout(()=>{const p=el.selectionStart;render();const n=$('[data-in="q"]');if(n){n.focus();n.setSelectionRange(p,p)}},250)}
 if(el.dataset.in==='cmt')S.sess.cmt=el.value;
 if(el.dataset.in==='nsq'){S.newShip.q=el.value;clearTimeout(input.t2);input.t2=setTimeout(()=>{const p=el.selectionStart;render();const n=$('[data-in="nsq"]');if(n){n.focus();n.setSelectionRange(p,p)}},250)}
 if(el.dataset.in==='nsn')S.newShip.note=el.value;
 if(el.dataset.inv!==undefined){S.inv[el.dataset.inv]=el.value;clearTimeout(input.t3);input.t3=setTimeout(()=>{const k=el.dataset.inv,p=el.selectionStart;render();const n=document.querySelector(`[data-inv="${CSS.escape(k)}"]`);if(n){n.focus();n.setSelectionRange(p,p)}},400)}});
function input(){}
document.addEventListener('DOMContentLoaded',()=>{});
loadLocal();showLogin();

</script></body></html>
