<!DOCTYPE html>
<html lang="ru" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад Москва · LT</title>
<meta name="theme-color" content="#0b2239">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-1.png">
<link rel="stylesheet" href="msk.css">
</head><body>
<div id="boot"><div class="spin" style="border-color:#ffffff40;border-top-color:#ff7a1a;width:34px;height:34px"></div><b>Склад Москва</b></div>
<script>
/* Защита от «вечной загрузки»: если скрипты не запустились — показываем, какого файла не хватает */
(function(){
 function show(msg){var b=document.getElementById('boot');if(!b)return;b.innerHTML='<div style="padding:24px;max-width:480px;text-align:center;font:16px/1.45 system-ui,sans-serif"><b style="font-size:21px">Не удалось запустить</b><p style="opacity:.9;white-space:pre-line">'+msg+'</p><button onclick="location.reload()" style="padding:13px 22px;border-radius:14px;border:0;font-weight:700;font-size:16px">Обновить</button></div>';}
 window.addEventListener('error',function(e){window.__mskErr=(e.message||'')+' '+String(e.filename||'').split('/').pop()+':'+(e.lineno||'')});
 window.addEventListener('unhandledrejection',function(e){window.__mskErr=String(e.reason&&e.reason.message||e.reason)});
 setTimeout(async function(){
  if(!document.getElementById('boot'))return;
  var bad=[];
  for(const f of ['msk-core.js','msk-i18n.js','msk.css']){try{var r=await fetch(f+'?x='+Date.now(),{cache:'no-store'});if(!r.ok)bad.push(f+' — ошибка '+r.status)}catch(e){bad.push(f+' — нет связи')}}
  show((bad.length?'На сервере не найдены файлы:\n'+bad.join('\n')+'\nЗагрузите их в корень репозитория, рядом с этой страницей.':(window.__mskReady?'Скрипты запустились, но не удалось подключиться к базе. Проверьте интернет и войдите заново.':'Скрипты не загрузились. Обновите страницу или очистите кеш.'))+(window.__mskErr?'\n\nТехническая ошибка:\n'+window.__mskErr:''));
 },8000);
})();
</script>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module">
import * as C from "./msk-core.js?v=3";
window.__mskReady=1;
const { $, $$, esc, t, IC, call, toast, openSheet, closeSheet, confirmBox, askNumber, Snd, Scan, Cam, byline, heroArt, fmtN, fmtDT, fmtD, keyOf, nk, cmpAS, SIZES, uuid, stChip, ST, BAGST, level, DEF_TH, bagId, auth, db, doc, collection, query, where, orderBy, limit, onSnapshot, getDoc, getDocs, updateDoc, onAuthStateChanged, signOut, updatePassword, tsMs, ymdMsk, exportXlsx } = C;

// ---------- состояние ----------
const S = { u: null, staff: null, items: {}, ships: {}, cfg: {}, mp: {}, tab: "home", sub: "", openShip: null, q: "", sf: "all", hist: [], hist8: [], histLim: 300, hf: {}, scan: null, rcv: null, inv: {}, invQ: "", ana: null, anaDays: 30, anaGran: "day", online: navigator.onLine, unsub: [], loaded: 0, histLoading: false };
const P = p => !!(S.staff && S.staff.perms && S.staff.perms[p]);
const items = () => Object.values(S.items).sort(cmpAS);
const ships = () => Object.entries(S.ships).map(([id, v]) => Object.assign({ id }, v)).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
const me = () => (S.staff ? ((S.staff.firstName || "") + " " + (S.staff.lastName || "")).trim() || S.staff.login : "");
const lvl = (it, area = "phys") => level(it.q || 0, ((S.cfg.min || {})[area] || {})[keyOf(it.a, it.s)], (S.cfg.def && S.cfg.def[area]) || DEF_TH);
const rsn = r => (r && C.t(r) !== r ? C.t(r) : (r || ""));
const TYPES = ["stock_in", "stock_out", "adjust", "inventory", "ship_create", "ship_confirm", "ship_cancel", "receive", "receive_diff", "barcode", "import_init", "staff_create"];
const IN_T = ["stock_in", "receive", "import_init"], OUT_T = ["stock_out"];
const SALE_R = ["r_out_sale", "r_out_ozon", "r_out_wb"];

// ---------- запуск ----------
onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("index.html"); return; }
  S.u = u;
  let s; try { s = await getDoc(doc(db, "msk_staff", u.uid)); } catch (e) { s = null; }
  if (!s || !s.exists() || s.data().active === false) {
    if ((u.email || "").toLowerCase() === C.OWNER) location.replace("moscow-admin.html"); else location.replace("index.html");
    return;
  }
  S.staff = s.data();
  applyPrefs();
  if (!S.staff.profileDone) { hideBoot(); gate(); return; }
  start();
});

function applyPrefs() {
  C.setLangLocal(S.staff.lang || "ru"); C.setThemeLocal(S.staff.theme || "light"); Snd.load(S.staff.sound);
}
function hideBoot() { const b = $("#boot"); if (b) { b.classList.add("off"); setTimeout(() => b.remove(), 500); } }

// форма первого входа: имя, фамилия, новый пароль
function gate() {
  document.title = "Склад Москва · LT";
  $("#app").innerHTML = `<div class="lgn"><div class="card" style="max-width:440px;width:100%"><h1>${t("gate_title")}</h1><div class="mu" style="margin-bottom:14px">${t("gate_sub")}</div>
  <label class="f">${t("first_name")}<input id="g1" autocomplete="given-name" maxlength="40"></label><div style="height:10px"></div>
  <label class="f">${t("last_name")}<input id="g2" autocomplete="family-name" maxlength="40"></label><div style="height:10px"></div>
  ${S.staff.tempPw ? `<label class="f">${t("new_pw")}<input id="g3" type="password" autocomplete="new-password"></label><div class="mu sm" style="margin:6px 0 0">${t("pw_hint")}</div>` : ""}
  <div id="ge" style="color:var(--er);font-weight:600;margin:10px 0"></div>
  <button class="btn p w" id="gb">${t("save_continue")}</button>
  <div class="row" style="margin-top:12px;justify-content:center"><button class="btn s" id="gl">RU / UZ</button><button class="btn s" id="gt">${t("theme")}</button></div></div></div>`;
  $("#gl").onclick = () => { C.setLangLocal(C.lang() === "ru" ? "uz" : "ru"); gate(); };
  $("#gt").onclick = () => { C.setThemeLocal(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); };
  $("#gb").onclick = async () => {
    const a = $("#g1").value.trim(), b = $("#g2").value.trim(), pw = S.staff.tempPw ? $("#g3").value : "";
    const err = m => { $("#ge").textContent = m; };
    if (a.length < 2 || b.length < 2) return err(t("gate_err_name"));
    if (S.staff.tempPw && pw.length < 8) return err(t("gate_err_pw"));
    $("#gb").disabled = true;
    try {
      if (S.staff.tempPw) await updatePassword(auth.currentUser, pw);
      await updateDoc(doc(db, "msk_staff", S.u.uid), { firstName: a, lastName: b, profileDone: true, tempPw: false, lang: C.lang(), theme: document.documentElement.dataset.theme });
      S.staff = Object.assign(S.staff, { firstName: a, lastName: b, profileDone: true, tempPw: false });
      $("#app").innerHTML = ""; start();
    } catch (e) { $("#gb").disabled = false; err(e && e.code === "auth/requires-recent-login" ? t("gate_err_relogin") : t("err_net")); }
  };
}

function start() {
  const uid = S.u.uid;
  updateDoc(doc(db, "msk_staff", uid), { lastLogin: Date.now() }).catch(() => { });
  const er = () => { };
  S.unsub.push(onSnapshot(doc(db, "msk_staff", uid), s => { if (!s.exists()) return; S.staff = s.data(); if (S.staff.active === false) { signOut(auth); return; } soft(); }, er));
  S.unsub.push(onSnapshot(collection(db, "msk_items"), s => { S.items = {}; s.docs.forEach(d => { S.items[d.id] = Object.assign({ key: d.id }, d.data()); }); ready(); soft(); }, er));
  S.unsub.push(onSnapshot(query(collection(db, "msk_ships"), orderBy("createdAt", "desc"), limit(120)), s => { S.ships = {}; s.docs.forEach(d => { S.ships[d.id] = d.data(); }); ready(); soft(); }, er));
  S.unsub.push(onSnapshot(doc(db, "msk_settings", "main"), s => { S.cfg = s.exists() ? s.data() : {}; soft(); }, er));
  const hq = P("history") ? query(collection(db, "msk_history"), orderBy("ts", "desc"), limit(8)) : query(collection(db, "msk_history"), where("uid", "==", uid), orderBy("ts", "desc"), limit(8));
  S.unsub.push(onSnapshot(hq, s => { S.hist8 = s.docs.map(d => d.data()); soft(); }, er));
  Scan.set(onScan);
  S.scan = newScan();
  render();
}
let rd = 0; function ready() { if (++rd >= 2) hideBoot(); }
setTimeout(hideBoot, 6000);
window.addEventListener("online", () => { S.online = true; top(); }); window.addEventListener("offline", () => { S.online = false; top(); });

// мягкая перерисовка: не мешаем, если человек сейчас вводит число
let pend = false;
function soft() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a) && !a.dataset.free) { pend = true; return; }
  if ($("#ov.on")) { top(); return; }
  render();
}
document.addEventListener("focusout", () => { if (pend) setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { pend = false; render(); } }, 80); });

// ---------- каркас ----------
function top() {
  const titles = { home: t("app_title"), stock: t("nav_stock"), scan: t("nav_scan"), recv: t("nav_recv"), more: t("nav_more") };
  $("#top").innerHTML = `<div class="lg">${IC.box.replace("<svg", '<svg width="24" height="24"')}</div><div class="tt"><b>${esc(titles[S.tab] || t("app_title"))}</b><span><i class="net ${S.online ? "" : "off"}"></i>${esc(me())} · ${S.online ? t("online") : t("offline")}</span></div><div class="sp"></div>
  <button class="ib" data-a="lang" title="RU/UZ" style="font-weight:800;font-size:14px">${C.lang() === "ru" ? "RU" : "UZ"}</button><button class="ib" data-a="theme" title="${t("theme")}">${document.documentElement.dataset.theme === "dark" ? "☀" : "☾"}</button>`;
  const inTr = ships().filter(s => s.status === "transit" || s.status === "partial").length;
  const it = (k, ic, lb, bd) => `<button class="nv ${S.tab === k ? "on" : ""}" data-a="tab" data-v="${k}">${IC[ic]}<span class="lb">${esc(t(lb))}</span>${bd ? `<b class="bd">${bd}</b>` : ""}</button>`;
  $("#nav").innerHTML = it("home", "home", "nav_home") + it("stock", "stock", "nav_stock") +
    `<button class="nv fab ${S.tab === "scan" ? "on" : ""}" data-a="tab" data-v="scan"><span class="fb">${IC.scan}<span class="ft show-d">${esc(t("nav_scan"))}</span></span><span class="lb show-m">${esc(t("nav_scan"))}</span></button>` +
    it("recv", "recv", "nav_recv", inTr) + it("more", "more", "nav_more");
}
function render() {
  pend = false; top();
  const V = { home: vHome, stock: vStock, scan: vScan, recv: vRecv, more: vMore }[S.tab];
  const app = $("#app");
  app.innerHTML = `<div class="view">${V()}${byline()}</div>`;
  if (S.tab === "stock") fillStock();
  after();
}
function after() {
  if (S.tab === "more" && S.sub === "hist" && !S.histLoading && !S.histLoaded) loadHist();
  if (S.tab === "more" && S.sub === "ana" && !S.ana) loadAna();
}
const empty = (ic, m) => `<div class="empty">${IC[ic] || IC.box}<div>${esc(m)}</div></div>`;

// ---------- Главная ----------
function vHome() {
  const all = items(), tot = all.reduce((n, x) => n + (x.q || 0), 0), arts = new Set(all.filter(x => x.q > 0 || x.tr > 0).map(x => nk(x.a))).size;
  const tr = all.reduce((n, x) => n + (x.tr || 0), 0), trShips = ships().filter(s => s.status === "transit" || s.status === "partial");
  const wk = Date.now() - 7 * 864e5, arr = ships().filter(s => (s.lastRecvAt || 0) >= wk).reduce((n, s) => n + (s.recvTotal || 0), 0);
  const warn = all.filter(x => lvl(x) !== "g").sort((x, y) => (lvl(x) === "r" ? 0 : 1) - (lvl(y) === "r" ? 0 : 1) || x.q - y.q);
  const h = +new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Moscow", hour: "2-digit", hourCycle: "h23" }).format(new Date());
  const hello = h < 5 ? "hello_n" : h < 12 ? "hello_m" : h < 18 ? "hello_d" : "hello_e";
  const qa = (a, ic, lb, c) => `<button class="qa ${c || ""}" data-a="${a}"><i>${IC[ic]}</i>${esc(t(lb))}</button>`;
  return `<div class="hero">${heroArt()}<div class="in"><div class="hi">${t(hello)}</div><div class="nm">${esc(S.staff.firstName || S.staff.login)}</div><div class="sub">${t("hero_sub")}</div><span class="pill">${esc(fmtD(Date.now()))} · ${t("msk_time")}</span></div></div>
  <div class="qa-g">${qa("go:scan", "scan", "nav_scan")}${qa("go:recv", "recv", "nav_recv", "b2")}${qa("go:stock", "stock", "nav_stock", "b3")}${P("stockIn") ? qa("newitem", "plus", "qa_in", "b4") : qa("go:hist", "hist", "m_hist", "b4")}</div>
  <div class="grid4" style="margin-bottom:14px"><div class="kpi ac"><div class="v">${fmtN(tot)}</div><div class="l">${t("k_total")}</div></div><div class="kpi"><div class="v">${fmtN(arts)}</div><div class="l">${t("k_arts")}</div></div><div class="kpi"><div class="v">${fmtN(tr)}</div><div class="l">${t("k_transit")} · ${trShips.length} ${t("k_ships")}</div></div><div class="kpi"><div class="v">${fmtN(arr)}</div><div class="l">${t("k_new7")}</div></div></div>
  <div class="dgrid"><div>
  <div class="card"><h2>${t("h_warn")}</h2>${warn.length ? warn.slice(0, 6).map(x => `<div class="li tap" data-a="item" data-v="${x.key}"><span class="dot ${lvl(x)}"></span><div class="t"><b>${esc(x.a)} · ${esc(x.s)}</b><span>${lvl(x) === "r" ? t("lv_r") : t("lv_y")}</span></div><div class="q">${fmtN(x.q)}</div></div>`).join("") + (warn.length > 6 ? `<button class="btn s w" data-a="warnall" style="margin-top:8px">${t("show_all")} (${warn.length})</button>` : "") : `<div class="mu" style="padding:6px 0">${t("no_warn")}</div>`}</div>
  <div class="card"><h2>${t("h_transit")}</h2>${trShips.length ? trShips.slice(0, 4).map(s => `<div class="li tap" data-a="ship" data-v="${s.id}"><div class="t"><b>${esc(s.no)}</b><span>${fmtD(s.confirmedAt)} · ${s.bagCount} ${t("bags_s")} · ${fmtN(s.total)} ${t("pcs")}</span></div>${stChip(s.status)}</div>`).join("") : `<div class="mu" style="padding:6px 0">${t("no_transit")}</div>`}</div>
  </div><div>
  <div class="card"><h2>${t("h_last")}</h2>${S.hist8.length ? S.hist8.map(histRow).join("") : `<div class="mu" style="padding:6px 0">${t("no_ops")}</div>`}</div></div></div>`;
}

function histRow(h) {
  const sgn = IN_T.includes(h.type) ? "+" : OUT_T.includes(h.type) ? "−" : "";
  const col = IN_T.includes(h.type) ? "var(--ok)" : OUT_T.includes(h.type) ? "var(--er)" : "var(--mu)";
  const what = [h.a ? h.a + " · " + h.s : "", h.ship || "", h.bag || ""].filter(Boolean).join(" · ");
  const extra = [rsn(h.reason), h.comment].filter(Boolean).join(" · ");
  return `<div class="li"><div class="t"><b>${esc(t("ty_" + h.type))}${what ? " · " + esc(what) : ""}</b><span>${esc(h.name || "")} · ${fmtDT(h.ts)}${extra ? " · " + esc(extra) : ""}</span></div>${h.q ? `<div class="q" style="color:${col}">${sgn}${fmtN(h.q)}</div>` : ""}</div>`;
}

// ---------- Остатки ----------
function vStock() {
  return `<h1>${t("nav_stock")}</h1><div class="sch">${IC.search}<input id="q" placeholder="${t("search_ph")}" value="${esc(S.q)}" autocomplete="off" data-free="1"></div>
  <div class="fl" style="margin-top:10px">${["all", "low", "zero", "tr"].map(f => `<span class="chip ${S.sf === f ? "on" : ""}" data-a="sf" data-v="${f}">${t("f_" + f)}</span>`).join("")}</div>
  ${P("stockIn") ? `<button class="btn w" data-a="newitem" style="margin-bottom:12px">${IC.plus} ${t("new_item")}</button>` : ""}<div id="stl"></div>`;
}
function fillStock() {
  const el = $("#stl"); if (!el) return;
  const q = nk(S.q).toLowerCase(), raw = S.q.trim().toLowerCase();
  let list = items().filter(x => {
    if (raw && !((nk(x.a) + " " + nk(x.s)).toLowerCase().includes(q) || String(x.name || "").toLowerCase().includes(raw) || (x.bc || []).some(b => b.toLowerCase().includes(raw)))) return false;
    if (S.sf === "low") return lvl(x) !== "g"; if (S.sf === "zero") return !x.q; if (S.sf === "tr") return x.tr > 0; return true;
  });
  if (!list.length) { el.innerHTML = empty("box", Object.keys(S.items).length ? t("nothing_found") : t("stock_empty")); return; }
  const g = new Map(); list.forEach(x => { const k = nk(x.a); (g.get(k) || g.set(k, { a: x.a, L: [] }).get(k)).L.push(x); });
  el.innerHTML = `<div class="dgrid">` + [...g.values()].map(G => `<div class="card"><div class="row" style="margin-bottom:4px"><h2 style="margin:0">${esc(G.a)}</h2><div class="sp"></div><span class="chip">${fmtN(G.L.reduce((n, x) => n + (x.q || 0), 0))} ${t("pcs")}</span></div>${G.L.map(x => `<div class="li tap" data-a="item" data-v="${x.key}"><span class="dot ${lvl(x)}"></span><div class="t"><b>${esc(x.s)}</b>${x.tr > 0 ? `<span>${t("in_transit")}: ${fmtN(x.tr)}</span>` : ""}</div><div class="q">${fmtN(x.q)}</div></div>`).join("")}</div>`).join("") + `</div>`;
}

function itemSheet(key) {
  const x = S.items[key]; if (!x) return;
  const l = lvl(x), th = ((S.cfg.min || {}).phys || {})[key] || {}, d = (S.cfg.def && S.cfg.def.phys) || DEF_TH;
  const b = (a, ic, lb, c) => `<button class="btn ${c || ""}" data-a="${a}" data-v="${key}">${IC[ic]} ${esc(t(lb))}</button>`;
  openSheet(`<div class="row"><div class="t" style="flex:1"><h2 style="margin:0">${esc(x.a)} · ${esc(x.s)}</h2><div class="mu">${esc(x.name || "")}</div></div><span class="dot ${l}" style="width:18px;height:18px"></span></div>
  <div class="grid2" style="margin:14px 0"><div class="kpi ac"><div class="v">${fmtN(x.q)}</div><div class="l">${t("k_stock_now")}</div></div><div class="kpi"><div class="v">${fmtN(x.tr || 0)}</div><div class="l">${t("in_transit")}</div></div></div>
  <div class="mu sm" style="margin-bottom:10px">${t("th_info", { y: th.y != null && th.y !== "" ? th.y : d.y, r: th.r != null && th.r !== "" ? th.r : d.r })}</div>
  ${(x.bc || []).length ? `<div class="mu sm" style="margin-bottom:10px">${t("barcodes")}: ${x.bc.map(esc).join(", ")} (${x.bt === "art" ? t("bt_art") : t("bt_unit")})</div>` : ""}
  <div class="grid2">${P("stockIn") ? b("op:in", "plus", "op_in", "g") : ""}${P("stockOut") ? b("op:out", "minus", "op_out", "d") : ""}${P("adjust") ? b("op:adj", "inv", "op_adj") : ""}${P("barcodes") ? b("bcset", "scan", "op_bc") : ""}${P("history") ? b("ihist", "hist", "op_hist") : ""}</div>`);
}

const REASONS = { in: ["r_in_buy", "r_in_return", "r_in_other"], out: ["r_out_sale", "r_out_ozon", "r_out_wb", "r_out_defect", "r_out_loss", "r_out_other"], adj: ["r_adj_count", "r_adj_error", "r_adj_other"] };
function opSheet(kind, key) {
  const x = S.items[key]; if (!x) return;
  const opId = uuid(), isAdj = kind === "adj";
  const sh = openSheet(`<h2>${esc(x.a)} · ${esc(x.s)}</h2><div class="mu" style="margin-bottom:10px">${t("k_stock_now")}: <b>${fmtN(x.q)}</b></div>
  <label class="f">${isAdj ? t("new_qty") : t("qty")}<div class="stepper"><button class="btn" data-st="-1">−</button><input id="oq" class="num" type="number" inputmode="numeric" min="${isAdj ? 0 : 1}" value="${isAdj ? x.q : 1}"><button class="btn" data-st="1">+</button><button class="btn s" data-st="10">+10</button></div></label>
  <label class="f" style="margin-top:10px">${t("reason")}<select id="or">${REASONS[kind].map(r => `<option value="${r}">${t(r)}</option>`).join("")}</select></label>
  <label class="f" style="margin-top:10px">${t("comment")}<input id="oc" maxlength="200"></label>
  <div id="oe" style="color:var(--er);font-weight:600;margin-top:8px"></div>
  <div class="row" style="margin-top:14px"><button class="btn w" data-x>${t("cancel")}</button><button class="btn w ${kind === "out" ? "d" : "p"}" id="ook">${t("do_op")}</button></div>`);
  const inp = $("#oq", sh);
  $$("[data-st]", sh).forEach(b => b.onclick = () => { inp.value = Math.max(isAdj ? 0 : 1, (parseInt(inp.value) || 0) + parseInt(b.dataset.st)); });
  $("[data-x]", sh).onclick = closeSheet;
  $("#ook", sh).onclick = async () => {
    const n = parseInt(inp.value, 10), er = m => { $("#oe", sh).textContent = m; Snd.play("opErr"); };
    if (!Number.isInteger(n) || n < (isAdj ? 0 : 1)) return er(t("err_qty"));
    if (kind === "out" && n > x.q) return er(t("err_low", { n: x.q }));
    $("#ook", sh).disabled = true;
    try {
      if (isAdj) await call("mskAdjust", { opId, a: x.a, s: x.s, counted: n, reason: $("#or", sh).value, comment: $("#oc", sh).value });

  else if (a === "cam") Cam.open((c, h) => { Scan.feed(c, "cam"); if (S.tab === "scan" && S.scan.mode === "find" || S.tab === "recv") { } }, t("scan_camera"));
  else if (a === "manual") { const i = $("#man"); if (i && i.value.trim()) { const c = i.value.trim(); i.value = ""; Scan.lastCode = ""; Scan.feed(c, "man"); } }
  else if (a === "rq") { const [k, d] = v.split("|"), r = S.scan.rows[k]; if (!r) return; if (d === "x") delete S.scan.rows[k]; else { const n = r.q + parseInt(d); const it = S.items[k]; if (n <= 0) delete S.scan.rows[k]; else if (S.scan.mode === "out" && n > it.q) { Snd.play("scanErr"); toast(t("err_low", { n: it.q }), "er"); return; } else r.q = n; } render(); }
  else if (a === "sclear") { S.scan = newScan(S.scan.mode); render(); }
  else if (a === "scommit") commitScan();
  else if (a === "rf") { S.rf = v; render(); }
  else if (a === "ship") { S.tab = "recv"; S.openShip = v; S.rcv = null; render(); scrollTo(0, 0); }
  else if (a === "shipback") { S.openShip = null; S.rcv = null; render(); }
  else if (a === "rtoggle") { const s = S.ships[S.openShip]; checkBag(s, v); S.rcv.last = null; Snd.play("scanOk"); render(); }
  else if (a === "runcheck") { delete S.rcv.checked[v]; render(); }
  else if (a === "rok") { S.rcv.checked[v].rows.forEach(r => { if (r.exp > 0) { r.got = r.exp; r.bad = 0; } }); S.rcv.checked[v].rows = S.rcv.checked[v].rows.filter(r => r.exp > 0 || r.got > 0); render(); }
  else if (a === "rextra") rextra(v);
  else if (a === "rcommit") commitRcv();
  else if (a === "rclose") rclose();
  else if (a === "hreset") { S.hf = {}; render(); }
  else if (a === "hmore") { S.histLim += 300; S.histLoaded = false; render(); }
  else if (a === "hexp") exportHist();
  else if (a === "icommit") commitInv();
  else if (a === "adays") { S.anaDays = +v; S.ana = null; render(); }
  else if (a === "agran") { S.anaGran = v; render(); }
  else if (a === "sndtest") { Snd.play("scanOk", true); setTimeout(() => Snd.play("scanErr", true), 500); setTimeout(() => Snd.play("opOk", true), 1100); }
  else if (a === "sndone") Snd.play(v, true);
  else if (a === "chgpw") { const pw = $("#pw1").value; if (pw.length < 8) { $("#pwe").textContent = t("gate_err_pw"); return; } try { await updatePassword(auth.currentUser, pw); toast(t("saved"), "ok"); $("#pw1").value = ""; } catch (er) { $("#pwe").textContent = er.code === "auth/requires-recent-login" ? t("gate_err_relogin") : t("err_net"); } }
  else if (a === "logout") { S.unsub.forEach(f => f()); await signOut(auth); location.replace("index.html"); }
});
function rextra(bag) {
  const sh = openSheet(`<h2>${t("add_extra")}</h2><label class="f">${t("article")}<input id="xa" autocapitalize="characters"></label><label class="f" style="margin-top:10px">${t("size")}<input id="xs" list="szl3"><datalist id="szl3">${SIZES.map(z => `<option value="${z}">`).join("")}</datalist></label><label class="f" style="margin-top:10px">${t("qty")}<input id="xq" type="number" inputmode="numeric" class="num" value="1" min="1"></label><div class="row" style="margin-top:14px"><button class="btn w" data-x>${t("cancel")}</button><button class="btn p w" id="xok">OK</button></div>`);
  $("[data-x]", sh).onclick = closeSheet;
  $("#xok", sh).onclick = () => { const a = $("#xa", sh).value.trim(), s = $("#xs", sh).value.trim(), q = parseInt($("#xq", sh).value, 10); if (!a || !s || !(q > 0)) return; const rows = S.rcv.checked[bag].rows, ex = rows.find(r => nk(r.a) === nk(a) && nk(r.s) === nk(s)); if (ex) ex.got += q; else rows.push({ a, s, exp: 0, got: q, bad: 0 }); closeSheet(); render(); };
}
function rclose() {
  const sh = openSheet(`<h2>${t("rcv_close")}</h2><div class="mu" style="margin-bottom:12px">${t("rcv_close_text")}</div><label class="f">${t("reason")}<input id="clr" maxlength="150"></label><div id="cle" style="color:var(--er);font-weight:600;margin-top:8px"></div><div class="row" style="margin-top:14px"><button class="btn w" data-x>${t("cancel")}</button><button class="btn d w" id="clok">${t("rcv_close_do")}</button></div>`);
  $("[data-x]", sh).onclick = closeSheet;
  const opId = uuid();
  $("#clok", sh).onclick = async () => {
    const reason = $("#clr", sh).value.trim(); if (!reason) { $("#cle", sh).textContent = t("err_reason"); return; }
    $("#clok", sh).disabled = true;
    try { await call("mskShipClose", { shipId: S.openShip, opId, reason }); Snd.play("warn"); toast(t("done"), "ok"); closeSheet(); } catch (e) { $("#clok", sh).disabled = false; $("#cle", sh).textContent = e.message; Snd.play("opErr"); }
  };
}
function exportHist() {
  const rows = [[t("when"), t("f_emp"), t("f_type"), t("article"), t("size"), t("qty"), t("ship"), t("reason"), t("comment")]];
  S.hist.forEach(h => rows.push([fmtDT(h.ts), h.name || "", t("ty_" + h.type), h.a || "", h.s || "", h.q || 0, h.ship || "", rsn(h.reason), h.comment || ""]));
  exportXlsx("msk-history-" + ymdMsk(), [{ name: "history", rows }]);
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "q") { S.q = el.value; fillStock(); }
  else if (el.id === "iq") { S.invQ = el.value; clearTimeout(S._it); S._it = setTimeout(() => { render(); const i = $("#iq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  else if (el.dataset.inv) { const v = el.value.trim(); if (v === "") delete S.inv[el.dataset.inv]; else S.inv[el.dataset.inv] = Math.max(0, parseInt(v, 10) || 0); }
  else if (el.dataset.bag) { const r = S.rcv.checked[el.dataset.bag].rows[+el.dataset.i]; r[el.dataset.f] = Math.max(0, parseInt(el.value, 10) || 0); if (r.bad > r.got) r.bad = r.got; const card = el.closest(".bag"); if (card) card.classList.toggle("dif", r.got !== r.exp || r.bad > 0); }
  else if (el.dataset.hf) { S.hf[el.dataset.hf] = el.value; clearTimeout(S._ht); S._ht = setTimeout(() => { const id = el.dataset.hf, pos = el.selectionStart; render(); const n = $(`[data-hf="${id}"]`); if (n && n.tagName === "INPUT" && n.type !== "date") { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } }, 300); }
  else if (el.id === "sn-vol") { Snd.cfg.vol = el.value / 100; $("#sn-vv").textContent = el.value + "%"; saveSnd(); }
  else if (el.id === "srs") S.scan.reason = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.hf && el.tagName === "SELECT" || el.type === "date") { if (el.dataset.hf) { S.hf[el.dataset.hf] = el.value; render(); } }
  else if (el.id === "sn-on") { Snd.cfg.on = el.checked; saveSnd(); if (el.checked) Snd.play("scanOk", true); }
  else if (el.id === "sn-ok") { Snd.cfg.scanOk = el.value; Snd.play("scanOk", true); saveSnd(); }
  else if (el.id === "sn-er") { Snd.cfg.scanErr = el.value; Snd.play("scanErr", true); saveSnd(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "man") { const c = e.target.value.trim(); if (c) { e.target.value = ""; Scan.lastCode = ""; Scan.feed(c, "man"); } } });
</script>
