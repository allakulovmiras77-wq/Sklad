<!DOCTYPE html>
<html lang="ru" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склад Москва · Управление</title>
<meta name="theme-color" content="#0b2239">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192-1.png">
<link rel="stylesheet" href="msk.css">
</head><body>
<div id="boot"><div class="spin" style="border-color:#ffffff40;border-top-color:#ff7a1a;width:34px;height:34px"></div><b>Склад Москва</b></div>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<script type="module">
import * as C from "./msk-core.js";
const { $, $$, esc, t, IC, call, toast, openSheet, closeSheet, confirmBox, Snd, Scan, Cam, byline, heroArt, fmtN, fmtDT, fmtD, keyOf, nk, cmpAS, SIZES, uuid, stChip, ST, BAGST, level, DEF_TH, bagId, auth, db, doc, collection, query, where, orderBy, limit, onSnapshot, getDoc, getDocs, setDoc, updateDoc, onAuthStateChanged, signOut, tsMs, ymdMsk, exportXlsx, readTable } = C;

const S = { u: null, owner: false, acc: {}, items: {}, ships: {}, bags: {}, staff: {}, users: {}, access: {}, cfg: {}, mp: {}, tab: "ov", sub: "", openShip: null, sendFilter: "free", sq: "", W: null, hist: [], hf: {}, histLim: 300, minArea: "phys", minQ: "", minEdit: {}, imp: null, ana: null, anaDays: 30, unsub: [], rd: 0 };
const can = k => S.owner || !!S.acc[k];
const canSee = () => S.owner || S.acc.view || S.acc.send || S.acc.confirm;
const items = () => Object.values(S.items).sort(cmpAS);
const ships = () => Object.entries(S.ships).map(([id, v]) => Object.assign({ id }, v)).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
const rsn = r => (r && t(r) !== r ? t(r) : (r || ""));
const AREAS = { phys: "area_phys", ozfbs: "Ozon FBS", ozfbo: "Ozon FBO", wbfbs: "Wildberries FBS", wbfbw: "Wildberries FBW" };
const PERMS = ["receive", "stockIn", "stockOut", "adjust", "inventory", "history", "analytics", "barcodes"];
const ROLEP = { worker: { receive: 1 }, senior: { receive: 1, stockIn: 1, stockOut: 1, inventory: 1, history: 1, barcodes: 1 }, manager: { receive: 1, stockIn: 1, stockOut: 1, adjust: 1, inventory: 1, history: 1, analytics: 1, barcodes: 1 } };
const TYPES = ["stock_in", "stock_out", "adjust", "inventory", "ship_create", "ship_confirm", "ship_cancel", "receive", "receive_diff", "barcode", "import_init", "staff_create"];
const IN_T = ["stock_in", "receive", "import_init"], OUT_T = ["stock_out"];
const bagQty = b => (b.items || []).reduce((n, i) => n + (Number(i.q) || 0), 0);
const bagState = b => bagQty(b) <= 0 ? (b.msk && b.msk.st === "transit" ? "transit" : "empty") : (b.msk && b.msk.st === "transit" ? "transit" : "free");

// ---------- вход ----------
onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("index.html"); return; }
  S.u = u; S.owner = (u.email || "").toLowerCase() === C.OWNER;
  try { const a = await getDoc(doc(db, "msk_access", u.uid)); S.acc = a.exists() ? a.data() : {}; } catch (e) { }
  if (!canSee()) { location.replace("index.html"); return; }
  if (S.owner) { try { const s = await getDoc(doc(db, "msk_settings", "ui_" + u.uid)); } catch (e) { } }
  if (!S.owner) S.tab = S.acc.send ? "send" : "ships";
  start();
});
function hideBoot() { const b = $("#boot"); if (b) { b.classList.add("off"); setTimeout(() => b.remove(), 500); } }
setTimeout(hideBoot, 6000);
const er = () => { };
function ready() { if (++S.rd >= 2) hideBoot(); }
function start() {
  S.unsub.push(onSnapshot(collection(db, "msk_items"), s => { S.items = {}; s.docs.forEach(d => { S.items[d.id] = Object.assign({ key: d.id }, d.data()); }); ready(); soft(); }, er));
  S.unsub.push(onSnapshot(query(collection(db, "msk_ships"), orderBy("createdAt", "desc"), limit(150)), s => { S.ships = {}; s.docs.forEach(d => { S.ships[d.id] = d.data(); }); ready(); soft(); }, er));
  S.unsub.push(onSnapshot(doc(db, "msk_settings", "main"), s => { S.cfg = s.exists() ? s.data() : {}; soft(); }, er));
  S.unsub.push(onSnapshot(collection(db, "bags"), s => { S.bags = {}; s.docs.forEach(d => { S.bags[d.id] = Object.assign({ id: d.id }, d.data()); }); soft(); }, er));
  S.unsub.push(onSnapshot(collection(db, "mp"), s => { S.mp = {}; s.docs.forEach(d => { S.mp[d.id] = d.data(); }); soft(); }, er));
  if (S.owner) {
    S.unsub.push(onSnapshot(collection(db, "msk_staff"), s => { S.staff = {}; s.docs.forEach(d => { S.staff[d.id] = d.data(); }); soft(); }, er));
    S.unsub.push(onSnapshot(collection(db, "msk_access"), s => { S.access = {}; s.docs.forEach(d => { S.access[d.id] = d.data(); }); soft(); }, er));
    S.unsub.push(onSnapshot(collection(db, "users"), s => { S.users = {}; s.docs.forEach(d => { S.users[d.id] = d.data(); }); soft(); }, er));
  }
  Scan.set(onScan); render();
}
let pend = false;
function soft() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("#app").contains(a) && !a.dataset.free) { pend = true; return; }
  if ($("#ov.on")) { top(); return; }
  render();
}
document.addEventListener("focusout", () => { if (pend) setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { pend = false; render(); } }, 80); });

// ---------- каркас ----------
const TABS = () => [["ov", "home", "a_ov", true], ["ships", "recv", "a_ships", canSee()], ["send", "send", "a_send", can("send")], ["staff", "user", "a_staff", S.owner], ["more", "more", "nav_more", S.owner]].filter(x => x[3]);
function top() {
  const nm = S.owner ? t("owner") : t("employee");
  $("#top").innerHTML = `<button class="ib" data-a="home" title="Склад LT">←</button><div class="tt"><b>${t("a_title")}</b><span>${esc(nm)} · ${esc(S.u.email || "")}</span></div><div class="sp"></div><button class="ib" data-a="lang" style="font-weight:800;font-size:14px">${C.lang() === "ru" ? "RU" : "UZ"}</button><button class="ib" data-a="theme">${document.documentElement.dataset.theme === "dark" ? "☀" : "☾"}</button>`;
  const open = ships().filter(s => s.status === "pending").length;
  const tb = TABS().filter(x => x[0] !== "send"), s = TABS().find(x => x[0] === "send");
  const mk = x => `<button class="nv ${S.tab === x[0] ? "on" : ""}" data-a="tab" data-v="${x[0]}">${IC[x[1]]}<span class="lb">${esc(t(x[2]))}</span>${x[0] === "ships" && open ? `<b class="bd">${open}</b>` : ""}</button>`;
  const fab = s ? `<button class="nv fab ${S.tab === "send" ? "on" : ""}" data-a="tab" data-v="send"><span class="fb">${IC.send}<span class="ft show-d">${esc(t("a_send"))}</span></span><span class="lb show-m">${esc(t("a_send"))}</span></button>` : "";
  const mid = Math.ceil(tb.length / 2);
  $("#nav").innerHTML = tb.slice(0, mid).map(mk).join("") + fab + tb.slice(mid).map(mk).join("");
}
function render() {
  pend = false; top();
  const V = { ov: vOv, ships: vShips, send: vSend, staff: vStaff, more: vMore }[S.tab];
  $("#app").innerHTML = `<div class="view">${V()}${byline()}</div>`;
  if (S.tab === "more" && S.sub === "hist" && !S.histLoaded && !S.histLoading) loadHist();
  if (S.tab === "more" && S.sub === "ana" && !S.ana) loadAna();
}
const empty = (ic, m) => `<div class="empty">${IC[ic] || IC.box}<div>${esc(m)}</div></div>`;
const lvlOf = (x, area, q) => level(q, ((S.cfg.min || {})[area] || {})[keyOf(x.a, x.s)], (S.cfg.def && S.cfg.def[area]) || DEF_TH);

// ---------- Обзор ----------
function mpRows(id) { return (S.mp[id] && S.mp[id].rows) || null; }
function vOv() {
  const all = items(), tot = all.reduce((n, x) => n + (x.q || 0), 0), tr = all.reduce((n, x) => n + (x.tr || 0), 0), sh = ships();
  const warn = all.filter(x => lvlOf(x, "phys", x.q || 0) !== "g");
  const sum = (id, f) => { const r = mpRows(id); return r ? r.reduce((n, x) => n + (x[f] || 0), 0) : null; };
  const plat = [["Ozon FBS", sum("ozon", "fbs")], ["Ozon FBO", sum("ozon", "fbo")], ["Wildberries FBS", sum("wb", "fbs")], ["Wildberries FBW", sum("wb", "fbo")]];
  return `<h1>${t("a_title")}</h1><div class="grid4" style="margin-bottom:14px"><div class="kpi ac"><div class="v">${fmtN(tot)}</div><div class="l">${t("k_total")} (${t("area_phys")})</div></div><div class="kpi"><div class="v">${fmtN(tr)}</div><div class="l">${t("k_transit")}</div></div><div class="kpi"><div class="v">${sh.filter(s => s.status === "pending").length}</div><div class="l">${t("a_wait_confirm")}</div></div><div class="kpi"><div class="v" style="color:var(--er)">${warn.length}</div><div class="l">${t("h_warn")}</div></div></div>
  ${can("send") ? `<button class="btn p xl w" data-a="tab" data-v="send" style="margin-bottom:14px">${IC.send} ${t("a_send_btn")}</button>` : ""}
  <div class="dgrid"><div><div class="card"><h2>${t("a_platforms")}</h2><div class="grid2">${plat.map(p => `<div class="kpi"><div class="v">${p[1] == null ? "—" : fmtN(p[1])}</div><div class="l">${p[0]}</div></div>`).join("")}</div><div class="mu sm" style="margin-top:8px">${t("mp_note")}</div></div>
  <div class="card"><h2>${t("h_warn")}</h2>${warn.length ? warn.sort((a, b) => a.q - b.q).slice(0, 12).map(x => `<div class="li"><span class="dot ${lvlOf(x, "phys", x.q)}"></span><div class="t"><b>${esc(x.a)} · ${esc(x.s)}</b><span>${lvlOf(x, "phys", x.q) === "r" ? t("lv_r") : t("lv_y")}</span></div><div class="q">${fmtN(x.q)}</div></div>`).join("") : `<div class="mu">${t("no_warn")}</div>`}</div></div>
  <div><div class="card"><h2>${t("h_transit")}</h2>${sh.filter(s => ["transit", "partial", "pending", "draft"].includes(s.status)).slice(0, 6).map(s => `<div class="li tap" data-a="ship" data-v="${s.id}"><div class="t"><b>${esc(s.no)}</b><span>${s.bagCount} ${t("bags_s")} · ${fmtN(s.total)} ${t("pcs")}</span></div>${stChip(s.status)}</div>`).join("") || `<div class="mu">${t("no_transit")}</div>`}</div>
  <div class="card"><h2>${t("a_stock_all")}</h2>${all.length ? `<div class="tw"><table class="tbl"><tr><th>${t("article")}</th><th>${t("size")}</th><th class="r">${t("k_stock_now")}</th><th class="r">${t("in_transit")}</th></tr>${all.slice(0, 80).map(x => `<tr><td>${esc(x.a)}</td><td>${esc(x.s)}</td><td class="r b">${fmtN(x.q)}</td><td class="r">${x.tr ? fmtN(x.tr) : "—"}</td></tr>`).join("")}</table></div>${all.length > 80 ? `<div class="mu sm">${t("a_first80")}</div>` : ""}` : empty("box", t("stock_empty"))}</div></div></div>`;
}

// ---------- Отправить в Москву ----------
function newW(ship) { return { sel: new Set(ship ? ship.bagIds : []), shipId: ship ? ship.id : null, comment: ship ? ship.comment || "" : "", last: null, opId: uuid() }; }
function vSend() {
  if (!S.W) S.W = newW();
  const W = S.W, q = nk(S.sq).toLowerCase(), raw = S.sq.trim().toLowerCase();
  const all = Object.values(S.bags).filter(b => /^(MIX|MONO|UZUM)-\d+$/.test(b.id)).sort((a, b) => a.id.localeCompare(b.id, "ru", { numeric: true }));
  const list = all.filter(b => {
    const st = bagState(b); if (S.sendFilter === "free" && st !== "free") return false; if (S.sendFilter === "sel" && !W.sel.has(b.id)) return false;
    if (!raw) return true; return b.id.toLowerCase().includes(raw) || (b.items || []).some(i => (nk(i.a) + " " + nk(i.s)).toLowerCase().includes(q));
  });
  const sel = [...W.sel].map(id => S.bags[id]).filter(Boolean), tot = sel.reduce((n, b) => n + bagQty(b), 0);
  const L = W.last;
  return `<h1>${t("a_send")}</h1>${W.shipId ? `<div class="info">${t("a_editing")}: <b>${esc(W.shipId)}</b></div>` : ""}
  <div class="scanbox ${L ? L.k : ""}"><div class="big">${L ? esc(L.t) : t("a_scan_title")}</div><div class="mu">${L ? esc(L.s || "") : t("a_scan_sub")}</div></div>
  <div class="row" style="margin:12px 0"><button class="btn n" style="flex:1" data-a="cam">${IC.cam} ${t("scan_camera")}</button></div>
  <div class="row" style="margin-bottom:12px"><input id="man" placeholder="${t("a_manual_ph")}" data-free="1" autocomplete="off"><button class="btn p" data-a="manual">OK</button></div>
  <div class="card"><div class="grid3"><div class="kpi"><div class="v">${sel.length}</div><div class="l">${t("a_bags_sel")}</div></div><div class="kpi ac"><div class="v">${fmtN(tot)}</div><div class="l">${t("a_robes")}</div></div><div class="kpi"><div class="v">${new Set(sel.flatMap(b => b.items.map(i => nk(i.a)))).size}</div><div class="l">${t("k_arts")}</div></div></div>
  ${sel.length ? sumTables(sel) : `<div class="mu" style="padding:10px 0">${t("a_none_sel")}</div>`}
  <label class="f" style="margin-top:12px">${t("comment")}<input id="wc" value="${esc(W.comment)}" maxlength="250" data-free="1"></label>
  <div class="row wrap" style="margin-top:14px"><button class="btn" data-a="wclear" ${sel.length ? "" : "disabled"}>${t("clear")}</button><button class="btn" data-a="wdraft" ${sel.length ? "" : "disabled"}>${t("a_draft")}</button>
  <button class="btn p xl" style="flex:1" data-a="wsend" ${sel.length ? "" : "disabled"}>${can("confirm") ? t("a_confirm_send") : t("a_submit_confirm")}</button></div></div>
  <div class="card"><div class="sch">${IC.search}<input id="sq" placeholder="${t("a_bag_search")}" value="${esc(S.sq)}" data-free="1" autocomplete="off"></div>
  <div class="fl" style="margin-top:10px">${["free", "all", "sel"].map(f => `<span class="chip ${S.sendFilter === f ? "on" : ""}" data-a="sfilt" data-v="${f}">${t("sf_" + f)}</span>`).join("")}<span class="chip" data-a="selall">${t("a_select_all")}</span></div>
  ${list.length ? list.slice(0, 300).map(b => bagRow(b)).join("") : empty("box", t("nothing_found"))}${list.length > 300 ? `<div class="mu sm">${t("a_first300")}</div>` : ""}</div>`;
}
function bagRow(b) {
  const st = bagState(b), on = S.W.sel.has(b.id), ok = st === "free";
  const chip = st === "free" ? `<span class="chip ok">${t("bag_free")}</span>` : st === "transit" ? `<span class="chip in">${t("bag_transit")}</span>` : `<span class="chip">${t("bag_empty")}</span>`;
  return `<div class="bag ${on ? "sel" : ""} ${ok ? "" : "no"}" ${ok ? `data-a="bagtog" data-v="${b.id}" style="cursor:pointer"` : ""}><div class="hd"><input type="checkbox" ${on ? "checked" : ""} ${ok ? "" : "disabled"} style="pointer-events:none"><b>${esc(b.id)}</b>${chip}<div class="sp"></div><b>${fmtN(bagQty(b))} ${t("pcs")}</b></div><div style="margin-top:6px">${(b.items || []).filter(i => i.q > 0).map(i => `<span class="chip" style="margin:2px 4px 2px 0">${esc(i.a)} ${esc(i.s)} × ${i.q}</span>`).join("")}</div></div>`;
}
function sumTables(sel) {
  const ar = {}, sz = {}, rows = {};
  sel.forEach(b => (b.items || []).forEach(i => { if (!(i.q > 0)) return; const k = keyOf(i.a, i.s); rows[k] = rows[k] || { a: i.a, s: i.s, q: 0 }; rows[k].q += i.q; ar[i.a] = (ar[i.a] || 0) + i.q; sz[i.s] = (sz[i.s] || 0) + i.q; }));
  const R = Object.values(rows).sort(cmpAS);
  return `<div class="tw" style="margin-top:12px"><table class="tbl"><tr><th>${t("article")}</th><th>${t("size")}</th><th class="r">${t("qty")}</th></tr>${R.map(r => `<tr><td>${esc(r.a)}</td><td>${esc(r.s)}</td><td class="r b">${fmtN(r.q)}</td></tr>`).join("")}</table></div>
  <div class="row wrap" style="margin-top:10px">${Object.entries(sz).sort((a, b) => C.sizeRank(a[0]) - C.sizeRank(b[0])).map(([k, v]) => `<span class="chip in">${esc(k)}: ${fmtN(v)}</span>`).join("")}</div>
  <details style="margin-top:10px"><summary class="b" style="cursor:pointer">${t("a_bag_contents")}</summary>${sel.map(b => `<div class="li"><div class="t"><b>${esc(b.id)}</b><span>${(b.items || []).filter(i => i.q > 0).map(i => esc(i.a) + " " + esc(i.s) + "×" + i.q).join(", ")}</span></div><div class="q">${fmtN(bagQty(b))}</div></div>`).join("")}</details>`;
}
function onScan(code) {
  if (S.tab !== "send" || !can("send")) return;
  const W = S.W || (S.W = newW()), id = bagId(code), say = (k, tx, s) => { W.last = { k, t: tx, s }; render(); };
  if (!id) { Snd.play("scanErr"); return say("er", code, t("a_not_bag")); }
  const b = S.bags[id]; if (!b) { Snd.play("scanErr"); return say("er", id, t("a_bag_missing")); }
  const st = bagState(b); if (st !== "free") { Snd.play("scanErr"); return say("er", id, st === "transit" ? t("a_bag_intransit") : t("a_bag_empty")); }
  if (W.sel.has(id)) { Snd.play("scanErr"); return say("wr", id, t("a_already_added")); }
  W.sel.add(id); Snd.play("scanOk"); say("ok", id, t("a_added", { q: bagQty(b), n: W.sel.size }));
}
async function sendFlow(confirmNow) {
  const W = S.W, ids = [...W.sel], sel = ids.map(i => S.bags[i]).filter(Boolean), tot = sel.reduce((n, b) => n + bagQty(b), 0);
  W.comment = ($("#wc") || {}).value || W.comment;
  if (!confirmNow) {
    try { const r = await call("mskShipSave", { shipId: W.shipId, bagIds: ids, comment: W.comment, submit: false }); Snd.play("opOk"); toast(t("a_draft_saved", { no: r.no }), "ok"); S.W = null; S.tab = "ships"; render(); } catch (e) { Snd.play("opErr"); toast(e.message, "er"); } return;
  }
  const direct = can("confirm");
  const ok = await confirmBox({ title: direct ? t("a_confirm_send") : t("a_submit_confirm"), ok: direct ? t("a_confirm_send") : t("a_submit_confirm"),
    text: `<b>${ids.length}</b> ${t("bags_s")} · <b>${fmtN(tot)}</b> ${t("a_robes_l")}<br><br>${direct ? t("a_confirm_warn") : t("a_submit_warn")}` });
  if (!ok) return;
  try {
    const r = await call("mskShipSave", { shipId: W.shipId, bagIds: ids, comment: W.comment, submit: true });
    if (direct) { await call("mskShipConfirm", { shipId: r.id, opId: W.opId }); Snd.play("opOk"); toast(t("a_sent", { no: r.no }), "ok"); }
    else { Snd.play("opOk"); toast(t("a_submitted", { no: r.no }), "ok"); }
    S.W = null; S.tab = "ships"; S.openShip = r.id; render();
  } catch (e) { Snd.play("opErr"); toast(e.message, "er"); }
}

// ---------- Отправления ----------
function vShips() {
  if (S.openShip && S.ships[S.openShip]) return vShip(Object.assign({ id: S.openShip }, S.ships[S.openShip]));
  const f = S.sfl || "all", list = ships().filter(s => f === "all" || s.status === f);
  return `<h1>${t("a_ships")}</h1><div class="fl">${["all", "draft", "pending", "transit", "partial", "delivered", "discrepancy", "cancelled"].map(k => `<span class="chip ${f === k ? "on" : ""}" data-a="sfl" data-v="${k}">${k === "all" ? t("all") : t("st_" + k)}</span>`).join("")}</div>
  ${list.length ? `<div class="dgrid">` + list.map(s => { const got = (s.bags || []).filter(b => b.st !== "pending").length; return `<div class="card" data-a="ship" data-v="${s.id}" style="cursor:pointer"><div class="row"><h2 style="margin:0">${esc(s.no)}</h2><div class="sp"></div>${stChip(s.status)}</div><div class="mu" style="margin:6px 0">${fmtDT(s.confirmedAt || s.createdAt)} · ${esc((s.confirmedBy || s.createdBy || {}).name || "")}</div>
  <div class="row"><div class="hbar"><i style="width:${s.bagCount ? Math.round(got / s.bagCount * 100) : 0}%"></i></div><b>${got}/${s.bagCount}</b></div><div class="mu sm" style="margin-top:6px">${fmtN(s.total)} ${t("pcs")}${s.recvTotal ? " · " + t("received") + ": " + fmtN(s.recvTotal) : ""}</div></div>`; }).join("") + `</div>` : empty("recv", t("no_ships"))}`;
}
function vShip(s) {
  const exp = (s.rows || []).slice().sort(cmpAS), editable = ["draft", "pending"].includes(s.status);
  return `<div class="row" style="margin-bottom:10px"><button class="btn s" data-a="shipback">← ${t("back")}</button><div class="sp"></div>${stChip(s.status)}</div><h1>${esc(s.no)}</h1>
  <div class="card"><div class="grid3"><div><div class="mu sm">${t("a_created")}</div><b>${esc((s.createdBy || {}).name || "")}</b><div class="mu sm">${fmtDT(s.createdAt)}</div></div><div><div class="mu sm">${t("confirmed_by")}</div><b>${esc((s.confirmedBy || {}).name || "—")}</b><div class="mu sm">${s.confirmedAt ? fmtDT(s.confirmedAt) : ""}</div></div><div><div class="mu sm">${t("bags_total")}</div><b>${s.bagCount} · ${fmtN(s.total)} ${t("pcs")}</b><div class="mu sm">${t("received")}: ${fmtN(s.recvTotal || 0)}</div></div></div>${s.comment ? `<div class="mu" style="margin-top:8px">${esc(s.comment)}</div>` : ""}${s.cancelReason ? `<div class="warn" style="margin-top:10px">${t("a_cancel_reason")}: ${esc(s.cancelReason)}</div>` : ""}

async function loadAna() {

const dKey = (ts, g) => { const y = ymdMsk(new Date(tsMs(ts))); if (g === "month") return y.slice(0, 7); if (g === "week") { const x = new Date(y + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0, 10); } return y; };
const barsHtml = (map, cls) => { const ks = Object.keys(map).sort().slice(-14), mx = Math.max(1, ...ks.map(k => map[k])); return `<div class="bars">${ks.map(k => `<div class="bc"><span class="bv">${map[k] ? fmtN(map[k]) : ""}</span><div class="bb ${cls || ""}" style="height:${Math.max(2, Math.round(map[k] / mx * 90))}%"></div><span class="bl">${k.slice(k.length === 7 ? 2 : 5)}</span></div>`).join("")}</div>`; };
const topList = (map, n = 8) => { const e = Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, n), mx = e.length ? e[0][1] : 1; return e.length ? e.map(([k, v]) => `<div class="li" style="min-height:44px"><div class="t" style="flex:none;width:34%"><b>${esc(k)}</b></div><div class="hbar"><i style="width:${Math.round(v / mx * 100)}%"></i></div><b style="min-width:44px;text-align:right">${fmtN(v)}</b></div>`).join("") : `<div class="mu">${t("no_data")}</div>`; };
function vAna() {
  const A = S.ana, head = back() + `<h1>${t("m_ana")}</h1><div class="fl">${[7, 30, 90].map(d => `<span class="chip ${S.anaDays === d ? "on" : ""}" data-a="adays" data-v="${d}">${d} ${t("days")}</span>`).join("")}${["day", "week", "month"].map(g => `<span class="chip ${S.anaGran === g || (!S.anaGran && g === "day") ? "on" : ""}" data-a="agran" data-v="${g}">${t("g_" + g)}</span>`).join("")}</div>`;
  if (!A || A.loading) return head + `<div class="skel"></div><div class="skel"></div>`; if (A.err) return head + empty("chart", t("err_net"));
  const g = S.anaGran || "day", inM = {}, outM = {}, byA = {}, byS = {}, stf = {}, outBy = {}, rcvM = {};
  let tin = 0, tout = 0, dfc = 0, rc = 0;
  A.h.forEach(h => { const k = dKey(h.ts, g);
    if (IN_T.includes(h.type) && h.type !== "import_init") { inM[k] = (inM[k] || 0) + h.q; tin += h.q; }
    if (h.type === "stock_out") { outM[k] = (outM[k] || 0) + h.q; tout += h.q; byA[h.a] = (byA[h.a] || 0) + h.q; byS[h.s] = (byS[h.s] || 0) + h.q; const dk = nk(h.a) + "~" + nk(h.s); outBy[dk] = (outBy[dk] || 0) + h.q; }
    if (h.type === "receive") { rc++; rcvM[k] = (rcvM[k] || 0) + h.q; } if (h.type === "receive_diff") dfc++; if (h.name) stf[h.name] = (stf[h.name] || 0) + 1; });
  const all = items(), days = A.days, fast = all.filter(x => x.q > 0 && outBy[nk(x.a) + "~" + nk(x.s)]).map(x => ({ x, d: x.q / (outBy[nk(x.a) + "~" + nk(x.s)] / days) })).filter(v => v.d <= 14).sort((a, b) => a.d - b.d).slice(0, 8);
  const slow = all.filter(x => x.q > 0 && !outBy[nk(x.a) + "~" + nk(x.s)]).sort((a, b) => b.q - a.q).slice(0, 8);
  const sales = id => { const d = S.mp["sales_" + id]; if (!d || !d.rows) return null; const m = {}; d.rows.forEach(r => { m[r.a + " " + r.s] = r.st.reduce((n, s) => n + s.q.reduce((a, b) => a + b, 0), 0); }); return m; };
  const mrg = {}; ["wb", "ozon"].forEach(id => { const m = sales(id); if (m) Object.entries(m).forEach(([k, v]) => { mrg[k] = (mrg[k] || 0) + v; }); });
  return head + `<div class="grid4" style="margin-bottom:14px"><div class="kpi"><div class="v" style="color:var(--ok)">${fmtN(tin)}</div><div class="l">${t("k_in")}</div></div><div class="kpi"><div class="v" style="color:var(--er)">${fmtN(tout)}</div><div class="l">${t("k_out")}</div></div><div class="kpi"><div class="v">${fmtN(all.reduce((n, x) => n + (x.tr || 0), 0))}</div><div class="l">${t("k_transit")}</div></div><div class="kpi"><div class="v">${rc} / ${dfc}</div><div class="l">${t("k_rcv_diff")}</div></div></div>
  <div class="dgrid"><div><div class="card"><h2>${t("h_in")}</h2>${barsHtml(inM, "in")}</div><div class="card"><h2>${t("h_out")}</h2>${barsHtml(outM, "er")}</div><div class="card"><h2>${t("h_top_art")}</h2>${topList(byA)}</div><div class="card"><h2>${t("h_top_sz")}</h2>${topList(byS)}</div></div>
  <div><div class="card"><h2>${t("h_fast")}</h2>${fast.length ? fast.map(v => `<div class="li"><span class="dot ${v.d <= 5 ? "r" : "y"}"></span><div class="t"><b>${esc(v.x.a)} · ${esc(v.x.s)}</b><span>${t("left_days", { n: Math.max(1, Math.round(v.d)) })}</span></div><div class="q">${fmtN(v.x.q)}</div></div>`).join("") : `<div class="mu">${t("no_data")}</div>`}</div>
  <div class="card"><h2>${t("h_slow")}</h2>${slow.length ? slow.map(x => `<div class="li"><div class="t"><b>${esc(x.a)} · ${esc(x.s)}</b><span>${t("no_out", { n: days })}</span></div><div class="q">${fmtN(x.q)}</div></div>`).join("") : `<div class="mu">${t("no_data")}</div>`}</div>
  <div class="card"><h2>${t("h_staff")}</h2>${topList(stf, 10)}</div>

}

// Минимальные остатки
function minRows() {
  if (S.minArea === "phys") return items().map(x => ({ a: x.a, s: x.s, q: x.q || 0 }));
  const [id, f] = { ozfbs: ["ozon", "fbs"], ozfbo: ["ozon", "fbo"], wbfbs: ["wb", "fbs"], wbfbw: ["wb", "fbo"] }[S.minArea], rows = mpRows(id);
  return rows ? rows.map(r => ({ a: r.a, s: r.s, q: r[f] || 0 })).sort(cmpAS) : null;
}
function vMin() {
  if (!S.owner) return back() + empty("inv", t("err_perm"));
  const area = S.minArea, rows = minRows(), cfg = S.cfg, d = (cfg.def && cfg.def[area]) || DEF_TH, q = nk(S.minQ).toLowerCase();
  const list = rows ? rows.filter(r => !q || (nk(r.a) + " " + nk(r.s)).toLowerCase().includes(q)) : [];
  const cur = (k, f) => { const e = S.minEdit[area + "|" + k]; if (e && e[f] !== undefined) return e[f]; const v = (((cfg.min || {})[area] || {})[k] || {})[f]; return v == null ? "" : v; };
  return back() + `<h1>${t("a_min")}</h1><div class="fl">${Object.keys(AREAS).map(k => `<span class="chip ${area === k ? "on" : ""}" data-a="minarea" data-v="${k}">${AREAS[k].startsWith("area_") ? t(AREAS[k]) : AREAS[k]}</span>`).join("")}</div>
  <div class="card"><div class="mu sm" style="margin-bottom:8px">${t("a_min_help")}</div><div class="grid2"><label class="f">${t("a_def_y")}<input type="number" id="dy" class="num" value="${d.y}" data-free="1"></label><label class="f">${t("a_def_r")}<input type="number" id="dr" class="num" value="${d.r}" data-free="1"></label></div></div>
  <div class="sch">${IC.search}<input id="mq" placeholder="${t("search_ph")}" value="${esc(S.minQ)}" data-free="1"></div>
  <div class="card" style="margin-top:12px">${rows === null ? `<div class="mu">${t("mp_none")}</div>` : list.length ? `<div class="tw"><table class="tbl"><tr><th></th><th>${t("article")}</th><th>${t("size")}</th><th class="r">${t("k_stock_now")}</th><th>${t("a_y")}</th><th>${t("a_r")}</th></tr>${list.slice(0, 300).map(r => { const k = keyOf(r.a, r.s), l = level(r.q, { y: cur(k, "y"), r: cur(k, "r") }, d); return `<tr><td><span class="dot ${l}"></span></td><td>${esc(r.a)}</td><td>${esc(r.s)}</td><td class="r b">${fmtN(r.q)}</td><td><input type="number" min="0" class="num" style="width:76px;min-height:42px;font-size:16px" data-min="${k}" data-f="y" value="${cur(k, "y")}" placeholder="${d.y}" data-free="1"></td><td><input type="number" min="0" class="num" style="width:76px;min-height:42px;font-size:16px" data-min="${k}" data-f="r" value="${cur(k, "r")}" placeholder="${d.r}" data-free="1"></td></tr>`; }).join("")}</table></div>` : empty("inv", t("nothing_found"))}</div>
  <button class="btn p xl w" data-a="minsave">${t("save")}</button><div class="card" style="margin-top:14px"><h2>${t("a_refill")}</h2>${refill()}</div>`;
}
function refill() {
  const rows = items().map(x => ({ x, l: lvlOf(x, "phys", x.q || 0) })).filter(v => v.l !== "g").sort((a, b) => (a.l === "r" ? 0 : 1) - (b.l === "r" ? 0 : 1) || a.x.q - b.x.q).slice(0, 15);
  const free = {}; Object.values(S.bags).forEach(b => { if (bagState(b) === "free") (b.items || []).forEach(i => { const k = keyOf(i.a, i.s); free[k] = (free[k] || 0) + i.q; }); });
  return rows.length ? rows.map(v => `<div class="li"><span class="dot ${v.l}"></span><div class="t"><b>${esc(v.x.a)} · ${esc(v.x.s)}</b><span>${t("a_in_hodj", { n: fmtN(free[keyOf(v.x.a, v.x.s)] || 0) })}${v.x.tr ? " · " + t("in_transit") + ": " + fmtN(v.x.tr) : ""}</span></div><div class="q">${fmtN(v.x.q)}</div></div>`).join("") : `<div class="mu">${t("no_warn")}</div>`;
}
async function minSave() {
  const area = S.minArea, upd = {}, def = { y: parseInt($("#dy").value, 10), r: parseInt($("#dr").value, 10) };
  if (!(def.y >= 0) || !(def.r >= 0) || def.r > def.y) { toast(t("a_min_err"), "er"); return; }
  Object.entries(S.minEdit).forEach(([ak, v]) => { const [a, k] = ak.split("|"); if (a !== area) return; const o = {}; ["y", "r"].forEach(f => { if (v[f] !== undefined) o[f] = v[f] === "" ? null : parseInt(v[f], 10); }); upd[k] = o; });
  try {
    const clean = {}; Object.entries(upd).forEach(([k, o]) => { clean[k] = {}; Object.entries(o).forEach(([f, v]) => { clean[k][f] = v == null || isNaN(v) ? "" : v; }); });
    await setDoc(doc(db, "msk_settings", "main"), { def: { [area]: def }, min: { [area]: clean } }, { merge: true });
    S.minEdit = {}; Snd.play("opOk"); toast(t("saved"), "ok");
  } catch (e) { toast(t("err_perm"), "er"); }
}

// Импорт 1С / Excel / CSV
function vImp() {
  const I = S.imp;
  return back() + `<h1>${t("a_imp")}</h1><div class="info">${t("a_imp_help")}</div><div class="card"><label class="f">${t("a_imp_file")}<input type="file" id="impf" accept=".xlsx,.xls,.csv,.txt"></label>
  <div class="mu sm" style="margin-top:10px">${t("a_imp_cols")}</div></div>
  ${I ? `<div class="card"><h2>${t("a_imp_preview")}: ${I.rows.length}</h2><div class="tw"><table class="tbl"><tr><th>${t("article")}</th><th>${t("size")}</th><th>${t("barcode")}</th><th class="r">${t("qty")}</th><th>${t("a_name")}</th></tr>${I.rows.slice(0, 12).map(r => `<tr><td>${esc(r.a)}</td><td>${esc(r.s)}</td><td>${esc(r.bc)}</td><td class="r">${esc(r.q)}</td><td>${esc(r.name)}</td></tr>`).join("")}</table></div>${I.skipped ? `<div class="warn" style="margin-top:8px">${t("a_imp_skipped", { n: I.skipped })}</div>` : ""}<button class="btn p xl w" data-a="impgo" style="margin-top:12px">${t("a_imp_go")}</button><div id="impst" class="mu" style="margin-top:8px"></div></div>` : ""}`;
}
async function impFile(file) {
  try {
    const rows = await readTable(file); if (!rows.length) { toast(t("a_imp_empty"), "er"); return; }
    const h = rows[0].map(x => String(x).trim().toLowerCase()), find = (...n) => h.findIndex(x => n.some(y => x.includes(y)));
    let ci = { a: find("артикул", "article", "art"), s: find("размер", "size"), bc: find("штрихкод", "штрих-код", "barcode", "ean"), q: find("остаток", "количество", "кол-во", "qty", "stock"), name: find("наименование", "название", "номенклатура", "name") };
    let start = 1; if (ci.a < 0 || ci.s < 0) { ci = { a: 0, s: 1, bc: 2, q: 3, name: 4 }; start = isNaN(parseInt(rows[0][3])) ? 1 : 0; }
    const out = []; let sk = 0;
    rows.slice(start).forEach(r => { const a = String(r[ci.a] || "").trim(), s = String(r[ci.s] || "").trim(); if (!a || !s) { if (r.some(x => String(x).trim())) sk++; return; } out.push({ a, s, bc: ci.bc >= 0 ? String(r[ci.bc] || "").trim() : "", q: ci.q >= 0 ? String(r[ci.q] || "").replace(/\s/g, "").replace(",", ".") : "", name: ci.name >= 0 ? String(r[ci.name] || "").trim() : "" }); });
    out.forEach(r => { if (r.q !== "") r.q = Math.max(0, Math.round(parseFloat(r.q) || 0)); });
    S.imp = { rows: out, skipped: sk }; render();
  } catch (e) { toast(t("a_imp_err"), "er"); }
}
async function impGo() {
  const rows = S.imp.rows, st = $("#impst"); let c = 0, u = 0;
  try {
    for (let i = 0; i < rows.length; i += 150) { const r = await call("mskImport", { rows: rows.slice(i, i + 150) }); c += r.created; u += r.updated; if (st) st.textContent = Math.min(i + 150, rows.length) + " / " + rows.length; }
    Snd.play("opOk"); toast(t("a_imp_done", { c, u }), "ok"); S.imp = null; render();
  } catch (e) { Snd.play("opErr"); toast(e.message, "er"); }
}

// Отчёты
function vRep() {
  const b = (a, lb) => `<button class="btn w" data-a="${a}" style="margin-bottom:10px">⬇ ${t(lb)}</button>`;
  return back() + `<h1>${t("a_rep")}</h1><div class="card">${b("rep:stock", "rep_stock")}${b("rep:ships", "rep_ships")}${b("rep:hist", "rep_hist")}${b("rep:low", "rep_low")}</div>`;
}
async function report(k) {
  const d = ymdMsk();
  if (k === "stock") return exportXlsx("msk-stock-" + d, [{ name: "stock", rows: [[t("article"), t("size"), t("k_stock_now"), t("in_transit"), t("barcodes")]].concat(items().map(x => [x.a, x.s, x.q || 0, x.tr || 0, (x.bc || []).join(", ")])) }]);
  if (k === "ships") { const R = [[t("ship"), t("f_type"), t("a_created"), t("confirmed_by"), t("bags_s"), t("qty"), t("received"), t("when")]]; ships().forEach(s => R.push([s.no, t("st_" + s.status), (s.createdBy || {}).name || "", (s.confirmedBy || {}).name || "", s.bagCount, s.total, s.recvTotal || 0, fmtDT(s.confirmedAt || s.createdAt)])); return exportXlsx("msk-ships-" + d, [{ name: "ships", rows: R }]); }
  if (k === "low") return exportXlsx("msk-low-" + d, [{ name: "low", rows: [[t("article"), t("size"), t("k_stock_now"), t("f_type")]].concat(items().filter(x => lvlOf(x, "phys", x.q || 0) !== "g").map(x => [x.a, x.s, x.q || 0, lvlOf(x, "phys", x.q || 0) === "r" ? t("lv_r") : t("lv_y")])) }]);
  if (k === "hist") { try { const s = await getDocs(query(collection(db, "msk_history"), orderBy("ts", "desc"), limit(2000))); const R = [[t("when"), t("f_emp"), t("f_type"), t("article"), t("size"), t("qty"), t("ship"), t("reason"), t("comment")]]; s.docs.forEach(x => { const h = x.data(); R.push([fmtDT(h.ts), h.name || "", t("ty_" + h.type), h.a || "", h.s || "", h.q || 0, h.ship || "", rsn(h.reason), h.comment || ""]); }); exportXlsx("msk-history-" + d, [{ name: "history", rows: R }]); } catch (e) { toast(t("err_net"), "er"); } }
}

// ---------- события ----------
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === "home") location.href = "index.html";
  else if (a === "tab") { S.tab = v; S.sub = ""; S.openShip = null; if (v === "send" && !S.W) S.W = newW(); closeSheet(); render(); scrollTo(0, 0); }
  else if (a.startsWith("go:")) { const g = a.slice(3); S.sub = g === "more" ? "" : g; if (g === "hist") { S.histLoaded = false; S.hist = []; } if (g === "ana") S.ana = null; render(); scrollTo(0, 0); }
  else if (a === "lang") { C.setLangLocal(C.lang() === "ru" ? "uz" : "ru"); render(); }
  else if (a === "theme") { C.setThemeLocal(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); }
  else if (a === "setlang") { C.setLangLocal(v); render(); }
  else if (a === "sndtest") { Snd.play("scanOk", true); setTimeout(() => Snd.play("scanErr", true), 500); setTimeout(() => Snd.play("opOk", true), 1100); }
  else if (a === "cam") Cam.open(c => Scan.feed(c, "cam"), t("scan_camera"));
  else if (a === "manual") { const i = $("#man"); if (i && i.value.trim()) { const c = i.value.trim(); i.value = ""; Scan.lastCode = ""; Scan.feed(c, "man"); } }
  else if (a === "sfilt") { S.sendFilter = v; render(); }
  else if (a === "selall") { Object.values(S.bags).forEach(b => { if (bagState(b) === "free" && (/^(MIX|MONO|UZUM)-\d+$/.test(b.id))) { const raw = S.sq.trim().toLowerCase(), q = nk(S.sq).toLowerCase(); if (!raw || b.id.toLowerCase().includes(raw) || (b.items || []).some(i => (nk(i.a) + " " + nk(i.s)).toLowerCase().includes(q))) S.W.sel.add(b.id); } }); render(); }
  else if (a === "bagtog") { const s = S.W.sel; s.has(v) ? s.delete(v) : s.add(v); render(); }
  else if (a === "wclear") { S.W = newW(); render(); }
  else if (a === "wdraft") sendFlow(false);
  else if (a === "wsend") sendFlow(true);
  else if (a === "sfl") { S.sfl = v; render(); }
  else if (a === "ship") { S.tab = "ships"; S.openShip = v; render(); scrollTo(0, 0); }
  else if (a === "shipback") { S.openShip = null; render(); }
  else if (a === "shipedit") { S.W = newW(Object.assign({ id: v }, S.ships[v])); S.tab = "send"; render(); }
  else if (a === "shipconf") { const s = S.ships[v]; const ok = await confirmBox({ title: t("a_confirm_send"), ok: t("a_confirm_send"), text: `${s.bagCount} ${t("bags_s")} · ${fmtN(s.total)} ${t("a_robes_l")}<br><br>${t("a_confirm_warn")}` }); if (!ok) return; try { await call("mskShipConfirm", { shipId: v, opId: uuid() }); Snd.play("opOk"); toast(t("a_sent", { no: s.no }), "ok"); } catch (er) { Snd.play("opErr"); toast(er.message, "er"); } }
  else if (a === "shipcancel") {
    const sh = openSheet(`<h2>${t("a_cancel_ship")}</h2><div class="mu" style="margin-bottom:10px">${t("a_cancel_text")}</div><label class="f">${t("reason")}<input id="cr" maxlength="150"></label><div id="ce" style="color:var(--er);font-weight:600;margin-top:8px"></div><div class="row" style="margin-top:14px"><button class="btn w" data-x>${t("cancel")}</button><button class="btn d w" id="cok">${t("a_cancel_ship")}</button></div>`);
    $("[data-x]", sh).onclick = closeSheet; const opId = uuid();
    $("#cok", sh).onclick = async () => { const reason = $("#cr", sh).value.trim(); if (!reason) { $("#ce", sh).textContent = t("err_reason"); return; } $("#cok", sh).disabled = true; try { await call("mskShipCancel", { shipId: v, opId, reason }); toast(t("done"), "ok"); closeSheet(); } catch (er) { $("#cok", sh).disabled = false; $("#ce", sh).textContent = er.message; } };
  }
  else if (a === "shipxl") { const s = S.ships[v], R = [[t("ship"), t("bags_s"), t("article"), t("size"), t("expected"), t("actual"), t("f_type")]]; (s.bags || []).forEach(b => (b.rec || b.items.map(i => ({ a: i.a, s: i.s, exp: i.q, got: "" }))).forEach(r => R.push([s.no, b.id, r.a, r.s, r.exp, r.got, t(BAGST[b.st || "pending"] ? BAGST[b.st || "pending"][0] : "bs_wait")]))); exportXlsx(s.no, [{ name: s.no, rows: R }]); }
  else if (a === "staffnew") staffNew();
  else if (a === "staffedit") staffEdit(v);
  else if (a === "accedit") accEdit(v);
  else if (a === "hreset") { S.hf = {}; render(); }
  else if (a === "hmore") { S.histLim += 300; S.histLoaded = false; render(); }
  else if (a === "hexp") report("hist");
  else if (a === "adays") { S.anaDays = +v; S.ana = null; render(); }
  else if (a === "agran") { S.anaGran = v; render(); }
  else if (a === "minarea") { S.minArea = v; render(); }
  else if (a === "minsave") minSave();

});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "sq") { S.sq = el.value; clearTimeout(S._t); S._t = setTimeout(() => { render(); const i = $("#sq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  else if (el.id === "wc") S.W.comment = el.value;
  else if (el.id === "mq") { S.minQ = el.value; clearTimeout(S._t); S._t = setTimeout(() => { render(); const i = $("#mq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }

  else if (el.dataset.hf && el.tagName === "INPUT" && el.type !== "date") { S.hf[el.dataset.hf] = el.value; clearTimeout(S._t); S._t = setTimeout(() => { const id = el.dataset.hf, pos = el.selectionStart; render(); const n = $(`[data-hf="${id}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } }, 300); }
});
document.addEventListener("change", e => {
  const el = e.target;

try { Snd.load(JSON.parse(localStorage.getItem("msk_snd") || "null")); } catch (e) { }
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "man") { const c = e.target.value.trim(); if (c) { e.target.value = ""; Scan.lastCode = ""; Scan.feed(c, "man"); } } });
</script>
