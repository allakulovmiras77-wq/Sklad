<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,onSnapshot,runTransaction,writeBatch,query,orderBy,limit,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/*PURE-START*/
const MSK_TZ='Europe/Moscow';
const LK={'Х':'X','М':'M','А':'A','С':'C','Е':'E','О':'O','Р':'P','Т':'T','В':'B','Н':'H','К':'K','Л':'L'};
const nk=t=>String(t==null?'':t).trim().toUpperCase().replace(/[ХМАСЕОРТВНКЛ]/g,c=>LK[c]);
const keyOf=(a,s)=>(nk(a)+'__'+nk(s)).replace(/[\/\\#?\[\]]/g,'_');
const sanitCode=c=>String(c||'').trim().replace(/[^A-Za-z0-9_-]/g,'-').slice(0,80);
const mskDay=(d=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:MSK_TZ}).format(d);
const fmtDT=ms=>{if(!ms)return '—';const p=new Intl.DateTimeFormat('ru-RU',{timeZone:MSK_TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms)).reduce((o,x)=>(o[x.type]=x.value,o),{});return `${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute}`};
const PERMS=['view','add','out','rcv','inv','hist','ana','exp','staff','hoj'];
const ROLES={keeper:{view:1,add:1,out:1,inv:0,rcv:0,hist:0,ana:0,exp:0,staff:0,hoj:1},receiver:{view:1,add:0,out:0,rcv:1,inv:0,hist:0,ana:0,exp:0,staff:0,hoj:0},senior:{view:1,add:1,out:1,rcv:1,inv:1,hist:1,ana:1,exp:0,staff:0,hoj:1},analyst:{view:1,add:0,out:0,rcv:0,inv:0,hist:1,ana:1,exp:1,staff:0,hoj:1}};
// Цвет остатка: красный — не больше r, жёлтый — не больше y, иначе зелёный. Порог из настроек, иначе общий.
function lvl(q,thr){const r=thr&&Number.isFinite(+thr.r)?+thr.r:10,y=thr&&Number.isFinite(+thr.y)?+thr.y:20;return q<=r?'r':q<=y?'y':'g'}
// Прогресс по строкам отправления: lines — состав, rcv — операции приёмки (type='receive')
function shipProgress(ship,rcvOps){
  const ret=new Set(ship.ret||[]),got={},bad={};for(const o of rcvOps){if(o.ship!==ship.id)continue;got[o.ln]=(got[o.ln]||0)+(+o.d||0);bad[o.ln]=(bad[o.ln]||0)+(+o.bad||0)}
  const all=ship.lines.map((l,i)=>{const g=got[i]||0,b=bad[i]||0,returned=ret.has(l.bag),rem=returned?0:Math.max(0,l.q-g-b);return{i,...l,got:g,bad:b,rem,returned,short:ship.status==='closed'?rem:0,surplus:returned?0:Math.max(0,g+b-l.q)}});
  const rows=all.filter(r=>!r.returned),tot=rows.reduce((n,r)=>n+r.q,0),done=rows.reduce((n,r)=>n+Math.min(r.q,r.got+r.bad),0);
  const retQ=all.filter(r=>r.returned).reduce((n,r)=>n+r.q,0),gotQ=rows.reduce((n,r)=>n+r.got,0),badQ=rows.reduce((n,r)=>n+r.bad,0),shortQ=rows.reduce((n,r)=>n+r.short,0);
  let state=ship.status==='cancelled'?'cancelled':ship.status==='closed'?(shortQ>0?'short':'received'):done===0?'transit':rows.every(r=>r.rem===0)?'received':'partial';
  return{rows,all,tot,done,gotQ,badQ,shortQ,retQ,state}
}
// В пути по ключу (a|s): остаток не принятого по открытым отправлениям
function inTransit(ships,rcvOps){const m={};for(const sh of ships){if(sh.status!=='open')continue;const p=shipProgress(sh,rcvOps);for(const r of p.rows){if(r.rem>0)m[r.k]=(m[r.k]||0)+r.rem}}return m}
// --- CSV / импорт из 1С ---
function parseCSV(text){
  const t=String(text).replace(/^\uFEFF/,''),first=t.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,(first.split(c).length-1)]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''))
}
const COLS=[['art',/артикул|^арт\b|sku|vendor/i],['size',/размер|характеристик|size/i],['code',/штрих|barcode|ean|баркод/i],['name',/наименов|номенклатур|название|name/i],['qty',/остаток|количеств|колич|qty|кол-во/i]];
function guessColumns(header){const m={};header.forEach((h,i)=>{for(const [k,re] of COLS)if(m[k]===undefined&&re.test(String(h)))m[k]=i});return m}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return Number.isFinite(n)?n:NaN};
// Строки импорта -> позиции {a,s,code,name,q}; невалидные пропускаются и считаются
function buildImport(rows,map){
  const out=[],bad=[];
  for(const r of rows){const a=String(r[map.art]==null?'':r[map.art]).trim(),s=map.size>=0&&map.size!==undefined?String(r[map.size]==null?'':r[map.size]).trim():'';
    if(!a){bad.push(r);continue}
    const q=map.qty!==undefined&&map.qty>=0?num(r[map.qty]):NaN;
    out.push({a,s,code:map.code!==undefined&&map.code>=0?String(r[map.code]||'').replace(/[^A-Za-z0-9_-]/g,''):'',name:map.name!==undefined&&map.name>=0?String(r[map.name]||'').trim():'',q:Number.isFinite(q)&&q>0?Math.floor(q):0})}
  return{items:out,skipped:bad.length}
}
// --- Аналитика только из реальных операций ---
function analytics(ops,stock,days){
  const A={inQ:0,outQ:0,adjNet:0,n:ops.length,byDay:{},top:{},sizes:{},staff:{},disc:[],last:{}};
  for(const o of ops){const d=+o.d||0,bd=A.byDay[o.day]||(A.byDay[o.day]={in:0,out:0});
    if(o.type==='add'||o.type==='receive'||o.type==='import'){A.inQ+=d;bd.in+=d}
    else if(o.type==='out'){A.outQ+=-d;bd.out+=-d;A.top[o.a]=(A.top[o.a]||0)+(-d);const sk=nk(o.s);A.sizes[sk]=(A.sizes[sk]||0)+(-d);A.last[o.k]=(A.last[o.k]||0)+(-d)}
    else if(o.type==='adjust')A.adjNet+=d;
    const st=A.staff[o.name]||(A.staff[o.name]={n:0,in:0,out:0});st.n++;if(d>0)st.in+=d;else if(d<0)st.out+=-d;
    if(o.type==='receive'&&((+o.d||0)+(+o.bad||0))!==(+o.exp||0))A.disc.push(o)}
  const fast=[],slow=[];
  for(const k in stock){const q=stock[k].q,out=A.last[k]||0;if(out>0){const per=out/Math.max(1,days),left=q/per;if(left<=14)fast.push({k,a:stock[k].a,s:stock[k].s,q,out,left})}else if(q>0)slow.push({k,a:stock[k].a,s:stock[k].s,q})}
  fast.sort((a,b)=>a.left-b.left);slow.sort((a,b)=>b.q-a.q);A.fast=fast;A.slow=slow;return A
}

// ===== Маркетплейсы (данные существующей синхронизации mp) =====
const MP_COLS={oz_fbs:['ozon','fbs'],oz_fbo:['ozon','fbo'],wb_fbs:['wb','fbs'],wb_fbw:['wb','fbo']};
const DEF_THR={r:10,y:20,t:30};
const thrOf=(cfg,plat,k)=>{const it=cfg&&cfg.items&&cfg.items[plat+'|'+k],d=cfg&&cfg.def&&cfg.def[plat];return{...DEF_THR,...(d||{}),...(it||{})}};
// stock rows -> {key:{a,s,oz_fbs,oz_fbo,wb_fbs,wb_fbw}}; поле отсутствует, если площадка не отдала данные
function mpIndex(mp){const m={};if(!mp)return m;for(const [pk,[doc,fld]] of Object.entries(MP_COLS)){const d=mp[doc];if(!d||!d.rows)continue;for(const r of d.rows){const k=keyOf(r.a,r.s),x=m[k]||(m[k]={a:r.a,s:r.s});x[pk]=(x[pk]||0)+(+r[fld]||0)}}return m}
const LV={r:0,y:1,g:2};
function lvQ(q,t){return q<=t.r?'r':q<=t.y?'y':'g'}
// Рейтинг пополнения FBS: самые «красные» первыми; need — сколько довезти до целевого запаса; send — не больше, чем есть в Москве
function fbsRating(mpi,cfg,moscow,avg){
  const rows=[];
  for(const [k,x] of Object.entries(mpi)){
    const cols=['oz_fbs','wb_fbs'].filter(p=>x[p]!==undefined);if(!cols.length)continue;
    let worst='g',need=0,min=Infinity;const lv={};
    for(const p of cols){const t=thrOf(cfg,p,k),l=lvQ(x[p],t);lv[p]=l;if(LV[l]<LV[worst])worst=l;if(l!=='g')need+=Math.max(0,t.t-x[p]);min=Math.min(min,x[p])}
    const av=moscow[k]?moscow[k].q:0,daily=(avg&&avg[k])||0,fb=cols.reduce((n,p)=>n+x[p],0);
    rows.push({k,a:x.a,s:x.s,oz:x.oz_fbs,wb:x.wb_fbs,lv,level:worst,need,avail:av,send:Math.min(av,need),short:Math.max(0,need-av),min,cover:daily>0?fb/daily:null,daily})
  }
  rows.sort((a,b)=>LV[a.level]-LV[b.level]||(a.cover==null?1e9:a.cover)-(b.cover==null?1e9:b.cover)||a.min-b.min);
  return rows}
// ===== Продажи: дни msk_sales {day, ozon:[[a,s,fs,fo,fu]], wb:[...]} =====
function salesFromDocs(docs){const D={};for(const d of docs){const m=D[d.day]=D[d.day]||{};for(const pl of ['ozon','wb'])for(const r of (d[pl]||[])){const k=keyOf(r[0],r[1]),x=m[k]||(m[k]={a:r[0],s:r[1],oz:{fs:0,fo:0,fu:0},wb:{fs:0,fo:0,fu:0}});const t=x[pl==='ozon'?'oz':'wb'];t.fs+=+r[2]||0;t.fo+=+r[3]||0;t.fu+=+r[4]||0}}return D}
// запасной вариант: существующие mp/sales_* (30 дней, FBS и FBO смешаны в q)
function salesFromMp(mp){const D={};for(const [pl,key] of [['ozon','sales_ozon'],['wb','sales_wb']]){const d=mp&&mp[key];if(!d||!d.rows||!d.days)continue;for(const r of d.rows){const k=keyOf(r.a,r.s);(r.st||[]).forEach(st=>{const sp=st.fs!==undefined||st.fo!==undefined;(st.q||[]).forEach((q,i)=>{const day=d.days[i];if(!day)return;const m=D[day]=D[day]||{},x=m[k]||(m[k]={a:r.a,s:r.s,oz:{fs:0,fo:0,fu:0},wb:{fs:0,fo:0,fu:0}}),t=x[pl==='ozon'?'oz':'wb'];if(sp){t.fs+=(st.fs||[])[i]||0;t.fo+=(st.fo||[])[i]||0;t.fu+=(st.fu||[])[i]||0}else t.fu+=q})})}}return D}

const SND={ok:{beep:[[1000,0,.12]],chime:[[880,0,.1],[1320,.1,.16]],ding:[[1568,0,.2]]},er:{buzz:[[220,0,.3]],low:[[300,0,.15],[300,.2,.15]],double:[[200,0,.12],[150,.16,.22]]},done:[[660,0,.1],[880,.1,.1],[1320,.2,.2]],warn:[[600,0,.14],[600,.2,.14],[600,.4,.14]]};
function play(kind,force){if(!S.snd.on&&!force)return;const c=ac();if(!c)return;const seq=kind==='ok'?SND.ok[S.snd.ok]||SND.ok.beep:kind==='er'?SND.er[S.snd.er]||SND.er.buzz:SND[kind];if(!seq)return;
 for(const [f,st,d] of seq){const o=c.createOscillator(),g=c.createGain();o.type=kind==='er'?'sawtooth':'sine';o.frequency.value=f;const v=Math.max(.02,(+S.snd.vol||.7)*.5);g.gain.setValueAtTime(v,c.currentTime+st);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+st+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+st);o.stop(c.currentTime+st+d+.02)}
 try{if(navigator.vibrate)navigator.vibrate(kind==='er'?[200,80,200]:60)}catch(e){}}
function toast(m,k){const e=$('#toast');e.textContent=m;e.className='show '+(k||'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
const ok=m=>{play('ok');toast(m,'ok')},bad=m=>{play('er');toast(m,'er')};

/* ---------- атомарная операция: остаток + история одной транзакцией ---------- */
async function applyOp(o){
 const k=keyOf(o.a,o.s),id=o.id||'o'+rand(),sref=doc(db,'msk_stock',k),oref=doc(db,'msk_ops',id);
 try{return await runTransaction(db,async tx=>{
  const [ss,os]=await Promise.all([tx.get(sref),tx.get(oref)]);
  if(os.exists())return {dup:true};
  const before=ss.exists()?ss.data().q:0,q=before+o.d;
  if(q<0)throw {low:true,have:before};
  const op={type:o.type,k,a:o.a,s:o.s,d:o.d,q,uid:S.user.uid,name:meName(),ts:serverTimestamp(),day:mskDay()};
  for(const f of ['reason','cmt','ship','ln','n','exp','bad','uc'])if(o[f]!==undefined&&o[f]!=='')op[f]=o[f];
  tx.set(oref,op);tx.set(sref,{a:o.a,s:o.s,q,lo:id,lt:serverTimestamp()});return {ok:true,q,id}})}
 catch(e){if(e&&e.low)throw e;if(e&&e.code==='permission-denied')throw {perm:true};throw {net:true}}}
const errMsg=e=>e&&e.low?t('lowStock')+' ('+e.have+')':e&&e.perm?t('errPerm'):t('errNet');
async function ensureCodes(){if(S.codes)return;S.codes={};S.prods={};try{(await getDocs(collection(db,'msk_codes'))).docs.forEach(d=>S.codes[d.id]=d.data())}catch(e){}try{(await getDocs(collection(db,'prods'))).docs.forEach(d=>{const v=d.data();if(v.a)S.prods[d.id]={a:v.a,s:v.s||''}})}catch(e){}}
const resolveCode=c=>{const k=c.trim(),k2=k.replace(/[^A-Za-z0-9_-]/g,'');return S.codes[k]||S.codes[k2]||S.prods[k]||S.prods[k2]||null};

 ${fb?secT('flame',t('fbsTitle'),`<span class="sp"></span><button class="sm" data-tab="stock" data-sv="mp">${t('showAll')} ${ic('chevron',15)}</button>`)+`<div class="mu s" style="margin:-4px 2px 6px">${t('fbsSub')}</div>`+fbsBlock(8):''}

function vMp(){const idx=mpi(),q=nk(S.q),ch=S.mpCh,pl=S.mpPl;
 const chips=`<div class="chips"><button class="fc ${ch==='fbs'?'on':''}" data-mch="fbs">FBS</button><button class="fc ${ch==='fbo'?'on':''}" data-mch="fbo">FBO</button><button class="fc ${ch==='all'?'on':''}" data-mch="all">FBS + FBO</button><span class="sp"></span><button class="fc ${pl==='all'?'on':''}" data-mpl="all">${t('plAll')}</button><button class="fc ${pl==='ozon'?'on':''}" data-mpl="ozon">Ozon</button><button class="fc ${pl==='wb'?'on':''}" data-mpl="wb">WB</button></div><div class="mu s" style="margin:0 2px 8px">${t('chNote')}</div>`;
 if(!Object.keys(idx).length)return chips+`<div class="card">${empty('refresh',t('fbsEmpty'))}</div>`;
 const cols=[];if(pl!=='wb'){if(ch!=='fbo')cols.push(['oz_fbs','Ozon FBS']);if(ch!=='fbs')cols.push(['oz_fbo','Ozon FBO'])}if(pl!=='ozon'){if(ch!=='fbo')cols.push(['wb_fbs','WB FBS']);if(ch!=='fbs')cols.push(['wb_fbw','WB FBO'])}

 return chips+(names.length?`<div class="ag">${names.map(a=>{const l=groups[a].sort((x,y)=>String(x[1].s).localeCompare(String(y[1].s),'ru',{numeric:true}));const worst=l.reduce((w,[k,x])=>{cols.forEach(([p])=>{if(x[p]!==undefined){const lv=lvQ(x[p],thrOf(S.thr,p,k));if(LV[lv]<LV[w])w=lv}});return w},'g');
  return `<div class="card" style="margin:0"><div class="row"><b style="font-size:18px">${esc(a)}</b><div class="sp"></div><span class="chip solid lv${worst}">${lvName(worst)}</span></div>${l.map(([k,x])=>`<div class="sr"><span class="z">${esc(x.s||'—')}</span><div class="row" style="padding:0;gap:6px">${cols.map(([p,lab])=>x[p]===undefined?'':`<span class="chip lv${lvQ(x[p],thrOf(S.thr,p,k))}" title="${lab}"><span class="xs" style="opacity:.8">${ch==='all'?lab.replace('WB FBS','WB·FBS').replace('Ozon ','Ozon·'):lab.split(' ')[0]}</span> ${x[p]}</span>`).join('')}</div><span class="mu xs">${S.stock[k]?ic('box',13)+' '+S.stock[k].q:''}</span><span></span></div>`).join('')}</div>`}).join('')}</div>`:`<div class="card">${empty('search',t('noData'))}</div>`)}
function vHoj(){if(!(can('hoj')||canShip()))return `<div class="card">${empty('shield',t('hojNoRight'))}</div>`;if(!S.bags)return `<div class="card mu">${t('loading')}</div>`;
 const H=hojIndex(),q=nk(S.q),groups={};Object.entries(H).forEach(([k,x])=>{if(q&&!nk(x.a).includes(q))return;(groups[x.a]=groups[x.a]||[]).push(x)});const names=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true})),tot=arr(H).reduce((n,x)=>n+x.q,0);
 return `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="kpi"><div class="ki">${ic('warehouse',20)}</div><span class="l">${t('whHojT')}</span><b>${tot}</b><i>${t('pcs')}</i></div><div class="kpi"><div class="ki">${ic('bag',20)}</div><span class="l">${t('bagsN')}</span><b>${arr(S.bags).length}</b></div></div>`+(names.length?`<div class="ag">${names.map(a=>`<div class="card" style="margin:0"><div class="row"><b style="font-size:18px">${esc(a)}</b><div class="sp"></div><span class="chip">${groups[a].reduce((n,x)=>n+x.q,0)} ${t('pcs')}</span></div><div class="sizes">${groups[a].sort((x,y)=>String(x.s).localeCompare(String(y.s),'ru',{numeric:true})).map(x=>`<div class="sz" title="${esc(x.bags.join(', '))}"><span class="b">${esc(x.s||'—')}</span><span class="chip">${x.q}</span></div>`).join('')}</div></div>`).join('')}</div>`:`<div class="card">${empty('bag',t('hojEmpty'))}</div>`)}

/* ---------- ОПЕРАЦИИ: приход и списание в одном разделе ---------- */
const REASONS={add:['rsn_buy','rsn_ret','rsn_prod','rsn_other'],out:['rsn_sale','rsn_defect','rsn_lost','rsn_mp','rsn_other']};
function vOps(){const kind=(S.opk==='out'&&can('out'))||!can('add')?'out':'add';S.opk=kind;const se=S.sess[kind];ensureCodes();const arts=[...new Set(stockList().map(x=>x.a))];
 const tabs=`<div class="seg">${can('add')?`<button data-opk="add" class="${kind==='add'?'on add':''}">${ic('plus',20)}${t('nav_add')}</button>`:''}${can('out')?`<button data-opk="out" class="${kind==='out'?'on out':''}">${ic('minus',20)}${t('nav_out')}</button>`:''}</div>`;
 return `<h1>${t('opsTitle')}</h1><div class="mu s" style="margin:0 2px">${kind==='add'?t('opsAddHint'):t('opsOutHint')}</div>${tabs}
 <div class="card"><div class="seg"><button data-sm="sku" class="${se.mode==='sku'?'on pri':''}">${t('modeSku')}</button><button data-sm="unit" class="${se.mode==='unit'?'on pri':''}">${t('modeUnit')}</button></div>
 <label class="mu s">${t('scanHere')}</label><input id="scan" class="scan" inputmode="none" autocomplete="off" placeholder="${t('scanHere')}"><div class="mu s">${t('scanHint')}</div>

 <details><summary class="mu">${t('manual')}</summary><div class="row"><input id="ma" list="arts" placeholder="${t('article')}"><datalist id="arts">${arts.map(a=>`<option value="${esc(a)}">`).join('')}</datalist><input id="ms" placeholder="${t('size')}" style="max-width:110px"><button data-act="manadd">${ic('plus',18)}${t('addToList')}</button></div></details></div>
 <div class="card"><h3>${t('list')}</h3>${se.items.length?se.items.map((it,i)=>`<div class="row"><b>${esc(it.a)}</b><span class="chip">${esc(it.s)}</span><div class="sp"></div><b>${it.units?it.units.length:it.q}</b><button class="sm" data-rm="${i}" title="${t('clear')}">${ic('x',16)}</button></div>`).join(''):empty('scan',t('emptyList'))}
 <label class="mu s">${t('reason')}</label><select data-in="reason">${REASONS[kind].map(r=>`<option value="${r}" ${se.reason===r?'selected':''}>${t(r)}</option>`).join('')}</select>
 <input data-in="cmt" value="${esc(se.cmt)}" placeholder="${t('comment')} (${t('optional')})" maxlength="400">
 <div class="row"><button class="${kind==='add'?'g':'d'} big" style="flex:2" data-act="commit" ${se.items.length?'':'disabled'}>${ic(kind==='add'?'check':'minus',20)}${t('commit')}</button><button class="big" style="flex:1" data-act="clearlist">${t('clear')}</button></div></div>`}
let lastScan={c:'',t:0};
async function onScan(raw){const c=String(raw||'').trim();if(!c)return;const now=Date.now();if(c===lastScan.c&&now-lastScan.t<700)return;lastScan={c,t:now};
 if(S.tab==='recv')return recvScan(c);if(S.tab==='moves'&&S.newShip)return addBagCode(c);
 await ensureCodes();const se=S.sess[S.opk],hit=resolveCode(c);
 if(se.mode==='unit'){if(hit){se.cur={a:hit.a,s:hit.s||''};ok(hit.a+' '+(hit.s||''));render();return}
   if(!se.cur){bad(t('unitFirst'));return}
   const uc=sanitCode(c);let it=se.items.find(i=>nk(i.a)===nk(se.cur.a)&&nk(i.s)===nk(se.cur.s)&&i.units);if(!it){it={a:se.cur.a,s:se.cur.s,units:[]};se.items.push(it)}
   if(se.items.some(i=>i.units&&i.units.includes(uc))){bad(t('dupScan'));return}
   it.units.push(uc);ok(it.a+' '+it.s+' ×'+it.units.length);render();return}
 if(!hit){bad(t('notFound')+': '+c);return}
 const n=Math.max(1,num0(($('#qty')||{}).value)||1);addItem(hit.a,hit.s||'',n);ok(hit.a+' '+(hit.s||'')+' ×'+n);render()}
function addItem(a,s,q){const se=S.sess[S.opk];let it=se.items.find(i=>!i.units&&nk(i.a)===nk(a)&&nk(i.s)===nk(s));if(!it){it={a,s,q:0};se.items.push(it)}it.q+=q}
async function commit(){const kind=S.opk,se=S.sess[kind];if(S.busy||!se.items.length)return;S.busy=true;toast(t('processing'));const sign=kind==='add'?1:-1,fails=[];
 for(const it of [...se.items]){try{
   if(it.units){for(const uc of [...it.units]){await applyOp({type:kind,a:it.a,s:it.s,d:sign,uc,reason:se.reason?t(se.reason):'',cmt:se.cmt,id:`u_${uc}_${sign>0?'in':'out'}`});it.units=it.units.filter(x=>x!==uc)}}
   else{it.opId=it.opId||'o'+rand();await applyOp({type:kind,a:it.a,s:it.s,d:sign*it.q,reason:se.reason?t(se.reason):'',cmt:se.cmt,id:it.opId})}
   se.items=se.items.filter(x=>x!==it)}catch(e){fails.push(it.a+' '+it.s+': '+errMsg(e))}}
 S.busy=false;if(fails.length){bad(fails[0])}else{play('done');toast(t('okOp'),'ok')}render()}

/* ---------- ПРИЁМКА: «Принять всё» ---------- */
const addRcv=o=>{if(!S.rcvOps.some(x=>x.id===o.id))S.rcvOps.push(o)};
const bagNorm=c=>{const m=/^(MIX|MONO|UZUM)-?(\d+)$/.exec(String(c).trim().toUpperCase());return m?m[1]+'-'+m[2].padStart(3,'0'):String(c).trim().toUpperCase()};
const stLabel=st=>({transit:t('st_transit'),partial:t('st_partial'),received:t('st_rcvd'),short:t('st_short'),cancelled:t('st_cancelled')})[st]||st;
const stCls=st=>st==='received'?'lvg':st==='short'||st==='cancelled'?'lvr':'lvy';
function vRecv(){if(S.recv)return vRecvDetail();const ships=shipsArr().filter(s=>s.status==='open');
 return `<h1>${t('nav_recv')}</h1>`+(ships.length?`<div class="ag">${ships.map(s=>{const P=shipProgress(s,S.rcvOps);return `<div class="card ship" style="margin:0"><div class="row"><b style="font-size:18px">${esc(s.no)}</b><span class="chip ${stCls(P.state)}">${stLabel(P.state)}</span><div class="sp"></div><span class="mu s">${fmtDT(s.tms)}</span></div>
  <div class="mu s">${t('shipBy')}: ${esc(s.byName)} · ${s.bags.length-(s.ret||[]).length} ${t('bagsN')}</div><div class="grid4"><div class="g4"><span>${t('shipExp')}</span><b>${P.tot}</b></div><div class="g4"><span>${t('shipGot')}</span><b class="pos">${P.done}</b></div></div><div class="bar2"><i style="width:${P.tot?Math.min(100,P.done/P.tot*100):0}%"></i></div>
  <button class="g big" data-recvall="${esc(s.id)}" ${P.rows.every(r=>r.rem===0)?'disabled':''}>${ic('pkgcheck',22)}${t('recvAll')}</button><div class="mu xs c" style="margin:6px 0 10px">${t('recvAllHint')}</div><button class="big" style="margin-top:0" data-recvopen="${esc(s.id)}">${ic('bag',20)}${t('recvByBag')}</button></div>`}).join('')}</div>`:`<div class="card">${empty('inbox',t('noShips'))}</div>`)}
function vRecvDetail(){const sh=S.ships[S.recv.id];if(!sh){S.recv=null;return vRecv()}const P=shipProgress(sh,S.rcvOps),bagsL=sh.bags.filter(b=>!(sh.ret||[]).includes(b)),open=sh.status==='open';
 return `<div class="row"><button class="sm" data-act="recvback">${ic('chevron',16,'')}</button><h1 style="margin:0">${esc(sh.no)}</h1><span class="chip ${stCls(P.state)}">${stLabel(P.state)}</span></div>
 ${open?`<button class="g big" data-recvall="${esc(sh.id)}" ${P.rows.every(r=>r.rem===0)?'disabled':''}>${ic('pkgcheck',22)}${t('recvAll')} (${P.tot-P.done} ${t('pcs')})</button>`:''}
 <div class="card"><label class="mu s">${t('scanBag')}</label><div class="row"><input id="scan" class="scan" placeholder="MONO-001" autocomplete="off" inputmode="none"><button data-act="camscan">${ic('camera',22)}</button></div><div class="mu s">${t('shipExp')}: ${P.tot} · ${t('shipGot')}: ${P.done}</div></div>
 ${bagsL.map(b=>{const rows=P.rows.filter(r=>r.bag===b),sc=S.recv.scanned&&S.recv.scanned[b],rem=rows.reduce((n,r)=>n+r.rem,0);return `<div class="card ${S.recv.hl===b?'hl':''}"><div class="row"><b style="font-size:17px">${ic('bag',20)} ${esc(b)}</b>${sc?`<span class="chip lvg">${ic('check',14)} ${t('scanned')}</span>`:''}${rem===0?`<span class="chip lvg">${ic('check',14)} ${t('received')}</span>`:''}<div class="sp"></div>${open&&rem>0?`<button class="sm g" data-recvbag="${esc(b)}">${ic('check',16)}${t('recvBagBtn')}</button>`:''}</div>
   ${rows.map(r=>`<div class="rl"><div class="row"><b>${esc(r.a)}</b><span class="chip">${esc(r.s)}</span><div class="sp"></div><span class="mu s">${t('shipExp')} <b>${r.q}</b> · ${t('shipGot')} <b>${r.got}</b>${r.bad?` · ${t('damaged')} <b>${r.bad}</b>`:''} · ${t('shipRem')} <b>${r.rem}</b>${r.surplus?` · <span class="pos">${t('surplus')} ${r.surplus}</span>`:''}${r.short?` · <span class="neg">${t('shortage')} ${r.short}</span>`:''}</span></div>
   ${open&&r.rem>0?`<details><summary class="mu xs">${t('recvExpand')}</summary><div class="row"><input type="number" min="0" id="g_${r.i}" value="${r.rem}" class="qty" title="${t('got')}"><input type="number" min="0" id="b_${r.i}" value="0" class="qty" title="${t('bad')}" placeholder="${t('bad')}"><input id="c_${r.i}" placeholder="${t('comment')}"><label class="ph">${ic('camera',20)}<input type="file" accept="image/*" capture="environment" id="p_${r.i}" hidden></label><button class="p" data-recvline="${r.i}">${t('recvLine')}</button></div></details>`:''}</div>`).join('')}</div>`}).join('')}
 ${open?`<div class="card"><button class="d big" style="margin-top:0" data-act="recvclose">${ic('alert',20)}${t('closeShort')}</button><div class="mu xs" style="margin-top:8px">${t('closeHint2',P.tot-P.done)}</div></div>`:''}`}
function recvScan(c){if(!S.recv)return;const sh=S.ships[S.recv.id],b=bagNorm(c);if(!sh.bags.includes(b)){bad(t('wrongBag')+': '+b);return}S.recv.scanned=S.recv.scanned||{};S.recv.scanned[b]=1;S.recv.hl=b;ok(t('scanned')+': '+b);render();setTimeout(()=>{const e=document.querySelector('.card.hl');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},50)}
async function compress(file){return new Promise((res,rej)=>{const img=new Image(),fr=new FileReader();fr.onload=()=>{img.onload=()=>{const sc=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.6,d=c.toDataURL('image/jpeg',q);while(d.length>280000&&q>.2){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function maybeClose(shId){const sh=S.ships[shId];if(!sh||sh.status!=='open')return;const P=shipProgress(sh,S.rcvOps);if(P.rows.length&&P.rows.every(r=>r.rem===0)){try{await updateDoc(doc(db,'msk_ships',shId),{status:'closed',closedBy:S.user.uid,closedName:meName(),closedAt:serverTimestamp(),cnote:''})}catch(e){}}}
async function recvOne(sh,r,got,bd,cmt,rsn){const n=S.rcvOps.filter(o=>o.ship===sh.id&&o.ln===r.i).length+1,id=`rcv_${sh.id}_${r.i}_${n}`;
 const res=await applyOp({type:'receive',a:r.a,s:r.s,d:got,ship:sh.id,ln:r.i,n,exp:r.q,bad:bd,cmt,id,reason:rsn||''});if(!res.dup)addRcv({ship:sh.id,ln:r.i,d:got,bad:bd,id,type:'receive',day:mskDay()});return {res,id}}
async function recvAll(shId){if(S.busy)return;const sh=S.ships[shId],P=shipProgress(sh,S.rcvOps),rows=P.rows.filter(r=>r.rem>0);if(!rows.length){toast(t('recvNothing'));return}
 if(!await confirmBox(t('recvAll'),t('recvAllConfirm',esc(sh.no),rows.length,rows.reduce((n,r)=>n+r.rem,0)),t('recvAll'),'g'))return;
 S.busy=true;toast(t('processing'));let n=0;try{for(const r of rows){await recvOne(sh,r,r.rem,0,'','');n++}play('done');toast(t('recvAllDone')+': '+sh.no,'ok')}catch(e){bad(errMsg(e))}
 S.busy=false;await maybeClose(shId);render()}
async function recvLine(i){if(S.busy)return;const sh=S.ships[S.recv.id],P=shipProgress(sh,S.rcvOps),r=P.rows.find(x=>x.i===i),got=num0($('#g_'+i).value),bd=num0($('#b_'+i).value),cmt=($('#c_'+i).value||'').trim();
 if(got<0||bd<0||got+bd<=0){bad(t('qty'));return}
 if(got+bd>r.rem&&!await confirmBox(t('surplus'),(got+bd-r.rem)+' '+t('pcs'),t('confirm')))return;
 S.busy=true;try{const {res,id}=await recvOne(sh,r,got,bd,cmt,got+bd<r.rem?t('shortage'):got+bd>r.rem?t('surplus'):'');
  if(res.dup)toast(t('dupOp'));else{ok(t('received')+': '+r.a+' '+r.s+' ×'+got);const f=$('#p_'+i);if(f&&f.files[0]){try{await setDoc(doc(db,'msk_photos',id),{op:id,ship:sh.id,uid:S.user.uid,ts:serverTimestamp(),data:await compress(f.files[0])})}catch(e){}}}}
 catch(e){bad(errMsg(e))}S.busy=false;await maybeClose(sh.id);render()}
async function recvBag(b){if(S.busy)return;const sh=S.ships[S.recv.id],P=shipProgress(sh,S.rcvOps),rows=P.rows.filter(r=>r.bag===b&&r.rem>0);if(!rows.length){toast(t('received'));return}
 S.busy=true;let okc=0;try{for(const r of rows){await recvOne(sh,r,r.rem,0,'','');okc++}}catch(e){bad(errMsg(e))}
 S.busy=false;if(okc){play('done');toast(t('received')+': '+b,'ok')}await maybeClose(sh.id);render()}
async function recvClose(){const sh=S.ships[S.recv.id],P=shipProgress(sh,S.rcvOps),rem=P.rows.filter(r=>r.rem>0);

 if((el=g('[data-invstep]'))){const [k,d]=el.dataset.invstep.split('|'),cur=S.inv[k]===undefined||S.inv[k]===''?(S.stock[k]?S.stock[k].q:0):num0(S.inv[k]);S.inv[k]=String(Math.max(0,cur+(+d)));render();return}
 if((el=g('[data-antab]'))){S.an.tab=el.dataset.antab;render();return}
 if((el=g('[data-apre]'))){const v=el.dataset.apre;setPreset(isNaN(+v)?v:+v);return}
 if((el=g('[data-ach]'))){S.an.ch=el.dataset.ach;render();return}
 if((el=g('[data-apl]'))){S.an.pl=el.dataset.apl;render();return}
 if((el=g('[data-aod]'))){S.an.opsDays=+el.dataset.aod;S.an.opsDocs=null;render();return}
 if((el=g('[data-thrp]'))){S.thrP=el.dataset.thrp;render();return}
 if((el=g('[data-play]'))){play(el.dataset.play,true);return}
 if((el=g('[data-saveperm]'))){const id=el.dataset.saveperm,p={};document.querySelectorAll(`[data-pp^="${CSS.escape(id)}|"]`).forEach(c=>p[c.dataset.pp.split('|')[1]]=c.checked);try{await updateDoc(doc(db,'msk_profiles',id),{p});ok(t('saved'))}catch(x){bad(t('errPerm'))}return}
 if((el=g('[data-toggle]'))){const id=el.dataset.toggle,p=S.profiles[id];try{await updateDoc(doc(db,'msk_profiles',id),{active:p.active===false})}catch(x){bad(t('errPerm'))}return}
 const a=(g('[data-act]')||{dataset:{}}).dataset.act;if(!a)return;
 if(a==='login')doLogin();else if(a==='logout')signOut(auth);else if(a==='savename')saveName();else if(a==='savepn')savePn();
 else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';applyPrefs();savePrefs();shell()}
 else if(a==='langtog'){S.lang=S.lang==='ru'?'uz':'ru';applyPrefs();savePrefs();shell()}
 else if(a==='commit')commit();else if(a==='clearlist'){S.sess[S.opk].items=[];render()}
 else if(a==='manadd'){await ensureCodes();const A=($('#ma').value||'').trim(),Z=($('#ms').value||'').trim(),n=Math.max(1,num0(($('#qty')||{}).value)||1);if(!A){bad(t('article'));return}if(S.sess[S.opk].mode==='unit'){S.sess[S.opk].cur={a:A,s:Z};render()}else{addItem(A,Z,n);render()}}
 else if(a==='recvback'){S.recv=null;render()}else if(a==='recvclose')recvClose();
 else if(a==='camscan')camScan(c=>onScan(c));
 else if(a==='newship'){S.newShip={sel:new Set(),q:'',note:''};render()}else if(a==='shipback'){S.newShip=null;render()}else if(a==='shipgo')createShip();
 else if(a==='invgo')invApply();else if(a==='histload')histLoad();
 else if(a==='histcsv')dl('msk_history.csv',[[t('hDate'),t('hStaff'),t('hOp'),t('hArt'),t('hSize'),t('hQty'),t('reason'),t('comment')],...hist().map(o=>[fmtDT(o.tms),o.name,opName(o),o.a,o.s,o.d,o.reason||'',o.cmt||''])]);
 else if(a==='mkstaff')mkStaff();else if(a==='thrsave')thrSave();else if(a==='impgo')impGo();else if(a==='mclose')closeModal()});
document.addEventListener('keydown',e=>{if(e.target.id==='scan'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';onScan(v)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.in==='reason'){S.sess[S.opk].reason=el.value}
 if(el.dataset.bagsel){el.checked?S.newShip.sel.add(el.dataset.bagsel):S.newShip.sel.delete(el.dataset.bagsel);render()}
 if(el.dataset.snd){const k=el.dataset.snd;S.snd[k]=el.type==='checkbox'?el.checked:k==='vol'?+el.value:el.value;savePrefs();if(k==='ok')play('ok');if(k==='er')play('er')}
 if(el.dataset.imap){S.imp.map[el.dataset.imap]=+el.value}
 if(el.dataset.adate){S.an[el.dataset.adate]=el.value;S.an.preset='custom';S.an.key='';if(S.an.from&&S.an.to&&S.an.from<=S.an.to)render()}
 if(el.id==='impf'&&el.files[0])impFile(el.files[0]).catch(()=>bad(t('errNet')));
 if(el.dataset.hf){S.hf[el.dataset.hf]=el.value;render()}});
function dbn(key,fn){clearTimeout(dbn[key]);dbn[key]=setTimeout(fn,250)}
document.addEventListener('input',e=>{const el=e.target,keep=sel=>{const p=el.selectionStart;render();const n=$(sel);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}};
 if(el.dataset.in==='q'){S.q=el.value;dbn('q',()=>keep('[data-in="q"]'))}
 if(el.dataset.in==='cmt')S.sess[S.opk].cmt=el.value;
 if(el.dataset.in==='nsq'){S.newShip.q=el.value;dbn('nsq',()=>keep('[data-in="nsq"]'))}
 if(el.dataset.in==='nsn')S.newShip.note=el.value;
 if(el.dataset.inv!==undefined){S.inv[el.dataset.inv]=el.value;dbn('inv',()=>{const k=el.dataset.inv,p=el.selectionStart;render();const n=document.querySelector(`[data-inv="${CSS.escape(k)}"]`);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}})}});
loadLocal();showLogin();

</script></body></html>
