
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Check required files
        run: |
          set -euo pipefail
          test -f index.html || { echo "ERROR: index.html not found"; exit 1; }
          test -f manifest.json || { echo "ERROR: manifest.json not found"; exit 1; }
          test -f icon-192-1.png || { echo "ERROR: icon-192-1.png not found"; exit 1; }
          test -f Icon-512-1.png || { echo "ERROR: Icon-512-1.png not found"; exit 1; }
          echo "All required files found."

      - name: Build APK
        run: |
          set -euo pipefail

          mkdir app
          cd app

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          mkdir www
          cp ../index.html ../manifest.json ../icon-192-1.png ../Icon-512-1.png www/

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "uz.lidertekstil.sklad",
            "appName": "Склад LT",
            "webDir": "www",
            "server": {
              "url": "https://allakulovmiras77-wq.github.io/Sklad/",
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("../icon-192-1.png")

          if not source.is_file():
              raise SystemExit("ERROR: icon-192-1.png not found")

          image = Image.open(source).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = Path("android/app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              output = folder / "ic_launcher.png"
              resized = image.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )
              resized.save(output)

          print("Application icons generated successfully.")
          PY

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          if 'android.permission.CAMERA' not in content:
              permission = (
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-feature android:name="android.hardware.camera" '
                  'android:required="false" />\n'
              )

              if "<application" not in content:
                  raise SystemExit("ERROR: application tag not found in AndroidManifest.xml")

              content = content.replace(
                  "<application",
                  permission + "    <application",
                  1
              )

              manifest.write_text(content, encoding="utf-8")

          print("Camera permission configured.")
          PY

          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK built successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sklad-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
          
