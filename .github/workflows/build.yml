name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp ../index.html ../manifest.json ../icon-192-1.png ../icon-512-1.png www/
          echo '{"appId":"uz.lidertekstil.sklad","appName":"Склад","webDir":"www","server":{"url":"https://allakulovmiras77-wq.github.io/Sklad/","androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sklad-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
