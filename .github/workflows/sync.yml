name: Sync marketplaces
on:
  schedule:
   - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save
      - run: node scripts/sync.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_CLIENT_ID_1: ${{ secrets.OZON_CLIENT_ID_1 }}
          OZON_API_KEY_1: ${{ secrets.OZON_API_KEY_1 }}
          OZON_CLIENT_ID_2: ${{ secrets.OZON_CLIENT_ID_2 }}
          OZON_API_KEY_2: ${{ secrets.OZON_API_KEY_2 }}
          UZUM_TOKEN: ${{ secrets.UZUM_TOKEN }}
