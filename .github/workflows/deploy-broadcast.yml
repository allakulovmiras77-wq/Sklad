name: Deploy broadcast function
# Публикует серверную функцию рассылки уведомлений (sendBroadcast). Запускать вручную один раз
# и после изменений в functions/broadcast.js: Actions → Deploy broadcast function → Run workflow.
# Нужны секреты репозитория: FIREBASE_SERVICE_ACCOUNT и VAPID_PRIVATE_KEY (они уже используются для push-reminder).
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --prefix functions
      - run: npm install -g firebase-tools
      - name: Deploy
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID" > functions/.env
          firebase deploy --project lider-tekstil --non-interactive --force --only functions:sendBroadcast
