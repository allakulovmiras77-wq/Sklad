/* ----- чистые функции: потребность складов ----- */
function rate(hoj,msk,cfg){cfg={...DEF_CFG,...(cfg||{})};
 if(!(hoj>=cfg.hojMin)||hoj<=0)return{level:'x',score:-1,need:0,send:0};
 const target=Math.max(1,+cfg.target),deficit=Math.max(0,target-msk),level=msk<=cfg.low?'r':msk<=cfg.warn?'y':'g';
 const score=level==='g'?0:(deficit/target)*(0.6+0.4*Math.min(1,hoj/target));
 return{level,score:Math.round(score*1000)/1000,need:deficit,send:Math.min(hoj,deficit)}}
function hojIndex(bags){const m={};if(!bags)return m;for(const b of Object.values(bags))for(const i of (b.items||[])){const q=+i.q||0;if(q<=0)continue;const k=keyOf(i.a,i.s),x=m[k]||(m[k]={a:i.a,s:i.s,q:0});x.q+=q}return m}
function mskIndex(stock){const m={};if(!stock)return m;for(const d of Object.values(stock)){const k=keyOf(d.a,d.s);m[k]={a:d.a,s:d.s,q:+d.q||0}}return m}
function cmpRows(bags,stock,cfg){const H=hojIndex(bags),M=mskIndex(stock),keys=new Set([...Object.keys(H),...Object.keys(M)]),out=[];
 keys.forEach(k=>{const h=H[k]?H[k].q:0,m=M[k]?M[k].q:0,a=(H[k]||M[k]).a,s=(H[k]||M[k]).s,r=rate(h,m,cfg);out.push({k,a,s,hoj:h,msk:m,diff:h-m,...r})});
 return out.sort((x,y)=>y.score-x.score||y.hoj-x.hoj||String(x.a).localeCompare(String(y.a),'ru',{numeric:true})||SZR(x.s)-SZR(y.s))}
/* ----- статистика по раскрою ----- */
function pcsOf(op){return(op.items||[]).reduce((n,i)=>n+(+i.q||0),0)}
function cutStats(ops,now,days){const from=now-days*864e5,L=ops.filter(o=>o.type==='cut'&&msOf(o)>=from),mat={},who={};let pcs=0,g=0;
 L.forEach(o=>{const p=pcsOf(o);pcs+=p;g+=o.w;const mk=o.cat+'|'+o.mt;mat[mk]=(mat[mk]||0)+o.w;const w=who[o.name]||(who[o.name]={pcs:0,g:0,n:0});w.pcs+=p;w.g+=o.w;w.n++});
 return{pcs,g,n:L.length,mat:Object.entries(mat).sort((a,b)=>b[1]-a[1]),who:Object.entries(who).sort((a,b)=>b[1].pcs-a[1].pcs)}}
function pcsByDay(ops,now,n){const m={};ops.filter(o=>o.type==='cut').forEach(o=>{const d=dayOf(msOf(o));m[d]=(m[d]||0)+pcsOf(o)});const out=[];for(let i=n-1;i>=0;i--){const d=dayOf(now-i*864e5);out.push([d,m[d]||0])}return out}

function vProf(){const p=S.prof||{},mine=S.ops.filter(o=>o.uid===S.user.uid),cuts=mine.filter(o=>o.type==='cut'),pcs=cuts.reduce((n,o)=>n+pcsOf(o),0),g=cuts.reduce((n,o)=>n+o.w,0);
 const sw=(k,on)=>`<label class="switch"><input type="checkbox" data-snd="${k}" ${on?'checked':''}><i></i></label>`;
 return `<h1>${t('nav_prof')}</h1><div class="card"><div class="row" style="align-items:flex-start"><div>${p.photo?`<img class="ph" src="${esc(p.photo)}" alt="">`:`<div class="pavatar" style="width:84px;height:84px;font-size:30px">${esc(initials(meName()))}</div>`}</div><div class="sp"><b style="font-size:21px">${esc(meName())||'—'}</b>
 <div class="mu s">${t('pf_pos')}: ${isOwner()?t('r_owner'):t('sf_pos')+' / Bichuvchi'}</div>${isOwner()?'':`<div class="mu s">${t('pf_id')}: <b>${esc(p.eid||'—')}</b></div><div class="mu s">${t('pf_since')}: ${fmtDT(p.created)}</div><div class="mu s">${esc(S.email)}</div>`}<div style="margin-top:6px"><span class="chip lvg">${t('active')}</span></div></div></div>
 ${isOwner()?'':`<label class="btnl" style="margin-top:12px;width:100%">${ic('camera',18)} ${t('pf_change')}<input type="file" id="phf" accept="image/*" style="display:none"></label>`}</div>
 <div class="kpis" style="grid-template-columns:repeat(2,1fr)"><div class="kpi"><div class="ki">${ic('scissors',20)}</div><span class="l">${t('pf_total')}</span><b>${pcs}</b><i>${t('pcs')}</i></div><div class="kpi gn"><div class="ki">${ic('scale',20)}</div><span class="l">${t('h_kg')}</span><b>${kg(g)}</b></div></div>
 <div class="card"><div class="row"><span class="sp">${t('language')}</span><div class="seg" style="min-width:150px"><button data-act="setlang" data-v="ru" class="${S.lang==='ru'?'on':''}">RU</button><button data-act="setlang" data-v="uz" class="${S.lang==='uz'?'on':''}">UZ</button></div></div>
 <div class="row"><span class="sp">${t('theme')}</span><div class="seg" style="min-width:190px"><button data-act="settheme" data-v="light" class="${S.theme==='light'?'on':''}">${t('th_light')}</button><button data-act="settheme" data-v="dark" class="${S.theme==='dark'?'on':''}">${t('th_dark')}</button></div></div></div>
 <div class="card"><h3>${t('pf_pwd')}</h3><input id="po" type="password" placeholder="${t('pf_pwdOld')}" autocomplete="current-password"><input id="pn" type="password" placeholder="${t('pf_pwdNew')}" autocomplete="new-password"><button class="p" data-act="pwd" style="width:100%">${ic('shield',18)} ${t('pf_pwd')}</button></div>
 ${secT('history',t('pf_work'))}<div class="card">${mine.slice(0,20).map(o=>`<div class="stat"><div><b>${o.type==='cut'?(o.items||[]).map(i=>esc(i.a)+' '+esc(i.s)+' × '+i.q).join(', '):esc(o.reason||'')}</b><div class="mu xs">${fmtDT(o.tms)} · ${esc(o.rno)} · ${esc(cName(o.col,o.colName))} №${esc(o.shade)}</div></div><b>${kg(Math.abs(o.w))} ${t('kg')}</b></div>`).join('')||empty('scissors',t('none'))}</div>
 <button class="d" data-act="logout" style="width:100%;margin-top:10px">${ic('logout',18)} ${t('logout')}</button>`}
function resizePhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=256,c=document.createElement('canvas');const k=Math.min(im.width,im.height);c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,s,s);let q=.72,u=c.toDataURL('image/jpeg',q);while(u.length>55000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function changePwd(){const o=($('#po')||{}).value||'',n=($('#pn')||{}).value||'';if(n.length<6){bad(t('sf_passBad'));return}try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,o));await updatePassword(auth.currentUser,n);ok(t('saved'));$('#po').value='';$('#pn').value=''}catch(e){bad(e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')?t('badLogin'):errTxt(e))}}
/* ===== События ===== */
const keepFocus=sel=>{const a=document.querySelector(sel);if(a){a.focus();try{const n=a.value.length;a.setSelectionRange(n,n)}catch(e){}}};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-tab],[data-act],[data-lang],[data-rf],[data-rfm],[data-roll],[data-cc],[data-pf],[data-hrange],[data-saveperm]');if(!el)return;const d=el.dataset;
 if(d.tab){go(d.tab);return}
 if(d.lang){S.lang=d.lang;applyPrefs();try{localStorage.setItem('cut_lang',S.lang)}catch(x){}showLogin();return}
 if(d.rf){const [k,v]=d.rf.split('|');S.rf[k]=v;if(k==='cat'||k==='mt'){S.rf.col='';S.rf.shade=''}render();return}
 if(d.rfm){const [k,v]=d.rfm.split('|');S.rfm[k]=v;if(k==='cat'||k==='mt')S.rfm.col='';rollFormShow();return}
 if(d.roll){rollDetail(d.roll);return}
 if(d.cc){const [k,v]=d.cc.split('|');S.cut[k]=v;if(k==='cat'||k==='mt'){S.cut.col='';S.cut.shade='';S.cut.roll=''}render();return}
 if(d.pf){S.pf.view=d.pf;render();return}
 if(d.hrange){S.hf.range=d.hrange;render();return}
 if(d.saveperm){const id=d.saveperm,p={};document.querySelectorAll(`[data-pp^="${CSS.escape(id)}|"]`).forEach(c=>p[c.dataset.pp.split('|')[1]]=c.checked);const role=(document.querySelector(`[data-prole="${CSS.escape(id)}"]`)||{}).value||'cutter';try{await updateDoc(doc(db,'cut_profiles',id),{p:permsFull(p),role});audit('perms',id);ok(t('sf_saved'))}catch(x){bad(errTxt(x))}return}
 const a=d.act;
 if(a==='login')doLogin();else if(a==='logout'){await signOut(auth)}else if(a==='savename')saveName();
 else if(a==='langtog'){S.lang=S.lang==='ru'?'uz':'ru';applyPrefs();savePrefs();shell()}
 else if(a==='setlang'){S.lang=d.v;applyPrefs();savePrefs();shell()}
 else if(a==='theme'){S.theme=S.theme==='dark'?'light':'dark';applyPrefs();savePrefs();shell()}
 else if(a==='settheme'){S.theme=d.v;applyPrefs();savePrefs();shell()}
 else if(a==='mclose')closeModal();
 else if(a==='rollnew')rollFormOpen();else if(a==='rollsave')rollSave();else if(a==='rolledit'){rollEditOpen(d.id)}else if(a==='rolleditsave')rollEditSave();else if(a==='rolladj')rollAdjOpen(d.id);else if(a==='rolladjsave')rollAdjSave();
 else if(a==='coladd')colFormOpen(d.cat,d.mt);else if(a==='coledit')colFormOpen(null,null,d.id);else if(a==='colsave')colSave();else if(a==='colseed')colSeed(d.cat,d.mt);
 else if(a==='cladd'){S.cut.lines.push({a:'',s:'',q:''});render()}else if(a==='clrm'){S.cut.lines.splice(+d.i,1);if(!S.cut.lines.length)S.cut.lines.push({a:'',s:'',q:''});render()}
 else if(a==='cutsave')cutSave();else if(a==='plan')planCut(d.k);else if(a==='pst')setStatus(d.id,d.s);
 else if(a==='xlsx')exportXlsx();else if(a==='pdf')exportPdf();
 else if(a==='stadd'){S.sfm={login:'',pw:genPw(),name:'',role:'cutter',p:permsFull(ROLES.cutter)};staffAddShow()}
 else if(a==='stgen'){S.sfm.pw=genPw();staffAddShow()}else if(a==='stgen2'){S.sfn.pw=genPw();const i=document.querySelector('[data-sfn="pw"]');if(i)i.value=S.sfn.pw}
 else if(a==='stcreate')staffCreate();else if(a==='stnew')staffNewOpen(d.id);else if(a==='stnewsave')staffNewSave();
 else if(a==='sttoggle'){const p=S.profiles[d.id];if(p)try{await updateDoc(doc(db,'cut_profiles',d.id),{active:p.active===false});audit('toggle',d.id)}catch(x){bad(errTxt(x))}}
 else if(a==='stdel'){const p=S.profiles[d.id];if(p&&await confirmBox(t('sf_delTitle'),esc(p.name||p.login)+'<br>'+t('sf_delBody'),t('sf_del'),'d'))try{await deleteDoc(doc(db,'cut_profiles',d.id));audit('staff_delete',p.login);ok(t('deleted'))}catch(x){bad(errTxt(x))}}
 else if(a==='cfgsave')cfgSave();else if(a==='pwd')changePwd();});
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;
 if(d.in==='rq'){S.rf.q=el.value;render();keepFocus('[data-in="rq"]');return}
 if(d.in==='cq'){S.cf.q=el.value;render();keepFocus('[data-in="cq"]');return}
 if(d.rfi!==undefined){S.rfm[d.rfi]=el.value;return}if(d.rfe!==undefined){S.rfe[d.rfe]=el.value;return}if(d.radj!==undefined){S.radj[d.radj]=el.value;return}
 if(d.cfm!==undefined){S.cfm[d.cfm]=el.type==='checkbox'?el.checked:el.value;return}if(d.sfm!==undefined){S.sfm[d.sfm]=el.value;return}if(d.sfn!==undefined){S.sfn[d.sfn]=el.value;return}
 if(d.cci!==undefined){S.cut[d.cci]=el.value;return}
 if(d.cl!==undefined){const [i,k]=d.cl.split('|'),l=S.cut.lines[+i];if(l)l[k]=el.value;return}
 if(d.hf!==undefined){S.hf[d.hf]=el.value;clearTimeout(window._hft);window._hft=setTimeout(()=>{render();const s=document.querySelector(`[data-hf="${d.hf}"]`);if(s&&s.type!=='date')keepFocus(`[data-hf="${d.hf}"]`)},350);return}
 if(d.cfgv!==undefined){S.cfgDraft=S.cfgDraft||{};S.cfgDraft[d.cfgv]=el.value}});
document.addEventListener('change',async e=>{const el=e.target,d=el.dataset;
 if(d.rfs!==undefined){S.rf[d.rfs]=el.value;if(d.rfs==='col')S.rf.shade='';render();return}
 if(d.rfms!==undefined){S.rfm[d.rfms]=el.value;rollFormShow();return}
 if(d.ccs!==undefined){const k=d.ccs;S.cut[k]=el.value;if(k==='col'){S.cut.shade='';S.cut.roll=''}if(k==='shade')S.cut.roll='';if(k==='po'&&el.value){const o=S.prod[el.value];if(o&&o.items&&o.items.length)S.cut.lines=o.items.map(i=>({a:i.a,s:i.s,q:String(i.q)}))}render();return}
 if(d.cl!==undefined){const [i,k]=d.cl.split('|'),l=S.cut.lines[+i];if(l){l[k]=el.value;if(k==='a')render()}return}
 if(d.hfs!==undefined){S.hf[d.hfs]=el.value;render();return}
 if(d.cmpf!==undefined){S.cf[d.cmpf]=el.checked;render();return}
 if(d.cfm==='active'){S.cfm.active=el.checked;return}
 if(d.sfms==='role'){S.sfm.role=el.value;S.sfm.p=permsFull(ROLES[el.value]);staffAddShow();return}
 if(d.sfp!==undefined){S.sfm.p[d.sfp]=el.checked;return}
 if(d.prole!==undefined){const r=ROLES[el.value]||{};PERMS.forEach(k=>{const c=document.querySelector(`[data-pp="${CSS.escape(d.prole)}|${k}"]`);if(c)c.checked=!!r[k]});return}
 if(d.snd!==undefined){S.snd.on=el.checked;savePrefs();return}
 if(el.id==='phf'&&el.files[0]){try{const u=await resizePhoto(el.files[0]);await updateDoc(doc(db,'cut_profiles',S.user.uid),{photo:u});S.prof.photo=u;shell();ok(t('saved'))}catch(x){bad(errTxt(x))}}});
if(location.hash==='#staff')S.tab='staff';

</script>
