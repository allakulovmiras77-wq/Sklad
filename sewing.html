<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LT Сотрудники</title>
<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#111827;--m:#6b7280;--p:#2563eb;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding:16px;max-width:560px;margin:auto}
.card{background:var(--c);border-radius:16px;padding:16px;margin-bottom:12px}
input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #cbd5e1;font-size:16px;margin-top:8px}
button{background:var(--p);color:#fff;border:0;font-weight:600}button.big{padding:22px;font-size:20px}
#clock{font-size:34px;font-weight:700}.mu{color:var(--m);font-size:14px}
#res{font-weight:600}.ok{color:var(--ok)}.er{color:var(--er)}
video{width:100%;border-radius:12px;margin-top:8px}
.h{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb}

.logo{display:block;width:min(70vw,260px);aspect-ratio:1;border-radius:22%;margin:8px auto 14px;box-shadow:0 10px 28px rgba(16,40,100,.35)}
.logo.sm{width:84px;margin:0 auto 8px;border-radius:22%}
.hero{position:relative;margin:-16px -16px 10px;padding:18px 0 14px;border-radius:16px 16px 28px 28px;background:linear-gradient(135deg,#0b2a6b,#1d5fd1 60%,#38bdf8);overflow:hidden;text-align:center}
.hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .logo{position:relative;width:104px;margin:0 auto;border:3px solid #fff;box-shadow:0 8px 22px rgba(0,0,0,.35)}
#nm{text-align:center;font-weight:800;font-size:28px;line-height:1.2;margin:6px 0 4px;overflow-wrap:anywhere}
#dt{text-align:center}#clock{text-align:center}
.trk{margin:12px 0;padding:14px;border-radius:18px;background:linear-gradient(135deg,#0b2a6b,#1d5fd1);color:#fff;text-align:center}
.trk .tl{font-size:14px;opacity:.85}.trk .tv{font-size:36px;font-weight:800;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.22);margin:6px 6px 2px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,#fff 0 8px,#bae6fd 8px 14px)}
.bar span{position:absolute;top:-9px;left:0;font-size:22px;transform:translateX(-50%);transition:left .6s}
.ts{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin:0 2px}
.trk .tn{font-size:13px;opacity:.9;margin-top:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{border-radius:16px;padding:12px;text-align:center;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.25)}
.tile b{display:block;font-size:13px;color:var(--m);font-weight:600}.tile span{font-size:26px;font-weight:800}.tile.on{background:rgba(22,163,74,.16);border-color:rgba(22,163,74,.4)}
button:disabled{opacity:.6}
.cr{text-align:center;font-weight:800;font-size:19px;letter-spacing:.14em;color:var(--m);margin:18px 0 6px}
/* переключатель языка */
.lg{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.lg button{width:auto;margin:0;padding:6px 14px;font-size:13px;border-radius:99px;background:transparent;color:var(--t);border:1px solid #94a3b8}
.lg button.on{background:var(--p);border-color:var(--p);color:#fff}
.hero .lg{position:absolute;top:10px;right:12px;z-index:2;margin:0}
.hero .lg button{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.14)}
.hero .lg button.on{background:#fff;color:#0b2a6b;border-color:#fff}
/* результат отметки */
.rs{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;line-height:1.35}
.rs.ok{background:rgba(22,163,74,.14);border:1px solid rgba(22,163,74,.45)}
.rs.er{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.45);animation:shk .45s}
.rs .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}
.rs.ok .ic{background:var(--ok);animation:pop .5s}.rs.er .ic{background:var(--er)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}60%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
button.big:not(:disabled){animation:pulse 2.2s infinite}

/* ===== панель часов / табель ===== */
.pn button{width:auto;margin:0;padding:10px 14px;font-size:14px}
.pn .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pn .sp{flex:1;min-width:0}
.pt{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.pt button{background:var(--c);color:var(--t);border:1px solid #cbd5e1;white-space:nowrap}.pt button.on{background:var(--p);color:#fff;border-color:var(--p)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.st div{border-radius:14px;padding:10px 6px;text-align:center;color:#fff;font-size:12px}.st b{display:block;font-size:24px}
.pw{border-left:5px solid #94a3b8}.pw.g{border-color:var(--ok)}.pw.r{border-color:var(--er)}.pw.y{border-color:#f59e0b}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1d5fd1,#38bdf8);color:#fff;font-weight:800}
.ch{display:inline-block;padding:3px 8px;border-radius:99px;font-size:12px;margin:3px 3px 0 0;background:rgba(22,163,74,.15);color:var(--ok);font-weight:600}.ch.o{background:rgba(220,38,38,.12);color:var(--er)}
.pb{height:9px;border-radius:9px;background:rgba(148,163,184,.3);margin:8px 0 2px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#38bdf8)}.pb i.f{background:linear-gradient(90deg,#16a34a,#4ade80)}
.bg{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:700;font-size:13px}.bg.g{background:rgba(22,163,74,.16);color:var(--ok)}.bg.r{background:rgba(220,38,38,.14);color:var(--er)}.bg.n{background:rgba(148,163,184,.25);color:var(--m)}
.pn table{width:100%;border-collapse:collapse;font-size:13px}.pn td,.pn th{padding:7px 4px;border-bottom:1px solid #e5e7eb;text-align:center}.pn td:first-child,.pn th:first-child{text-align:left}
.sb button.on{background:var(--ok)}
</style></head><body>

async function scanQR(){
 cancel=false;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('v');v.srcObject=stream;v.style.display='';$('cn').style.display='';await v.play();
 let det=null;if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']});
 else await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 try{while(true){await new Promise(r=>setTimeout(r,250));if(cancel)throw new Error('cancel');if(!v.videoWidth)continue;
  if(det){const b=await det.detect(v);if(b.length)return b[0].rawValue}
  else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const im=cx.getImageData(0,0,cv.width,cv.height),c=jsQR(im.data,cv.width,cv.height);if(c)return c.data}}}
 finally{stream.getTracks().forEach(tr=>tr.stop());v.style.display='none';$('cn').style.display='none'}}
$('cn').onclick=()=>{cancel=true};
$('sc').onclick=async()=>{
 snd();if(busy)return;busy=true;$('sc').disabled=true;say(t('locating'));
 try{
  const c=await loadCfg(true);
  if(!c||!(c.latitude&&c.longitude)||!c.qrToken||c.qrToken.length<16){say(t('cfgMissing'),'er');return}
  /* окно прихода и пауза перед уходом проверяются сразу, чтобы человек не ждал GPS зря */
  const {O}=times();
  if(!today.in&&tz()<O){say(t('winClosed',{t:hmm(O)}),'er');return}
  if(today.in&&!today.out&&Date.now()-today.in<COOL){say(t('waitOut'),'er');return}
  let p;try{p=await gps(c.maxAccuracy||50)}catch(e){say(e&&e.code===1?t('geoDenied'):e&&e.code===0?t('geoUnsup'):t('geoFail'),'er');return}
  if(p.coords.accuracy>(c.maxAccuracy||50)){say(t('weakGps',{a:Math.round(p.coords.accuracy),n:c.maxAccuracy||50}),'er');return}
  const dm=Math.round(dist(p.coords.latitude,p.coords.longitude,c.latitude,c.longitude));
  if(dm>(c.radiusMeters||100)){say(t('outside',{d:dm}),'er');return}
  say(t('aim'));let raw;try{raw=await scanQR()}catch(e){say(e&&e.message==='cancel'?t('cancelled'):t('camFail'),'er');return}
  if(!raw.startsWith('LTATT:')){say(t('badQr'),'er');return}
  if(raw.slice(6)!==c.qrToken){say(t('oldQr'),'er');return}
  const uid=auth.currentUser.uid,day=dayStr();
   const dq=await getDocs(query(collection(db,'hr_qr_events'),where('uid','==',uid),where('day','==',day)));
   const n=dq.size+1;if(n>MAXN){say(t('already'),'er');return}
   await setDoc(doc(db,'hr_qr_events',uid+'_'+day+'_'+n),{uid,staffId:prof.staffId,name:prof.name,day,n,type:n%2?'in':'out',lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),qr:c.qrToken,ts:serverTimestamp()});
say(t(n%2?'okIn':'okOut',{t:fmt({hour:'2-digit',minute:'2-digit'})}),'ok');loadHist();
 }catch(e){
  if(e&&e.code==='permission-denied'){
   let m=t('denied');
   try{const {O:O2}=times();if(!today.n&&tz()<O2)m=t('winClosed',{t:hmm(O2)});else if(today.last&&Date.now()-today.last<COOL)m=t('waitOut')}catch(_){}
   say(m,'er')}
  else say(t('net'),'er')}
 finally{busy=false;tick()}};
function clockTick(){$('clock').textContent=fmt({hour:'2-digit',minute:'2-digit',second:'2-digit'});$('dt').textContent=fmt({dateStyle:'full'})}
setInterval(()=>{clockTick();tick();if(prof&&Date.now()-cfgAt>300000)loadCfg(true).then(tick)},1000);

/* ===== ПАНЕЛЬ: старшая швея, владелец, бухгалтер и те, кому дан доступ ===== */
let PR='',PD={},pTab='day',pDate=dayStr(),pMon=dayStr().slice(0,7),pBoth=false;
const pEdit=()=>['sen','adm','acc','ed'].includes(PR);
async function pOpen(both){pBoth=both;$('panel').style.display='';if(!both)document.body.style.paddingTop='16px';pRender(true);await pLoad()}
async function pLoad(){
 try{try{const c=(await getDoc(doc(db,'app_config','sewing'))).data();if(c&&c.bankFrom)FROM=c.bankFrom}catch(e){}
  const [pp,ee,bb,aa]=await Promise.all([getDocs(collection(db,'hr_sew_profiles')),getDocs(query(collection(db,'hr_qr_events'),where('day','>=',FROM))),getDocs(collection(db,'hr_sew_bank')),getDocs(query(collection(db,'hr_qr_attendance'),where('day','>=',FROM)))]);
  const P=pp.docs.map(x=>({...x.data(),id:x.id})).filter(p=>p.active!==false&&!p.replacedBy).sort((a,b)=>String(a.name).localeCompare(b.name,'ru'));
  const E={};rowsOf(ee).forEach(e=>{((E[e.uid]=E[e.uid]||{})[e.day]=(E[e.uid][e.day]||[])).push(e)});
  const B={};bb.docs.forEach(x=>B[x.id]=x.data());const A={};aa.docs.forEach(x=>{const v=x.data();A[v.staffId+'_'+v.day]=v});
  PD={P,E,B,A,ok:1}}catch(e){PD={P:[],E:{},B:{},A:{},ok:0,err:e&&e.code==='permission-denied'?'Нет доступа: обновите правила Firebase':'Нет связи'}}
 pRender()}
function pStats(p){const ev=((PD.E[p.id]||{})[pDate]||[]).slice().sort((a,b)=>a.ms-b.ms),live=pDate===dayStr()&&dmin(Date.now())<B2,c=calc(ev,live),bal=balance(PD.E[p.id]||{},PD.B[p.id]);return {ev,c,bal}}
function pRender(loading){
 const el=$('panel');if(!PR)return;const T=[['day','📋 День'],['mon','📅 Месяц']];
 const hero=`<div class="card pn" style="background:linear-gradient(135deg,#0b2a6b,#1d5fd1 60%,#38bdf8);color:#fff"><div class="row"><div class="sp"><div style="font-size:20px;font-weight:800">Табель и банк часов</div><div style="opacity:.85;font-size:13px">${PR==='sen'?'Панель старшей швеи':PR==='adm'?'Владелец':PR==='acc'?'Бухгалтер':'Доступ к табелю'} · 09:00–13:00, 13:30–17:30</div></div>${pBoth?'':'<a href="index.html" style="color:#fff;font-weight:700;text-decoration:none">← Склад</a>'}<button id="pout" style="background:rgba(255,255,255,.2)">Выйти</button></div></div>`;
 const nav='<div class="pt pn">'+T.map(([k,n])=>`<button data-pt="${k}" class="${pTab===k?'on':''}">${n}</button>`).join('')+'</div>';
 let body='';if(loading||!PD.ok)body=`<div class="card mu">${loading?'Загрузка…':esc(PD.err||'')}</div>`;else body=pTab==='day'?pDay():pMonth();
 el.innerHTML='<div class="pn">'+hero+nav+body+'</div>';
 const pe=$('pout');if(pe)pe.onclick=()=>signOut(auth)}
function pDay(){
 const P=PD.P,R=P.map(p=>({p,...pStats(p)}));let come=0,minus=0,plus=0;R.forEach(r=>{if(r.ev.length)come++;if(r.bal<0)minus++;if(r.bal>0)plus++});
 const stt=`<div class="st"><div style="background:#2563eb"><b>${come}/${P.length}</b>пришли</div><div style="background:#16a34a"><b>${plus}</b>есть запас</div><div style="background:#dc2626"><b>${minus}</b>в минусе</div></div>`;
 const top=`<div class="card"><div class="row"><input type="date" id="pd" value="${pDate}" style="flex:1;margin:0"><button data-pa="go">Показать</button></div>${stt}<div class="mu">Часы считаются автоматически. Запас = (отработано − 8:00) за все дни с отметками + ручные поправки. Позже 17:30 и раньше 9:00 время не считается.</div></div>`;
 const rows=R.map(({p,ev,c,bal})=>{const ini=String(p.name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(),a=PD.A[p.staffId+'_'+pDate],miss=NORM-c.w;
  const cover=ev.length&&miss>0?(bal>=0?`<span class="bg g">покрыто запасом −${fw(miss)}</span>`:`<span class="bg r">не хватает ${fw(miss)}</span>`):ev.length?'<span class="bg g">полный день ✓</span>':'<span class="bg n">нет отметок</span>';
  const cl=!ev.length?'':c.w>=NORM||bal>=0?'g':'r';
  const sb=['Б','ПД','НБ'].map(v=>`<button data-pa="st" data-id="${p.id}" data-v="${v}" class="${a&&a.status===v?'on':''}" style="background:${a&&a.status===v?'var(--ok)':'var(--c)'};color:${a&&a.status===v?'#fff':'var(--t)'};border:1px solid #cbd5e1">${v}</button>`).join('');
  return `<div class="card pw ${cl}"><div class="row"><div class="av">${esc(ini)}</div><div class="sp"><b>${esc(p.name)}</b><div class="mu">отработано <b>${fw(c.w)}</b> из 8:00</div></div><span class="bg ${bal>0?'g':bal<0?'r':'n'}">${bal?fm(bal):'0:00'}</span></div>
  <div class="pb"><i class="${c.w>=NORM?'f':''}" style="width:${Math.min(100,c.w/NORM*100)}%"></i></div><div>${ev.map(e=>`<span class="ch ${e.n%2?'':'o'}">${e.n%2?'↘ приход':'↗ уход'} ${tm(e.ms)}</span>`).join('')}</div>
  <div class="row" style="margin-top:6px">${cover}${c.open?'<span class="bg r">нет ухода</span>':''}${a?`<span class="bg g">табель: ${esc(a.status)}</span>`:''}</div>
  ${pEdit()?`<div class="row" style="margin-top:8px">${sb}<button data-pa="adj" data-id="${p.id}" style="background:#f59e0b;color:#fff;border:0">± время</button></div>`:''}</div>`}).join('');
 return top+(rows||'<div class="card mu">Швей нет</div>')}
function pMonth(){
 const mo=pMon,R=PD.P.map(p=>{let d=0,w=0,b=0,h=0,n=0;const E=PD.E[p.id]||{};for(const k in E)if(k.slice(0,7)===mo){d++;w+=calc(E[k].slice().sort((x,y)=>x.ms-y.ms),false).w}
  for(const k in PD.A)if(PD.A[k].staffId===p.staffId&&PD.A[k].day.slice(0,7)===mo){const v=PD.A[k].status;if(v==='Б')b++;else if(v==='ПД')h++;else if(v==='НБ')n++}
  return `<tr><td>${esc(p.name)}</td><td>${d}</td><td>${fw(w)}</td><td>${b}/${h}/${n}</td><td><span class="bg ${balance(E,PD.B[p.id])>0?'g':balance(E,PD.B[p.id])<0?'r':'n'}">${fm(balance(E,PD.B[p.id]))}</span></td></tr>`}).join('');
 return `<div class="card"><div class="row"><b class="sp">${mo}</b><button data-pa="mp">‹</button><button data-pa="mn">›</button></div><div style="overflow-x:auto;margin-top:8px"><table><tr><th>ФИО</th><th>Дней</th><th>Часов</th><th>Б/ПД/НБ</th><th>Запас</th></tr>${R}</table></div><div class="mu" style="margin-top:6px">«Часов» — по QR-отметкам за месяц; запас — текущий банк часов.</div></div>`}
document.addEventListener('click',async e=>{
 const tb=e.target.closest('[data-pt]');if(tb){pTab=tb.dataset.pt;pRender();return}
 const b=e.target.closest('[data-pa]');if(!b||!PR)return;const a=b.dataset.pa;
 if(a==='go'){const v=$('pd').value;if(v){pDate=v;pRender()}return}
 if(a==='mp'||a==='mn'){let [y,m]=pMon.split('-').map(Number);m+=a==='mn'?1:-1;if(m<1){m=12;y--}if(m>12){m=1;y++}pMon=y+'-'+String(m).padStart(2,'0');pRender();return}
 if(!pEdit())return;const p=PD.P.find(x=>x.id===b.dataset.id);if(!p)return;const me=auth.currentUser.email;
 try{
  if(a==='st'){const v=b.dataset.v,old=PD.A[p.staffId+'_'+pDate],rec={staffId:p.staffId,name:p.name,day:pDate,status:v,by:me,byEmail:me,at:Date.now(),prev:old?old.status:'',act:old?'correct':'confirm',reason:''};
   await setDoc(doc(db,'hr_qr_attendance',p.staffId+'_'+pDate),rec);await addDoc(collection(db,'hr_qr_audit'),rec);PD.A[p.staffId+'_'+pDate]=rec;pRender()}
  if(a==='adj'){const s=prompt('Сколько изменить запас «'+p.name+'»? Часы:минуты. «+1:30» — добавить, «-0:40» — списать (например, ушла раньше)','+0:30');if(!s)return;
   const m=/^\s*([+\-−]?)\s*(\d{1,2})(?::(\d{1,2}))?\s*$/.exec(s);if(!m){alert('Формат: +1:30 или -0:40');return}
   const mins=(m[1]==='-'||m[1]==='−'?-1:1)*(+m[2]*60+ +(m[3]||0));const why=(prompt('Причина (необязательно):','')||'').trim().slice(0,100);
   const bk=PD.B[p.id]||{base:0,adj:[]},nb={base:bk.base||0,adj:[...(bk.adj||[]),{day:pDate,min:mins,why,by:me,at:Date.now()}]};
   await setDoc(doc(db,'hr_sew_bank',p.id),nb);PD.B[p.id]=nb;
   await addDoc(collection(db,'hr_qr_audit'),{act:'bank_adjust',by:me,at:Date.now(),name:p.name,day:pDate,status:fm(mins),prev:why}).catch(()=>{});pRender()}
 }catch(err){alert(err&&err.code==='permission-denied'?'Нет прав. Обновите правила Firebase.':'Нет связи')}});
applyLang();
</script></body></html>
