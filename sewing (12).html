<style>
:root{--bg:#eef2f9;--card:#fff;--tx:#0f1b33;--mu:#64718a;--ac:#1d5fd1;--acx:#fff;--bd:#dde4f0;--rd:#d23f31;--ok:#16a34a;--hd1:#0a1836;--hd2:#14397f;--sh:0 4px 18px rgba(16,40,90,.08)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:128px}
button{font:inherit;font-weight:700;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:12px 18px;min-height:52px;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}button:disabled{opacity:.55}
button.p{background:linear-gradient(135deg,#3b8bff,#1d5fd1);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(29,95,209,.35)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-height:52px;width:100%;min-width:0}
input:focus{outline:2px solid var(--ac)}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:14px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
h1{font-size:22px;font-weight:800;margin:4px 2px 12px}
/* вход */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--hd1),var(--hd2))}
#login .card{width:100%;max-width:380px;text-align:center}.logo{width:min(46vw,170px);aspect-ratio:1;border-radius:22%;margin:4px auto 10px;display:block;box-shadow:0 10px 28px rgba(16,40,100,.35)}
#login input{margin-top:10px}#login .pw{position:relative}#login .pw button{position:absolute;right:6px;top:16px;min-height:40px;padding:4px 12px;border:0;background:none;font-size:20px}
.lg{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.lg button{min-height:36px;padding:4px 14px;font-size:13px;border-radius:99px;background:transparent}.lg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.er{color:var(--rd);font-weight:600;margin-top:10px}
/* шапка */
#hd{background:linear-gradient(135deg,var(--hd1),var(--hd2) 70%,#2f6bff);color:#fff;border-radius:0 0 30px 30px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 18px;position:relative;overflow:hidden}
#hd:after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:#ffffff14}
#hd .t{display:flex;align-items:center;gap:12px;position:relative;z-index:1}#hd .logo{width:46px;margin:0;box-shadow:none;flex:none}
#hd b{display:block;font-size:19px;line-height:1.15}#hd small{opacity:.8;font-size:13px}
#hd .lg{margin:0}#hd .lg button{color:#fff;border-color:#ffffff66;background:#ffffff1f}#hd .lg button.on{background:#fff;color:#0a1836;border-color:#fff}
#hd .ck{position:relative;z-index:1;margin-top:10px;display:flex;justify-content:space-between;align-items:flex-end}
#clock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}#dt{font-size:13px;opacity:.85;text-align:right;text-transform:capitalize}
/* кнопка сканера */
.big{width:100%;min-height:96px;border:0;border-radius:26px;font-size:21px;font-weight:900;color:#fff;letter-spacing:.2px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;line-height:1.2;padding:14px 18px}
.big.in{background:linear-gradient(135deg,#22c55e,#0f9d58);box-shadow:0 12px 28px rgba(22,163,74,.45)}.big.out{background:linear-gradient(135deg,#ff8a3d,#e5484d);box-shadow:0 12px 28px rgba(229,72,77,.4)}
.big:disabled{background:var(--bd);color:var(--mu);box-shadow:none;opacity:1;font-size:17px}.big svg{width:38px;height:38px;flex:none}
.big:not(:disabled){animation:pulse 2.2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.st{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;margin-bottom:12px}
.st .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;color:#fff}
.st b{display:block;font-size:18px}.st.no{background:rgba(100,113,138,.14)}.st.no .ic{background:#94a3b8}.st.in{background:rgba(22,163,74,.14)}.st.in .ic{background:var(--ok)}
.st.out{background:rgba(245,158,11,.16)}.st.out .ic{background:#f59e0b}.st.done{background:rgba(76,141,255,.15)}.st.done .ic{background:#3b82f6}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center;box-shadow:var(--sh)}.tile b{display:block;font-size:12px;color:var(--mu);font-weight:700;min-height:30px}.tile span{font-size:20px;font-weight:900;line-height:1.1;display:block}
.pos{color:var(--ok)}.neg{color:var(--rd)}
.trk{padding:14px;border-radius:20px;background:linear-gradient(135deg,#0b2a6b,#1d5fd1);color:#fff;margin:12px 0}
.trk .tv{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}.trk .tl{font-size:13px;opacity:.85}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.22);margin:12px 6px 2px}.bar i{display:block;height:100%;width:0;border-radius:99px;background:repeating-linear-gradient(90deg,#fff 0 8px,#bae6fd 8px 14px)}
.bar span{position:absolute;top:-9px;left:0;font-size:22px;transform:translateX(-50%);transition:left .6s}
.ts{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin:0 2px}
.tl3{display:flex;gap:6px;font-size:11px;margin-top:8px;opacity:.9}.tl3 div{text-align:center;border-radius:8px;padding:4px 2px;background:#ffffff22}
.how{display:flex;gap:8px;margin:12px 0}.how div{flex:1;text-align:center;font-size:12px;color:var(--mu);font-weight:600}.how i{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 4px;border-radius:50%;background:var(--ac);color:var(--acx);font-style:normal;font-weight:900}
.rs{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;margin-top:12px;line-height:1.35}
.rs.ok{background:rgba(22,163,74,.14);border:1px solid rgba(22,163,74,.45)}.rs.er{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.45);animation:shk .45s}
.rs .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800}.rs.ok .ic{background:var(--ok);animation:pop .5s}.rs.er .ic{background:var(--rd)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tk span{padding:4px 11px;border-radius:99px;font-weight:800;font-size:14px;background:var(--bg);border:1px solid var(--bd)}.tk .i{color:var(--ok)}.tk .o{color:var(--rd)}
/* навигация */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;background:linear-gradient(135deg,var(--hd1),var(--hd2));border-radius:24px 24px 0 0;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;background:none;color:#9db3dd;padding:8px 2px;min-height:58px;font-size:12px;box-shadow:none}nav button svg{width:25px;height:25px}nav button.on{color:#fff}
nav button.fab{width:70px;height:70px;min-height:70px;border-radius:50%;margin:-34px auto 0;padding:0;justify-content:center;align-items:center;gap:0;background:linear-gradient(135deg,#22c55e,#0f9d58);color:#fff;border:5px solid var(--bg);box-shadow:0 8px 22px rgba(22,163,74,.55)}nav button.fab.out{background:linear-gradient(135deg,#ff8a3d,#e5484d);box-shadow:0 8px 22px rgba(229,72,77,.5)}nav button.fab svg{width:32px;height:32px}
/* табель, история */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mn{display:flex;gap:8px;align-items:center;margin-bottom:10px}.mn button{min-width:52px}.mn b{flex:1;text-align:center;text-transform:capitalize}
.dr{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}.dr.td{outline:2px solid var(--ac)}
.dr .d{width:44px;text-align:center;font-weight:900;font-size:20px;line-height:1}.dr .d small{display:block;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;margin-top:2px}.dr .d.su{color:var(--rd)}
.dr .m{flex:1;min-width:0;font-size:13px}.dr .m b{font-size:15px}
.ch{flex:none;min-width:44px;text-align:center;padding:6px 10px;border-radius:12px;font-weight:900;font-size:15px;border:2px solid transparent}
.ch.Б{background:#22c55e;color:#fff}.ch.ПД{background:#f59e0b;color:#2b2000}.ch.НБ{background:#ef4444;color:#fff}.ch.au{background:transparent;border-style:dashed;opacity:.7}.ch.Б.au{color:#16a34a;border-color:#16a34a}.ch.ПД.au{color:#c77d00;border-color:#f59e0b}.ch.НБ.au{color:#ef4444;border-color:#ef4444}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mu);margin:8px 2px 12px}
.hc{margin-bottom:12px}.hc .hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hc .pr{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}.hc .pr .n{font-size:12px;color:var(--mu)}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;border-radius:20px;margin-bottom:10px;min-height:68px;box-shadow:var(--sh)}.mi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:22px;flex:none;background:linear-gradient(135deg,#2f6bff,#5aa2ff)}.mi.g .ic{background:linear-gradient(135deg,#10a56b,#42d392)}.mi.o .ic{background:linear-gradient(135deg,#f08a1c,#ffc14d)}.mi.r .ic{background:linear-gradient(135deg,#e5484d,#ff8a80)}.mi .t{flex:1;font-weight:800}.mi .t span{display:block;font-weight:500;font-size:13px;color:var(--mu)}
.pay{background:linear-gradient(135deg,#0d8a5a,#1fbf84);color:#fff;border-radius:24px;padding:18px;margin-bottom:12px;text-align:center;box-shadow:0 12px 28px rgba(16,150,100,.35)}.pay small{opacity:.9}.pay b{display:block;font-size:38px;font-weight:900;margin:4px 0;line-height:1.1}
.ln{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.ln:last-child{border:0}.ln b{white-space:nowrap}
.ill{display:block;margin:6px auto 10px;width:130px}

.frame{position:absolute;left:50%;top:44%;width:min(76vw,330px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:26px;box-shadow:0 0 0 100vmax rgba(0,0,0,.58);z-index:2}

@keyframes scl{from{top:5%}to{top:95%}}
.okp{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:900;opacity:0;pointer-events:none}
.frame.ok .okp{background:#3be28f;color:#04361f;animation:okp .9s ease}.frame.ok .okp:before{content:"✓"}.frame.bad .okp{background:#ff5a4d;color:#fff;animation:okp .7s ease}.frame.bad .okp:before{content:"✕"}

#cam .gps{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:3;padding:10px 18px;border-radius:99px;background:#000a;color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
#cam .gps.ok{background:#16a34add}
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--card);width:100%;max-width:560px;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}.sh h3{margin:0 0 6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:20px;z-index:99;display:none;max-width:90%;text-align:center}
.cr{text-align:center;font-weight:800;font-size:15px;letter-spacing:.16em;color:var(--mu);margin:18px 0 6px}

/* ===== Зарплата и «Ещё» ===== */
/* Тот же алгоритм, что hrCalc в index.html (Бухгалтерия → Расчёт): только сохранённые отметки, воскресенья по неделе пн–сб.
   Оклад, удержание за день, аванс, премия и штраф берутся из записи бухгалтера (hr_sew_rates). */
function accPay(mo,R){
  const cache={},marksOf=m=>cache[m]||(cache[m]=(()=>{const d=(docs[m]||{}).marks||{},o={};for(const k in d){const c=SW.nm(d[k]);if(c)o[k]=c}return o})());
  const [y,m0]=mo.split('-').map(Number),nd=new Date(y,m0,0).getDate(),M=marksOf(mo),day=R.type==='day',sun={};
  if(!day)for(let d=1;d<=nd;d++){if(new Date(y,m0-1,d).getDay()!==0)continue;const dd=String(d).padStart(2,'0');if(M[dd])continue;let tot=0,lost=0;
    for(let b=6;b>=1;b--){const dt=new Date(y,m0-1,d-b),k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),v=marksOf(k)[String(dt.getDate()).padStart(2,'0')];tot+=v==='Б'?1:v==='ПД'?.5:0;lost+=v==='НБ'?1:v==='ПД'?.5:0}
    if(tot>=4.5)sun[dd]='Б';else if(lost>=2||dayStr()>=new Date(Date.UTC(y,m0-1,d-1)).toISOString().slice(0,10))sun[dd]='НБ'}
  let P=0,H=0,A=0;for(const d in M){const c=M[d];if(c==='Б')P++;else if(c==='ПД')H++;else if(c==='НБ')A++}
  const S=Object.values(sun).filter(v=>v==='НБ').length;P+=Object.values(sun).filter(v=>v==='Б').length;
  const pay=+R.pay||0,rate=+R.ded||66000;let gross,ded=0;
  if(day)gross=pay*(P+H*.5);else{ded=rate*(A+H*.5+S);gross=Math.max(0,pay-ded)}
  const bonus=+R.bonus||0,fine=+R.fine||0,adv=+R.adv||0;
  return {P,H,A,Sn:S,base:pay,ded:Math.round(ded),gross:Math.round(gross),bonus,fine,adv,net:Math.round(gross+bonus-fine-adv),type:day?'day':'month'};
}

const dist=(a,b,c,d)=>{const R=6371000,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const setHint=(m)=>{$('chint').textContent=m};
const fb=(c)=>{const f=$('cfr');f.classList.remove('ok','bad');void f.offsetWidth;f.classList.add(c);setTimeout(()=>f.classList.remove(c),900)};
function gpsStart(maxAcc){
  const g={best:null,err:null,id:null};
  const upd=()=>{const el=$('cgps');if(!el)return;if(g.best){const a=Math.round(g.best.coords.accuracy),ok=a<=maxAcc;el.textContent=ok?t('gpsOk',{m:a}):t('gpsWait')+' ±'+a+' м';el.className='gps'+(ok?' ok':'')}else el.textContent=t('gpsWait')};
  upd();if(!navigator.geolocation){g.err={code:0};return g}
  g.id=navigator.geolocation.watchPosition(p=>{if(!g.best||p.coords.accuracy<g.best.coords.accuracy)g.best=p;upd()},e=>{g.err=e},{enableHighAccuracy:true,maximumAge:0,timeout:30000});

}
const gpsStop=g=>{try{navigator.geolocation.clearWatch(g.id)}catch(e){}};
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function readQR(valid){
  const v=$('cv');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});v.srcObject=stream;await v.play();
  let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}
  if(!det)await loadJsQR();

  try{while(true){
    await new Promise(r=>setTimeout(r,140));if(cancel)throw new Error('cancel');if(!v.videoWidth)continue;
    let raw=null;
    if(det){const b=await det.detect(v);if(b.length)raw=b[0].rawValue}
    else{const w=Math.min(800,v.videoWidth);cv.width=w;cv.height=Math.round(v.videoHeight*w/v.videoWidth);cx.drawImage(v,0,0,cv.width,cv.height);const c=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(c)raw=c.data}

async function scan(){
  if(busy)return;snd();
  if(tab!=='home'){await go('home')}
  const a=nextAct();if(a.dis){toast(a.label);badSound();return}
  busy=true;resMsg=null;let g=null;
  try{
    const c=await loadCfg(true);
    if(!c||!(c.latitude&&c.longitude)||!c.qrToken||c.qrToken.length<16)return fail('cfgMissing');
    await loadEv();const a2=nextAct();if(a2.dis){render();return toast(a2.label)}
    const type=a2.type,n=a2.n+1,maxAcc=c.maxAccuracy||50,rad=c.radiusMeters||100;
    cancel=false;$('cam').classList.add('show');$('ct').textContent=t(type==='in'?'camIn':'camOut');setHint(t('aim'));startSound();g=gpsStart(maxAcc);
    let raw;try{raw=await readQR(r=>!r.startsWith('LTATT:')?'badQr':(r.slice(6)!==c.qrToken?'oldQr':''))}catch(e){closeCam();return fail(e&&e.message==='cancel'?'cancelled':'camFail')}

    const p=g.best;
    if(!p){closeCam();return fail(g.err&&g.err.code===1?'geoDenied':g.err&&g.err.code===0?'geoUnsup':'geoFail')}
    if(p.coords.accuracy>maxAcc){closeCam();return fail('weakGps',{a:Math.round(p.coords.accuracy),n:maxAcc})}
    const dm=Math.round(dist(p.coords.latitude,p.coords.longitude,c.latitude,c.longitude));
    const far=dm>rad;if(far&&dm>600){closeCam();return fail('outside',{d:dm})} // до 600 м принимается, но подтверждает владелец
    setHint(t('saving'));const uid=auth.currentUser.uid,day=dayStr();
    await setDoc(doc(db,'hr_qr_events',uid+'_'+day+'_'+n),{uid,staffId:prof.staffId,name:prof.name,day,n,type,lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),qr:c.qrToken,dist:dm,...(far?{far:true}:{}),ts:serverTimestamp()});

    const T0=T(),nowM=SW.minOf(Date.now()),sub=type==='in'?(nowM<T0.start?t('cntFrom',{t:SW.hm(T0.start)}):''):(nowM>T0.end?t('cntTo',{t:SW.hm(T0.end)}):'');
    resMsg={k:'ok',m:t(type==='in'?'okIn':'okOut',{t:fmt({hour:'2-digit',minute:'2-digit',hourCycle:'h23'})}),s:far?t('okFar',{d:dm}):sub};
    await loadEv();await render();
  }catch(e){
    closeCam();
    if(e&&e.code==='permission-denied'){fail('denied')}else{fail('net')}
  }finally{if(g)gpsStop(g);busy=false;closeCam();tick()}
}

      setProfile:(id,patch)=>setDoc(doc(db,'hr_sew_profiles',id),patch,{merge:true}),
      meta:async()=>{try{const s=await getDoc(doc(db,'hr_sew_meta','order'));return s.exists()?s.data():{}}catch(e){return{}}},
      eventsMonth:async mo=>{const a=evMap(await getDocs(query(collection(db,'hr_qr_events'),where('day','>=',mo+'-01'),where('day','<=',mo+'-31'))));
        let b=[];try{b=evMap(await getDocs(query(collection(db,'hr_wh_scans'),where('day','>=',mo+'-01'),where('day','<=',mo+'-31'))))}catch(e){}return a.concat(b)}, // + сотрудники склада со сканером (hr_wh_scans)
      daysMonth:async mo=>(await getDocs(query(collection(db,'hr_sew_days'),where('month','==',mo)))).docs.map(x=>x.data()),
      saveDay:(uid,mo,patch)=>setDoc(doc(db,'hr_sew_days',uid+'_'+mo),{uid,month:mo,...patch},{merge:true}),
      watchDays:(mo,cb)=>onSnapshot(query(collection(db,'hr_sew_days'),where('month','==',mo)),s=>cb(s.docs.map(x=>x.data())),()=>{}),
      reserve:(uid,mo,dd,delta,add,rem,st)=>{const e={r:increment(delta)};if(add)e.log=arrayUnion(add);else if(rem)e.log=arrayRemove(rem);
        return setDoc(doc(db,'hr_sew_days',uid+'_'+mo),{uid,month:mo,...(st.staffId?{staffId:st.staffId}:{}),name:st.name,ed:{[dd]:e},upd:{by:st.by,at:Date.now()}},{merge:true})},
      audit:rec=>addDoc(collection(db,'hr_qr_audit'),rec),
      watchDay:(day,cb)=>{let A=[],B=[];const f=()=>cb(A.concat(B));const u1=onSnapshot(query(collection(db,'hr_qr_events'),where('day','==',day)),s=>{A=evMap(s);f()},()=>{});
        const u2=onSnapshot(query(collection(db,'hr_wh_scans'),where('day','==',day)),s=>{B=evMap(s);f()},()=>{});return()=>{u1();u2()}}
    }});
}
onAuthStateChanged(auth,async u=>{
  if(!u){$('login').style.display='';$('app').style.display='none';prof=null;docs={};rates={};evAll=[];liveStop();SEWPANEL.reset();return}
  const s=await getDoc(doc(db,'hr_sew_profiles',u.uid)).catch(()=>null);
  if(!s||!s.exists()||s.data().active===false){await signOut(auth);$('lm').textContent=t('noProfile');return}
  prof=s.data();viewMo=nowMo();$('nm').textContent=prof.name;$('login').style.display='none';$('app').style.display='';
  $('rl').textContent=isSenior()?t('roleS'):t('role');tab='home';
  await loadAll(true);if(isSenior())initPanel();await render();pushSync();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&prof&&!busy&&(tab==='home'||tab==='tab'||tab==='hist')){loadAll(true).then(render)}});
setInterval(tick,1000);
applyLang();
</script></body></html>
